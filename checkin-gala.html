<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Check-in Gala · Gala 20 Năm</title>
<style>
 :root{--gold:#d8b876;--gold-b:#f4e2b0;--cream:#f5efe1;--muted:#b9b096;--muted2:#8f886f;
  --line:rgba(216,184,118,.2);--line2:rgba(216,184,118,.42);--card:rgba(255,255,255,.04);--green-ok:#43e08d;--amber:#f0b34a;
  --bg1:#0b1a30;--bg2:#0b2330;--bg3:#08111F;--sr1:rgba(11,26,48,.96);--sr2:rgba(11,26,48,.6);--ph1:#123f50;--ph2:#0b2340;
  --acc:#2E7FCC;--acc-dim:rgba(46,127,204,.12);--acc-glow:rgba(46,127,204,.3);}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 /* Trang này KHÔNG nạp webfont nào (không có <link> Google Fonts) — chỉ dùng
    font có sẵn của máy. Trước đây stack mở đầu bằng "Be Vietnam Pro" và
    "Playfair Display" nhưng không đâu tải chúng, nên hai tên đó chưa bao giờ
    khớp: CSS mô tả một thứ, máy chạy một thứ khác. Gỡ phần chết, GIỮ NGUYÊN
    thứ tự phần còn lại ⇒ hiển thị không đổi một pixel (Windows vẫn Segoe UI,
    macOS/iOS vẫn rơi về system-ui). Muốn dùng webfont thật thì thêm <link>,
    và cân nhắc: cửa chạy trên wifi hội trường, mỗi request là một rủi ro. */
 body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--cream);line-height:1.45;overflow-x:hidden;
  background:radial-gradient(800px 460px at 88% -8%,var(--acc-glow),transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed}
 body.jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;letter-spacing:.02em}
 h1,h2,h3{font-family:"Cambria",Georgia,serif;font-weight:600;margin:0}
 body.jp h2,body.jp .cn,body.jp .th .v,body.jp .v.big{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
 .num{font-variant-numeric:tabular-nums}
 .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(8,17,31,.95),rgba(8,17,31,.7));border-bottom:2px solid var(--acc);padding-top:env(safe-area-inset-top)}
 /* flex-wrap: trên mobile (~360px) hàng nút (日本語 · ↻ · Lịch · Sơ đồ) trước đây
    nowrap + body overflow-x:hidden → nút «Sơ đồ bàn» bị đẩy ra ngoài màn, PG
    tưởng mất nút. Xuống dòng + hàng nút phụ chiếm full width (cùng pattern CRM). */
 .top-in{display:flex;align-items:center;gap:9px;padding:10px 14px;flex-wrap:wrap}.logo{height:24px}
 .ttl{font-weight:800;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase;color:var(--acc)}
 .lang{margin-left:auto;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:6px 11px;font:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
 .lich{border:1px solid var(--line);background:rgba(5,13,24,.5);color:var(--cream);border-radius:8px;padding:6px 11px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
 @media(max-width:520px){
   #lichBtn,a.lich[href="/sodoban-gala.html"]{order:10;flex:1;justify-content:center;text-align:center}
   a.lich[href="/sodoban-gala.html"]{font-size:.7rem;padding:7px 8px}
 }
 .cnt{display:flex;align-items:stretch;gap:11px;padding:12px 14px}
 .big{flex:1;text-align:center;border:1.5px solid var(--acc);border-radius:16px;background:var(--acc-dim);padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
 .big .cl{font-size:.92rem;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
 .big .cn{font-size:2.7rem;font-weight:800;line-height:1;color:var(--acc)}.big .cn b{color:var(--muted);font-size:1.4rem;font-weight:600}
 .big .cs{font-size:.74rem;color:var(--muted)}
 .big{cursor:pointer;transition:.15s}.big.on{box-shadow:0 0 0 2px var(--acc) inset}
 .big.b-no{border-color:var(--line)}.big.b-no .cn{color:var(--cream,#e8dcc0)}
 /* E08-D028 CỬA-4 (nợ Gate 2): hai máy cùng một cửa đều đứng yên ở con số lúc
    mở trang — máy A điểm danh xong, máy B vẫn hiện số cũ tới hết buổi. Nút ↻
    và dòng giờ cập nhật để PG biết số đang cũ hay mới; polling lo phần còn lại. */
 /* Nút ↻ nằm ở THANH ĐẦU TRANG, không chen vào cụm hero: chen vào .cnt thì ở
    320px khối «ĐÃ ĐẾN» bị bóp còn 77px trong khi «CHƯA ĐẾN» giữ 165px (chuỗi
    «282/352» ở cỡ chữ 2.7rem không co được), header cao 207→267px và màn hết
    một thẻ khách. Dòng «Cập nhật …» cũng để NGOÀI header sticky vì header cao
    thêm là đè thêm lên ô tìm. */
 #rfBtn{font-size:1rem;line-height:1;color:var(--acc);border-color:var(--line2)}#rfBtn.busy{opacity:.45}
 .upd{text-align:center;color:var(--muted2);font-size:.7rem;padding:2px 14px 4px;min-height:1em}
 /* AC-F5 — nhãn nhận diện ngay trên LIST. Trước đây hạng VIP và quan hệ gia
    đình chỉ hiện khi mở hồ sơ, nên PG phải bấm từng thẻ mới biết ai là VIP hay
    người nhà TGĐ — đúng thứ cần biết TRƯỚC khi chào. */
 .bgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
 .bg{font-size:.6rem;font-weight:800;letter-spacing:.03em;border-radius:6px;padding:2px 6px;white-space:nowrap;line-height:1.5}
 .bg-vip{color:#2a1e05;background:linear-gradient(180deg,#f0d999,#cfa758)}
 .bg-gd{color:var(--acc);border:1px solid var(--line2);background:var(--acc-dim)}
 .bg-jp{color:var(--muted);border:1px solid var(--line)}
 /* E08-D031 — trạng thái THAM DỰ. Khác trục với «đã đến»: đây là khách CÓ dự
    sự kiện không (số vào báo cáo BTC), kia là đã tới cửa chưa. */
 /* E08-D033 — ba HÌNH khác nhau, màu chỉ là lớp thứ hai (AC-4). */
 .bg-att-khong{color:#2a1e05;background:#f0b34a;border:1px solid #f0b34a;border-radius:3px}
 .bg-att-cho{color:var(--muted);background:transparent;border:1.5px dashed var(--line2);border-radius:999px}
 /* E08-D040 — dải kho ảnh. THUMB, không phải ảnh gốc: D029 đo được ảnh gốc
    trung bình 1 455 KB còn thumb 17 KB — tỉ lệ 1/86. Dùng ảnh gốc ở đây là dựng
    lại đúng sự cố cửa Gala 13,03 MB. Giữ lazy (D027). */
 /* Ô lọc bàn: ô RIÊNG, không nhét vào dropdown sắp xếp — ở cửa cần lọc bàn
    VÀ giữ thứ tự đang xem cùng lúc. */
 /* Bàn = <select> chọn, không gõ tay. Phụ trách (#fPt) vẫn gõ. */
 .fban{width:100px;flex:none;border:1.5px solid var(--line2);background:rgba(5,13,24,.5);color:var(--cream);
   border-radius:12px;padding:9px 8px;font:inherit;font-size:.86rem;cursor:pointer}
 select.fban{appearance:auto}
 .fban.fpt{width:118px;cursor:text}
 .kho{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:14px}
 .kho .k1{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);flex:none}
 .kho .k1 img{width:100%;height:100%;object-fit:cover}
 .kho .k1.qua{outline:2px solid #f0b34a;outline-offset:-2px}
 .kho .k1.ghim{outline:2px solid var(--green-ok);outline-offset:-2px}
 .kho .qb{position:absolute;right:1px;bottom:1px;font-size:.62rem;line-height:1}
 .kho .cap{color:var(--muted2);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;width:100%;text-align:center;margin-bottom:2px}
 /* E08-D048 §3d — FEEDBACK SAU CHỤP. Toast một mình chưa đủ: Bizi cần thấy ĐÚNG
    TẤM vừa bấm đã vào kho, không phải chỉ một dòng chữ chung ở đáy màn. Viền
    xanh nhấp nháy 6 giây rồi TỰ TẮT (animation forwards) — không để lại trạng
    thái phải dọn, và không đụng viền `ghim`/`qua` của D040. */
 .kho .k1{cursor:zoom-in}
 .kho .k1.moi{animation:k1moi 6s ease-out 1 forwards}
 @keyframes k1moi{0%,60%{box-shadow:0 0 0 3px var(--green-ok),0 0 14px rgba(70,200,120,.75)}100%{box-shadow:0 0 0 0 rgba(70,200,120,0)}}
 /* E08-D048 §3c — LIGHTBOX album. M5: KHÔNG nạp trước cả album. Đo prod 06/08:
    preview trung bình 157 KB, lớn nhất 463 KB, album lớn nhất 4 tấm ⇒ nạp trước
    cả album là ~630 KB mỗi lần mở, ở cửa với sóng yếu là không chấp nhận được.
    Chỉ nạp bản preview của ĐÚNG tấm đang xem, đổi src khi lướt. */
 .lb{position:fixed;inset:0;z-index:100002;display:none}
 .lb.show{display:block}
 .lb .lb-bd{position:absolute;inset:0;background:rgba(3,8,16,.94)}
 .lb img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
   max-width:96vw;max-height:82vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
 .lb button{position:absolute;border:1px solid var(--line2);background:rgba(9,18,32,.85);
   color:#e9e2d2;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
 .lb .lb-x{top:14px;right:14px;padding:9px 15px;font-size:.82rem}
 .lb .lb-p,.lb .lb-n{top:50%;transform:translateY(-50%);width:46px;height:64px;font-size:1.7rem;line-height:1}
 .lb .lb-p{left:8px} .lb .lb-n{right:8px}
 .lb .lb-c{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:var(--muted);
   font-size:.8rem;letter-spacing:.06em}
 .lb .lb-q{position:absolute;left:50%;top:14px;transform:translateX(-50%);color:#f0b34a;font-size:.78rem;font-weight:700}
 .attd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green-ok);
   border:1px solid rgba(0,0,0,.45);vertical-align:middle;flex:none;align-self:center}
 /* E08-D036 — nút huỷ check-in. Cố ý NGƯỢC HẲN nút check-in (khối vàng đặc,
    full-width, padding 17px): viền rỗng, chữ nhỏ, hẹp, canh phải, nằm TRONG hộp
    xanh. Hai nút không bao giờ cùng có mặt (ciBox là ternary), nên rủi ro thật
    không phải bấm nhầm nút bên cạnh mà là TRÍ NHỚ CƠ BẮP VỀ VỊ TRÍ — tay quen
    bấm giữa màn. Khác vị trí + khác hình + hỏi lại là ba lớp chặn. */
 .undorow{display:flex;justify-content:flex-end;margin-top:10px}
 .undob{border:1.5px solid var(--line2);background:transparent;color:var(--muted);
   border-radius:10px;padding:7px 13px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
 .undob:disabled{opacity:.5;cursor:default}
 /* E08-D030 AC-11b: hạng VIP rời khỏi thân hồ sơ, lên GÓC ẢNH — chỗ trống đó
    dành cho khung Bàn + Ghế, thứ Ly cần đọc nhanh nhất ở cửa. */
 .pf-av{position:relative}
 /* E08-D089 · hạng VIP trong hồ sơ, cùng ngôn ngữ hình với chip ở danh sách:
    vàng, bo nhỏ, có ★, chỉ to hơn một nhịp vì đây là cự ly gần. Bản cũ bo 8px
    và không có sao — mở hồ sơ ra là thấy một thứ khác hẳn thứ vừa bấm vào. */
 .av-vip{display:inline-flex;align-items:center;gap:5px;
   font-family:"Arial Narrow",system-ui,sans-serif;   /* CỐ Ý không webfont */
   font-size:.72rem;font-weight:700;letter-spacing:.1em;white-space:nowrap;
   border-radius:5px;padding:5px 14px;color:#2a1c02;
   background:linear-gradient(160deg,#fff7dd 0%,var(--gold) 42%,#b8922e 100%);
   border:1px solid var(--gold-b);box-shadow:0 3px 12px rgba(184,150,63,.45)}
 .av-vip::before{content:"★";font-family:system-ui,"Apple Color Emoji",sans-serif;font-size:1.05em;line-height:1;
   text-shadow:0 1px 0 rgba(255,255,255,.5)}
 /* Ảnh hồ sơ của khách VIP: viền vàng + quầng, để nhận ra từ xa. */
 .pf-av.is-vip{box-shadow:0 0 0 3px var(--gold),0 0 0 6px rgba(216,184,118,.18),0 14px 34px rgba(184,150,63,.34)}
 /* AC-F7 (mock Ly): hồ sơ có pill HẠNG riêng dưới cụm BÀN/GHẾ. */
 .hangp{display:inline-block;margin:2px auto 12px;border:1px solid var(--line2);border-radius:11px;padding:5px 14px;background:rgba(5,13,24,.5)}
 .hangp .k{display:block;font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}
 .hangp b{font-size:1rem;color:var(--gold-b)}
 .pf-b .bgs{justify-content:center;margin:0 0 12px}
 /* AC-G4 (mock Ly) — khối GHI NHẬN TẠI QUẦY dưới CTA điểm danh. */
 .quay{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
 .quay h4{color:var(--acc);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin:0 0 12px;font-family:inherit;font-weight:800}
 .qf{margin-bottom:14px}
 .qf label{display:block;font-size:.8rem;font-weight:700;color:var(--cream);margin-bottom:6px}
 .qf textarea,.qf input{width:100%;font:inherit;font-size:.92rem;color:var(--cream);background:rgba(5,13,24,.6);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
 .qf textarea:focus,.qf input:focus{border-color:var(--acc)}
 .qnote{font-size:.72rem;color:var(--amber);margin-top:6px}
 .qh{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
 .qhh{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
 .qhr{font-size:.84rem;color:var(--cream);padding:7px 0;border-bottom:1px dashed var(--line)}
 .qhr b{color:var(--acc)}
 .qhm{font-size:.7rem;color:var(--muted2);margin-top:2px}
 .fb{border:1px solid var(--line);background:rgba(5,13,24,.5);color:var(--muted);border-radius:20px;padding:9px 14px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
 .fb .mk{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:none}.fb .xx{font-size:1rem}
 .fb.came.on{background:var(--green-ok);border-color:var(--green-ok);color:#042a17}.fb.no.on{background:var(--amber);border-color:var(--amber);color:#2a1e05}
 /* E08-D085 việc A · top:52px là chiều cao header ĐOÁN từ lúc viết. Header ở
    đây có padding-top:env(safe-area-inset-top) nên trên iPhone tai thỏ nó cao
    hơn 52px — khu tìm kiếm chui xuống dưới header và bị che. Và z-index:20
    thấp hơn header (30) nên khi lệch là bị đè hẳn. Nay dính đúng dưới chiều
    cao đo được, và nằm trên header về thứ tự xếp lớp. */
 .sr{padding:2px 14px 8px;position:sticky;top:var(--top-h,52px);z-index:20;background:linear-gradient(180deg,var(--sr1),var(--sr2));backdrop-filter:blur(8px)}
 /* Chỉ #q trong .box — KHÔNG dính #fBan. `.sr input` specificity thắng `.fban`
    (0,1,1 > 0,1,0) ⇒ ô Bàn width:100% nuốt cả hàng, ô tìm tên flex:1 còn ~0px
    (D038 LIVE 06/08 — Ly/Sponsor báo mất tìm tên). */
 .sr .box{position:relative}.sr .box input{width:100%;font:inherit;font-size:1rem;color:var(--cream);background:rgba(5,13,24,.6);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px 13px 42px;outline:none}
 .sr .box input:focus{border-color:var(--acc)}.sr .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
 /* padding-top 11px là CHỖ ĐỨNG cho stick: .quick cuộn ngang nên overflow-y
    tính là auto, stick nhô lên khỏi mép hộp sẽ bị cắt hoặc đẻ ra thanh cuộn dọc. */
 .quick{display:flex;gap:9px;padding:11px 14px 2px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 86%,rgba(0,0,0,.15));mask-image:linear-gradient(to right,#000 86%,rgba(0,0,0,.15))}.quick::-webkit-scrollbar{display:none}
 .qb{position:relative;flex:none;border:1px solid var(--line);background:rgba(5,13,24,.4);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
 .qb.on{border-color:var(--acc);background:var(--acc);color:#04121f}
 /* Stick đếm: PG nhìn một cái là biết cửa này có bao nhiêu VIP, bao nhiêu người
    nhà — không phải bấm từng nút. Số 0 VẪN hiện (Sponsor chốt): nút ra rỗng mà
    không có số trông như nút hỏng; có số 0 thì rõ là «không có khách», không
    phải «nút chết». */
 .qn{position:absolute;top:-7px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
   background:var(--acc);color:#04121f;font-size:.6rem;font-weight:800;line-height:18px;text-align:center;
   font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg1)}
 .qb.on .qn{background:var(--bg1);color:var(--acc)}
 .qn.zero{background:var(--line2);color:var(--bg1)}
 .hint{color:var(--muted2);font-size:.78rem;text-align:center;padding:6px}
 .list{padding:4px 14px 40px;display:flex;flex-direction:column;gap:8px}
 .gc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 11px;cursor:pointer}
 .gc.done{border-color:rgba(67,224,141,.4);background:rgba(67,224,141,.06)}
 /* ── E08-D088 · VIP theo đúng khuôn /crm (SoT: crm-app-v2.html .g.is-vip/.vip-chip) ──
    Hình dạng và vị trí đồng bộ; DÁNG CHỮ thì cố ý KHÔNG.
    CRM đặt chip bằng Oswald nạp từ Google Fonts. Hai trang cửa cố ý không nạp
    webfont nào — wifi hội trường không đáng tin, và chính repo này đã gỡ hai
    webfont "khai mà chưa bao giờ nạp" ở một vé trước. Nên chip ở đây dùng stack
    hệ thống. Hệ quả đã lường và đã ghi vào phiếu: chữ chip ở cửa KHÁC ở CRM —
    đó là kết quả đúng của ràng buộc, không phải lỗi thi công. */
 .gc{position:relative}
 .gc.is-vip{
   border:1.5px solid var(--gold);
   background:linear-gradient(105deg,rgba(216,184,118,.14) 0%,var(--card) 55%);
   box-shadow:0 0 0 1px rgba(216,184,118,.12),0 4px 14px rgba(184,150,63,.18);
 }
 /* D089 · VIP đã đến VẪN giữ viền vàng. Bản D088 cho `.done` đè lên và trả về
    viền xanh — nghĩa là khách VIP vừa check-in xong thì mất luôn dấu hiệu VIP,
    đúng lúc BTL cần nhận ra họ nhất. Việc đã đến đã có tag xanh bên phải nói rồi;
    hạng khách là thuộc tính CỐ ĐỊNH, không nên bị trạng thái nuốt mất. */
 .gc.is-vip.done{border-color:var(--gold);

function merge(rows){

/* E08-D028 AC-D — ảnh ngang không bị cắt mất người. Đo naturalWidth/Height khi
   ảnh load (CSS không đọc được tỉ lệ gốc); w/h >= 1.25 → nới bề rộng, giữ

function imgFit(el){try{if(!el||!el.naturalWidth||!el.naturalHeight)return;

/* E08-D029 — thu nhỏ ảnh NGAY TRÊN MÁY trước khi gửi. Máy chủ cố ý KHÔNG có thư
   viện ảnh: thêm một phụ thuộc biên dịch gốc (sharp) vào ảnh production ba ngày
   trước lễ mà build hỏng là cả app không deploy được. Ở đây lỗi chỉ làm mất bản
   phụ — ảnh gốc vẫn lưu bình thường, màn hình lùi về đúng hành vi cũ.
   Kèm một cái lợi thứ hai: PG chụp ảnh vài MB rồi tải lên trên chính cái wifi
   yếu đó; bản 256px chỉ ~22 KB. */
async function shrinkImg(file,max,q){
  try{
    if(!file||!/^image\//.test(file.type||""))return null;
    if(typeof createImageBitmap!=="function")return null;
    var bmp=await createImageBitmap(file);
    var s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    var nw=Math.max(1,Math.round(bmp.width*s)),nh=Math.max(1,Math.round(bmp.height*s));
    var cv=document.createElement("canvas");cv.width=nw;cv.height=nh;
    var cx=cv.getContext("2d");if(!cx)return null;
    cx.drawImage(bmp,0,0,nw,nh);
    if(bmp.close)bmp.close();
    var blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",q);});
    /* Ảnh vốn đã nhẹ hơn bản thu nhỏ thì giữ gốc — thêm object chỉ tổ nặng kho. */
    if(!blob||blob.size>=file.size)return null;
    return blob;
  }catch(e){return null;}
}
async function addShrunk(fd,file){

  var pv=await shrinkImg(file,1024,.8); if(pv)fd.append("preview",pv,"t1024.jpg");
  return fd;
}

/* Danh sách bàn THẬT trên list — loại chữ trạng thái (bgHien). Số gom 01→1. */
function banDanhSach(){

 for(var i=0;i<G.length;i++){
  var b=bgHien(G[i].banKey||G[i].table||G[i].seat); if(!b)continue;

  if(seen[k])continue; seen[k]=1;
  if(k.charAt(0)==="n")nums.push(String(parseInt(b,10))); else texts.push(b);
 }
 nums.sort(function(a,c){return (+a)-(+c);});
 texts.sort(function(a,c){return a.localeCompare(c,"vi");});

}

/* ═══ E08-D064 · THỨ TỰ DÒNG ═══════════════════════════════════════════════
   Ly 00:47: lọc một bàn ra 8 dòng thì thứ tự «như random», PG dò từng dòng tìm
   ghế trong khi khách đứng chờ. Trước vé này `renderList` KHÔNG sắp gì cả — dòng
   nằm đúng thứ tự máy chủ trả (`ORDER BY` của tuyến list), tức là theo trục
   chẳng liên quan gì tới chỗ ngồi.

   Sắp theo BÀN → GHẾ → TÊN, và sắp trên `rows` (mảng mới do .filter sinh ra),
   KHÔNG trên `G`: `G` là kho gốc mà `byId`, hồ sơ và vòng poll cùng đọc.

   CỬA TỌA ĐÀM vẫn hưởng phần BÀN: `table`/`ghe` rỗng theo D043/D030 nên màn
   không lộ chỗ ngồi, nhưng `banKey` vẫn giữ `table_no` (để ô lọc Bàn chạy được)
   ⇒ dòng vẫn nhóm theo bàn. Ghế luôn rỗng ⇒ vế thứ hai không đổi gì, rơi thẳng
   xuống so tên.

   Vì sao khoá sắp đi qua `bgHien()`: ~40 thẻ mang `table_no` = chữ trạng thái
   («Không tham dự»). `bgHien` ẩn chúng khỏi màn — nếu sắp bằng giá trị THÔ thì
   chúng nằm lẫn giữa nhóm bàn-chữ trong khi ô bàn hiện trống, tức mắt thấy một
   đằng thứ tự một nẻo. Sắp bằng ĐÚNG thứ đang hiện thì hai cái luôn khớp.

   `Intl.Collator` dựng MỘT lần: `renderList` chạy lại theo từng phím gõ ô tìm
   kiếm và mỗi vòng poll; `localeCompare` có locale gọi ~3.400 lần cho 393 dòng
   là đủ để thấy khựng trên máy PG. */
var COLL=(typeof Intl!=="undefined"&&Intl.Collator)?new Intl.Collator("vi"):null;
function cmpChu(a,b){return COLL?COLL.compare(a,b):String(a).localeCompare(String(b),"vi");}
/* Một ô có thể là SỐ ("17"), CHỮ ("Bàn nhân viên") hoặc RỖNG. Luật: rỗng xuống
   CUỐI · số trước chữ · số so bằng giá trị (để 9 đứng trước 10, không phải sau). */
function cmpO(a,b){
 var sa=String(a==null?"":a).trim(), sb=String(b==null?"":b).trim();
 if(!sa&&!sb)return 0;
 if(!sa)return 1;
 if(!sb)return -1;
 var na=/^\d+$/.test(sa)?parseInt(sa,10):null, nb=/^\d+$/.test(sb)?parseInt(sb,10):null;
 if(na!==null&&nb!==null)return na-nb;
 if(na!==null)return -1;
 if(nb!==null)return 1;
 return cmpChu(sa,sb);
}
function sxDong(a,b){
 return cmpO(bgHien(a.banKey),bgHien(b.banKey))
     || cmpO(bgHien(a.ghe),bgHien(b.ghe))
     || cmpChu(String(a.name||""),String(b.name||""));
}
function renderList(){
  /* Tính trên G — TOÀN BỘ roster của buổi này, KHÔNG phải rows đã lọc bên
     dưới. Lọc rồi mới tính thì đáp án đổi mỗi lần gõ tìm kiếm. Mỗi cửa tính
     riêng trên roster của mình, độc lập với /crm và với cửa kia. */
  var NGAY_SK_CUA=suyNgaySuKien(G.map(function(x){return x._came;}));quickCounts();napBanSelect();var rows=G.filter(match).filter(function(g){return banKhop(g.banKey||g.table||g.seat,st.ban);}).filter(function(g){return ptKhop(g.handler,st.pt);});
 rows.sort(sxDong);
 $("#hint").textContent=(st.q||st.quick||st.f||st.ban||st.pt)?t("res",{n:rows.length}):t("total",{n:G.length});
 $("#list").innerHTML=rows.map(function(g){var cm=came(g);var bn=bgHien(g.table),gh=bgHien(g.ghe);
  /* E08-D055 §4b — chấm check-in ĐÃ GỠ. Lý do nặng hơn «chấm khó đọc»: dòng này
     từng mang HAI chấm 9×9 tròn cùng màu --green-ok nói hai chuyện khác hẳn nhau
     — `.sd.came` (đã tới cửa) và `.attd` của D033 (có tham dự). Đổi sang chữ vừa
     dễ đọc vừa gỡ một chỗ đọc nhầm được. `.attd` GIỮ NGUYÊN, đó là trục khác. */
  var hangVip=hangOf(g);
  return '<div class="gc'+(cm?" done":"")+(hangVip?" is-vip":"")+'" data-id="'+esc(g.id)+'">'
    +(hangVip?'<span class="vip-chip">'+esc(hangVip)+'</span>':'')
   /* E08-D064 §2.1 — `.n2` trước đây là `title||org`: có chức vụ thì NUỐT đơn vị.
      Ly 00:47 — list cửa phải đọc được như CRM. Chép đúng khuôn v2 (:911):
      ghép cả hai bằng " · ", thiếu phía nào thì còn phía kia. KHÁC v2 một điểm
      có chủ đích: v2 rơi về "—" khi trống cả hai, list cửa để RỖNG (spec §2.1) —
      384 dòng mang một gạch ngang vô nghĩa chỉ tổ chật chỗ của tên. */
   +'<div class="av">'+av(g)+'</div><div class="gm"><div class="n1">'+pairVJ(g.name,g.name_jp)+'</div><div class="n2">'+pairVJ([g.org,g.title].filter(Boolean).join(" · "),[g.org_jp,g.title_jp].filter(Boolean).join(" · "))+'</div>'+badges(g)+'</div>'
   /* §4a — CỘT PHẢI (khuôn `.rb` của v2). Trước đây vùng phải là MỘT span đơn,
      XOR giữa giờ và pill Bàn; «Người phụ trách» thì nhét trong `.n2`, tức bên
      trái. Nay: phụ trách · (Bàn khi chưa đến) · trạng thái cửa.
      §3b — hai vế KHÁC TRỌNG LƯỢNG có chủ đích: 384/393 dòng sẽ mang «Chưa đến»
      lúc mở cửa, để nó nổi bằng «Đã đến» là cả màn thành một khối chữ — đúng cái
      bẫy D033/CR-38 đã tránh khi chọn chấm thay chữ. Đã đến = nền xanh nổi;
      chưa đến = chữ mờ, không nền, không viền. */
   +'<div class="rb">'
     +(g.handler?'<span class="pt" title="'+esc(t("phutrach"))+'" aria-label="'+esc(t("phutrach"))+': '+esc(g.handler)+'">&#128100; '+esc(g.handler)+'</span>':'')
     /* E08-D064 §2.2 — BÀN + GHẾ, và hiện CẢ KHI ĐÃ ĐẾN.
        Điều kiện `!cm` cũ giấu số bàn ngay sau khi điểm danh — đúng lúc PG cần
        nó nhất, vì việc kế tiếp là dẫn khách vào chỗ. Bỏ `!cm`.
        MỘT pill mang cả hai chứ không hai pill: `.rb` là cột dọc, hai pill là
        thêm một dòng cho MỌI khách có chỗ ngồi ⇒ dòng cao lên, PG thấy ít khách
        hơn mỗi màn. Đo 360px ở dưới xác nhận một pill không tràn.
        TỌA ĐÀM không cần nhánh riêng: `table` và `ghe` ra rỗng ngay từ `mapRow`
        (D043 · D030) ⇒ điều kiện tự sai ⇒ không lộ chỗ ngồi. */
     +((bn||gh)?'<span class="tb bg">'
        +(bn?'<span>'+t("ban")+'<b>'+esc(bn)+'</b></span>':'')
        /* Dấu phân cách là TEXT NODE thật, kèm khoảng trắng hai bên, chứ không
           phải `:before` của vế sau: nằm trong một span `nowrap` thì nó KHÔNG tạo
           được chỗ ngắt dòng, và pill bàn tên chữ phình 181px đè lên tên khách
           (đã dựng thử và chụp được cảnh đó trước khi chọn cách này). */
        +((bn&&gh)?' \u00b7 ':'')
        +(gh?'<span>'+t("ghe")+'<b>'+esc(gh)+'</b></span>':'')
       +'</span>':'')
     /* E08-D055 AC-6 · ĐƯỜNG LUI Sponsor duyệt sẵn — BỎ nhãn «X Chưa đến».
        Đo được: nhãn đó rộng 61,16px và hiện trên MỌI dòng chưa đến, kể cả dòng
        trước đây cột phải RỖNG hoàn toàn ⇒ một mình nó lấy 52px của TÊN ở ca D.
        Phương án xuống dòng không chạm được nó (chỉ sửa nhánh «đã đến»), nên
        đây là thứ duy nhất đóng được AC-6b. «Chưa đến» vẫn đọc được: không có
        huy hiệu xanh nghĩa là chưa đến — đúng quy ước D033 dùng cho nhóm đông. */
     +(cm?'<span class="ci-y">O '+t("btn_came")+nhanDaDen(cm,NGAY_SK_CUA)+'</span>':'')
   +'</div></div>';}).join("")||'<div class="hint">'+t("notfound")+'</div>';}

/* E08-D028 AC-C — chụp ảnh khách tại cửa → kệ MinIO.
   AC-C2 (Sponsor chốt): ĐIỂM DANH và ẢNH độc lập. Ảnh fail → báo đỏ, KHÔNG
   đụng tới trạng thái đã điểm danh. Ở cửa, thứ phải đúng là khách đã vào;
   ảnh là thứ chụp lại được, điểm danh thì không. */
var camFor=null,camQua=false;
function toast(msg,bad){var el=document.getElementById("ciToast");
  if(!el){el=document.createElement("div");el.id="ciToast";document.body.appendChild(el);}
  el.className="ci-toast"+(bad?" bad":"");el.textContent=msg;el.style.display="block";
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.display="none";},4200);}
async function sendPhoto(id,file,asGift){
  if(!file)return;
  if(!/^image\//.test(file.type||"")){toast(t("cam_notimg"),1);return;}
  // HEIC/HEIF: API cho qua nhưng TRÌNH DUYỆT KHÔNG HIỂN THỊ ĐƯỢC — Pha 2 đã phải
  // dọn 3 tấm kiểu này. Lưu vào thì thẻ có ảnh mà màn vẫn ra chữ viết tắt, tệ
  // hơn là không lưu. Từ chối kèm hướng dẫn đổi cài đặt máy.
  if(/heic|heif/i.test(file.type||'')||/\.(heic|heif)$/i.test(file.name||'')){toast(t('cam_heic'),1);return;}
  toast(t("cam_up"));
  /* Ảnh quà phải gắn vào một ghi nhận: tải lên trần như ảnh khách thì nó thành
     ẢNH MỚI NHẤT của thẻ, mà avatar ở cả 4 màn lấy đúng ảnh mới nhất — cái hộp
     quà sẽ thế chỗ mặt khách trên mọi danh sách, và không có route xoá ảnh.
     L-03: bản cũ tạo dòng ghi nhận NGAY Ở ĐÂY rồi mới gửi ảnh, nên ảnh hỏng ở
     bước sau (MinIO 503 — prod vừa dính đúng 8 phút) để lại dòng «Chụp ảnh quà»
     không có ảnh nào, và không xoá được. Nay chỉ GỬI KÈM nội dung; máy chủ tạo
     dòng ghi nhận SAU khi ảnh đã lên kệ, cùng transaction với dòng ảnh. */
  var fd=new FormData();fd.append("photo",file);
  await addShrunk(fd,file);
  var giftBody="";
  if(asGift){
    grabDraft();var gq=byId(id);
    giftBody=String((gq&&gq._q&&gq._q.tang)||"").trim()||t("q_camqua");
    fd.append("interaction_kind","anh-qua");
    fd.append("interaction_body",giftBody);
  }
  try{
    var r=await api("/crm/guests/"+id+"/photos",{method:"POST",body:fd});
    /* Hỏng thì bắt nạp lại lịch sử ở lần mở hồ sơ sau: openPf() chỉ gọi
       enrich() khi !_enriched, nếu không đánh dấu thì PG đóng-mở lại vẫn thấy
       lịch sử cũ và không biết trạng thái thật. */
    var gf=byId(id); if(gf)gf._enriched=false;
    if(r.status===401){toast(t("cam_auth"),1);return;}
    if(!r.ok){var e={};try{e=await r.json();}catch(_){}toast(e.error||t("cam_fail"),1);return;}
    var j={};try{j=await r.json();}catch(_){}
    var g=byId(id);
    /* E08-D048 §3d — đánh dấu ĐÚNG TẤM vừa lưu để kho ảnh viền xanh 6 giây.
       Chỉ đặt SAU khi máy chủ đã trả 201 kèm id — không có báo-xanh-đoán-trước.
       Xoá cờ sau 6,5s (dài hơn animation) để lần mở hồ sơ sau không nháy lại. */
    if(g&&j&&j.id){g._moi=String(j.id);
      setTimeout(function(){if(g._moi===String(j.id))g._moi="";},6500);}
    /* Ảnh quà KHÔNG được thay ảnh đại diện khách — chỉ nạp lại hồ sơ để lịch
       sử tại quầy hiện thêm dòng vừa ghi. */
    /* j.url là ảnh GỐC; list phải trỏ bản thu nhỏ, hồ sơ trỏ bản 1024. */
    if(g&&j&&j.url&&!asGift){g.photo=j.url+"/thumb";g.photoBig=j.url+"/preview";lastSig=sig();if(curId===id)openPf(id);renderList();}
    else if(g){
      /* Nội dung quà ĐÃ nằm trên dòng ghi nhận của tấm ảnh vừa lưu. Không xoá ô
         thì PG bấm tiếp «Lưu ghi nhận» sẽ đẻ thêm một dòng qua-tang cùng nội
         dung — hai dòng cho một món quà, mà không có route xoá. */
      if(asGift){var qt=document.getElementById("qTang");if(qt)qt.value="";
        if(g._q)g._q.tang="";}
      g._enriched=false;enrich(g,id);}
    /* §3d — «đã lưu» và «đã thành ảnh đại diện» là HAI việc khác nhau; Bizi phải
       phân biệt được, nếu không thì không biết còn phải nhờ chị Ly ghim nữa hay
       không. `j.ghim` do máy chủ trả (photos.js §3a), không phải màn tự đoán. */
    toast(asGift?t("q_saved"):(j&&j.ghim?t("cam_ok_ghim"):t("cam_ok")));
  }catch(err){toast(t("cam_net"),1);}
}

/* Ô «GHẾ» trước đây in ra g.seat — mà g.seat KHÔNG phải số ghế: parseNote bắt
   khoá «Số bàn (SoT)» của lô tgd116, tức một SỐ BÀN thứ hai. Đo prod: 0/378
   khách có đồng thời BÀN và «ghế», 30 khách chỉ có số bàn trong note còn cột
   table_no rỗng. Vậy: gộp hai nguồn đó làm BÀN, và chỉ hiện GHẾ khi thật sự có
   dữ liệu ghế (hiện chưa có nguồn nào — spec cấm tự xếp bàn/ghế). */
/* E08-D040 — dải KHO ẢNH. Sponsor đảo giới hạn của briefing §3.1: PG thấy ĐỦ
   ảnh của khách (cả ảnh quà), không giới hạn «ảnh lượt mình» — kho ảnh không
   chứa SĐT, và PG cần thấy đủ để biết đã chụp hay chưa.
   Không đặt trần cắt bớt: cắt âm thầm là đúng thứ đã cấm. Hôm nay nhiều nhất 2
   ảnh/khách ⇒ 2 thumb ≈ 34 KB; kể cả 5 tấm cũng chỉ ≈ 85 KB. */
function khoHtml(g){
 var ps=g._photos||[];
 if(!ps.length)return "";
 return '<div class="kho"><div class="cap">'+t("kho_h")+'</div>'
  +ps.map(function(p,i){
    var q=!!p.interaction_id, gh=String(p.id)===String(g._ghim||"");
    /* E08-D048 §3d — `moi` = tấm VỪA lưu xong ở lượt này (sendPhoto đặt g._moi
       sau khi máy chủ trả 201). §3c — `data-i` là chỉ số trong _photos để
       lightbox mở đúng tấm bấm vào, không phải luôn mở tấm đầu. */
    var mo=String(p.id)===String(g._moi||"");
    return '<span class="k1'+(q?' qua':'')+(gh?' ghim':'')+(mo?' moi':'')+'" data-idx="'+i+'"'+(q?' title="'+esc(t("q_tang"))+'"':'')+'>'
      /* thumb_url||url: một ảnh trên prod (#73) chưa có bản thu nhỏ — thiếu
         đường lùi này là tấm đó vỡ hình. */
      +'<img src="'+esc(p.thumb_url||p.url)+'" loading="lazy" decoding="async">'
      +(q?'<span class="qb">&#127873;</span>':'')+'</span>';}).join("")
  +'</div>';}

/* ─────────── E08-D048 §3c · LIGHTBOX kho ảnh ───────────
   Bấm thumb → xem lớn, ← → / vuốt để lướt HẾT `_photos` (chân dung + quà), đóng
   bằng nền · nút Đóng · phím Escape (AC-7).
   M5 — LAZY THẬT: chỉ đặt `src` cho ĐÚNG tấm đang xem. Đo prod 06/08: preview
   trung bình 157 KB / lớn nhất 463 KB, album lớn nhất 4 tấm ⇒ nạp trước cả album
   là ~630 KB một lần mở. Ở cửa, sóng yếu, đó là đúng lớp bệnh D029 đã dẹp. */
var lbList=[],lbIdx=-1,lbX0=null;
function lbEl(){return document.getElementById("lb");}
function lbDung(){
 if(lbEl())return;
 var d=document.createElement("div");d.id="lb";d.className="lb";
 d.innerHTML='<div class="lb-bd"></div><div class="lb-q" id="lbQ"></div><img id="lbImg" alt="">'
  +'<button class="lb-x" id="lbX">'+esc(t("close"))+'</button>'
  +'<button class="lb-p" id="lbP" aria-label="prev">&#8249;</button>'
  +'<button class="lb-n" id="lbN" aria-label="next">&#8250;</button><div class="lb-c" id="lbC"></div>';
 document.body.appendChild(d);
 d.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(b&&b.id==="lbP"){lbGo(-1);return;}
  if(b&&b.id==="lbN"){lbGo(1);return;}
  if(b&&b.id==="lbX"){lbDong();return;}
  /* Nền = đóng. Bấm trúng ảnh thì KHÔNG đóng — ở cửa tay hay chạm nhầm giữa màn. */
  if(e.target.id==="lbImg")return;
  lbDong();});
 /* Vuốt: chỉ tính khi đi ngang đủ 40px, kẻo cuộn dọc cũng nhảy ảnh. */
 d.addEventListener("touchstart",function(e){lbX0=e.touches[0].clientX;},{passive:true});
 d.addEventListener("touchend",function(e){
  if(lbX0===null)return;var dx=e.changedTouches[0].clientX-lbX0;lbX0=null;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);},{passive:true});
}
function lbVe(){
 var p=lbList[lbIdx];if(!p)return;
 document.getElementById("lbImg").src=p.view_url||p.url;   /* bản 1024, có đường lùi về gốc */
 document.getElementById("lbC").textContent=(lbIdx+1)+" / "+lbList.length;
 /* Chữ nút đặt Ở ĐÂY chứ không lúc dựng: lbDung() chỉ chạy MỘT lần (`if(lbEl())
    return`), nên nhúng cứng esc(t("close")) vào innerHTML là nút đóng băng theo
    ngôn ngữ của lần mở ĐẦU TIÊN — đổi sang 日本語 thì nhãn 🎁/✓ ngay bên cạnh
    đổi đúng còn nút vẫn «Đóng», lệch ngay trong một khung hình trước mặt khách Nhật. */
 document.getElementById("lbX").textContent=t("close");
 var q=document.getElementById("lbQ");
 q.textContent=p.interaction_id?t("lb_qua"):(String(p.id)===String(lbGhim||"")?t("lb_ghim"):"");
}
var lbGhim="";
function lbMo(g,i){
 lbList=g._photos||[];if(!lbList.length)return;
 lbGhim=g._ghim||"";lbIdx=Math.max(0,Math.min(i|0,lbList.length-1));
 lbDung();lbVe();lbEl().classList.add("show");
}
function lbGo(d){if(!lbList.length)return;lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbVe();}
function lbDong(){var d=lbEl();if(d){d.classList.remove("show");
 /* Bỏ src để trình duyệt thả ảnh lớn — mở/đóng nhiều lần ở cửa không dồn bộ nhớ. */
 var im=document.getElementById("lbImg");if(im)im.removeAttribute("src");}
 lbIdx=-1;lbList=[];}
document.addEventListener("keydown",function(e){
 if(lbIdx<0)return;
 if(e.key==="Escape")lbDong();
 else if(e.key==="ArrowLeft")lbGo(-1);
 else if(e.key==="ArrowRight")lbGo(1);});
/* E08-D043 — nhãn Bàn/Ghế mang chữ TRẠNG THÁI THAM DỰ là rác: 41 thẻ có
   table_no = "Không tham dự" do vòng nhập, và nhãn đó chỉ LẶP LẠI thứ chấm/chữ
   D033 đã hiện ngay trên cùng dòng — ở chỗ dành cho số bàn.
   KHÔNG ẩn theo «không phải số»: đo trên file chị Ly nạp thì luật đó giết luôn
   4 bàn thật («Bàn nhân viên» ×3, «Bàn ekip» ×1) và 2 ghế thật («ghế em bé»).
   So bằng KHOÁ CHUẨN HOÁ, không so chuỗi hiển thị — ba lý do đều đã cắn dự án:
     · hoa/thường — D028 AC-F0 giấu 48/53 khách VIP vì indexOf("VIP") vs tag "vip";
       prod 04/08 có cả "Bàn nhân viên" lẫn "bàn nhân viên" cùng lúc.
     · Đ KHÔNG tách bằng NFD (U+0110/U+0111) ⇒ phải đổi Đ→D TRƯỚC NFD. Sai thứ tự
       là "Đã tham dự" không khớp — gốc của cả M2 lẫn D034.
     · dấu cách / dấu chấm thừa — bỏ hết ký tự không phải chữ-số.

      phần rẻ hơn lập luận xác suất, và ca trùng mốc CÓ THẬT ở `histHtml`
      (`qua-tang` + `ghi-chu-quay` đi chung một `items[]`, cùng một `created_at`).

/* E08-D085 việc A · đo chiều cao THẬT của header rồi phát ra biến CSS --top-h.
   Vì sao phải đo thay vì viết số: chiều cao header đổi theo ngôn ngữ (nhãn tiếng
   Nhật ngắn hơn, có breakpoint xuống dòng khác), theo bề rộng màn, và ở hai trang
   cửa còn cộng thêm safe-area-inset-top của máy có tai thỏ. Một con số cứng thì
   đúng trên máy người viết và sai trên máy người dùng — đúng bệnh cũ top:52px. */
function dongBoChieuCaoHeader(){
  var t=document.querySelector(".top"); if(!t) return;
  var h=Math.round(t.getBoundingClientRect().height);
  document.documentElement.style.setProperty("--top-h", h+"px");

/* Đăng ký MỘT LẦN ở tầng ngoài.
   Dùng ResizeObserver thay vì gọi tay sau mỗi sự kiện, vì gọi tay đã sai một lần:
   đặt lời gọi ở đầu setLang thì nó đo header TRƯỚC khi nhãn kịp đổi, nên --top-h
   luôn trễ một nhịp (đo được: header 248px mà biến ghi 241px, đổi ngôn ngữ lại
   thành 241 vs 248). Tự đi tìm "đúng thời điểm" là tự nhận một danh sách sự kiện
   không bao giờ đủ — ngôn ngữ, xoay máy, đổi cỡ, font tải xong muộn. Để trình
   duyệt báo khi kích thước ĐÃ đổi thật thì không sót nguồn nào. */
dongBoChieuCaoHeader();
if (typeof ResizeObserver === "function") {
  try { new ResizeObserver(dongBoChieuCaoHeader).observe(document.querySelector(".top")); } catch (e) {}
} else {
  addEventListener("resize", dongBoChieuCaoHeader);
  addEventListener("orientationchange", dongBoChieuCaoHeader);
}

/* ── E08-D085 việc D · suy NGÀY SỰ KIỆN từ chính dữ liệu check-in ──────────
   Vì sao không đọc từ cấu hình: ngày sự kiện hiện chỉ sống trong localStorage
   của TỪNG trình duyệt (sheet "Cài đặt sự kiện"), nên hai người BTL sẽ thấy hai
   kết quả khác nhau cho cùng một khách — đúng loại mâu thuẫn vé này sinh ra để
   dẹp. Suy từ dữ liệu thì mọi màn hình tính ra cùng một đáp án từ cùng một tập.

   CHẶN THEO HÌNH DẠNG CHUỖI, không chỉ isNaN. Hai cửa có fallback _came="1"
   khi khách đã đến mà không có mốc giờ; mà new Date("1") KHÔNG phải Invalid
   Date — nó ra 31/12/2000. Chỉ lọc bằng isNaN thì "1" được đếm như một ngày
   thật, và nếu nhiều dòng dính fallback đó thì chính nó thành "đa số".

   NỢ ĐÃ BIẾT: phép đa số chỉ đúng khi dữ liệu có ĐÚNG MỘT sự kiện. Khi CRM đa
   sự kiện hạ cánh (project crm-multi-event), hàm này phải đổi sang lọc theo
   event_id — nếu không, sự kiện đông hơn sẽ quyết định ngày và toàn bộ check-in
   của sự kiện kia bị dán nhãn "bổ sung". Ghi ở đây để người sau không phải đoán
   vì sao nó chọn đa số. */
function suyNgaySuKien(dsISO){
  var dem={};
  (dsISO||[]).forEach(function(iso){
    if(!iso) return;
    if(!/^\d{4}-\d{2}-\d{2}/.test(String(iso))) return;
    var d=new Date(iso);
    if(isNaN(d.getTime())) return;
    var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    dem[k]=(dem[k]||0)+1;
  });
  var ngay=null, dinh=0;
  Object.keys(dem).sort().forEach(function(k){ if(dem[k]>dinh){dinh=dem[k];ngay=k;} });
  return ngay;
}
/* Trả true khi mốc giờ HỢP LỆ và LỆCH ngày sự kiện. Mốc không hợp lệ (rỗng,
   "1", rác) trả false — giữ nguyên hành vi cũ, không dán nhãn mới lên nó. */
function lechNgaySuKien(iso, ngaySK){
  if(!ngaySK || !iso) return false;
  if(!/^\d{4}-\d{2}-\d{2}/.test(String(iso))) return false;
  var d=new Date(iso); if(isNaN(d.getTime())) return false;
  var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return k!==ngaySK;
}
