<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Check-in Tọa đàm · Gala 20 Năm</title>
<style>
 :root{--gold:#d8b876;--gold-b:#f4e2b0;--cream:#f5efe1;--muted:#b9b096;--muted2:#8f886f;
  --line:rgba(216,184,118,.2);--line2:rgba(216,184,118,.42);--card:rgba(255,255,255,.04);--green-ok:#43e08d;--amber:#f0b34a;
  --bg1:#0a2018;--bg2:#0a2a20;--bg3:#07140E;--sr1:rgba(10,32,24,.96);--sr2:rgba(10,32,24,.6);--ph1:#12503a;--ph2:#0b2a1e;
  --acc:#0F955A;--acc-dim:rgba(15,149,90,.12);--acc-glow:rgba(15,149,90,.3);}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;color:var(--cream);line-height:1.45;overflow-x:hidden;
  background:radial-gradient(800px 460px at 88% -8%,var(--acc-glow),transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed}
 body.jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;letter-spacing:.02em}
 h1,h2,h3{font-family:"Playfair Display","Cambria",Georgia,serif;font-weight:600;margin:0}
 body.jp h2,body.jp .cn,body.jp .th .v,body.jp .v.big{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
 .num{font-variant-numeric:tabular-nums}
 .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(8,17,31,.95),rgba(8,17,31,.7));border-bottom:2px solid var(--acc);padding-top:env(safe-area-inset-top)}
 .top-in{display:flex;align-items:center;gap:9px;padding:10px 14px}.logo{height:24px}
 .ttl{font-weight:800;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase;color:var(--acc)}
 .lang{margin-left:auto;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:6px 11px;font:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
 .lich{border:1px solid var(--line);background:rgba(5,13,24,.5);color:var(--cream);border-radius:8px;padding:6px 11px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
 .cnt{display:flex;align-items:stretch;gap:11px;padding:12px 14px}
 .big{flex:1;text-align:center;border:1.5px solid var(--acc);border-radius:16px;background:var(--acc-dim);padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
 .big .cl{font-size:.92rem;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
 .big .cn{font-size:2.7rem;font-weight:800;line-height:1;color:var(--acc)}.big .cn b{color:var(--muted);font-size:1.4rem;font-weight:600}
 .big .cs{font-size:.74rem;color:var(--muted)}
 .big{cursor:pointer;transition:.15s}.big.on{box-shadow:0 0 0 2px var(--acc) inset}
 .big.b-no{border-color:var(--line)}.big.b-no .cn{color:var(--cream,#e8dcc0)}
 /* E08-D028 CỬA-4 (nợ Gate 2): hai máy cùng một cửa đều đứng yên ở con số lúc
    mở trang — máy A điểm danh xong, máy B vẫn hiện số cũ tới hết buổi. Nút ↻
    và dòng giờ cập nhật để PG biết số đang cũ hay mới; polling lo phần còn lại. */
 /* Nút ↻ nằm ở THANH ĐẦU TRANG, không chen vào cụm hero: chen vào .cnt thì ở
    320px khối «ĐÃ ĐẾN» bị bóp còn 77px trong khi «CHƯA ĐẾN» giữ 165px (chuỗi
    «282/352» ở cỡ chữ 2.7rem không co được), header cao 207→267px và màn hết
    một thẻ khách. Dòng «Cập nhật …» cũng để NGOÀI header sticky vì header cao
    thêm là đè thêm lên ô tìm. */
 #rfBtn{font-size:1rem;line-height:1;color:var(--acc);border-color:var(--line2)}#rfBtn.busy{opacity:.45}
 .upd{text-align:center;color:var(--muted2);font-size:.7rem;padding:2px 14px 4px;min-height:1em}
 /* AC-F5 — nhãn nhận diện ngay trên LIST. Trước đây hạng VIP và quan hệ gia
    đình chỉ hiện khi mở hồ sơ, nên PG phải bấm từng thẻ mới biết ai là VIP hay
    người nhà TGĐ — đúng thứ cần biết TRƯỚC khi chào. */
 .bgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
 .bg{font-size:.6rem;font-weight:800;letter-spacing:.03em;border-radius:6px;padding:2px 6px;white-space:nowrap;line-height:1.5}
 .bg-vip{color:#2a1e05;background:linear-gradient(180deg,#f0d999,#cfa758)}
 .bg-gd{color:var(--acc);border:1px solid var(--line2);background:var(--acc-dim)}
 .bg-jp{color:var(--muted);border:1px solid var(--line)}
 /* E08-D031 — trạng thái THAM DỰ. Khác trục với «đã đến»: đây là khách CÓ dự
    sự kiện không (số vào báo cáo BTC), kia là đã tới cửa chưa. */
 /* E08-D033 — ba HÌNH khác nhau, màu chỉ là lớp thứ hai (AC-4). */
 .bg-att-khong{color:#2a1e05;background:#f0b34a;border:1px solid #f0b34a;border-radius:3px}
 .bg-att-cho{color:var(--muted);background:transparent;border:1.5px dashed var(--line2);border-radius:999px}
 .attd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green-ok);
   border:1px solid rgba(0,0,0,.45);vertical-align:middle;flex:none;align-self:center}
 /* E08-D036 — nút huỷ check-in. Cố ý NGƯỢC HẲN nút check-in (khối vàng đặc,
    full-width, padding 17px): viền rỗng, chữ nhỏ, hẹp, canh phải, nằm TRONG hộp
    xanh. Hai nút không bao giờ cùng có mặt (ciBox là ternary), nên rủi ro thật
    không phải bấm nhầm nút bên cạnh mà là TRÍ NHỚ CƠ BẮP VỀ VỊ TRÍ — tay quen
    bấm giữa màn. Khác vị trí + khác hình + hỏi lại là ba lớp chặn. */
 .undorow{display:flex;justify-content:flex-end;margin-top:10px}
 .undob{border:1.5px solid var(--line2);background:transparent;color:var(--muted);
   border-radius:10px;padding:7px 13px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
 .undob:disabled{opacity:.5;cursor:default}
 /* E08-D030 AC-11b: hạng VIP rời khỏi thân hồ sơ, lên GÓC ẢNH — chỗ trống đó
    dành cho khung Bàn + Ghế, thứ Ly cần đọc nhanh nhất ở cửa. */
 .pf-av{position:relative}
 .av-vip{position:absolute;left:-6px;top:-8px;z-index:2;font-size:.64rem;font-weight:800;letter-spacing:.03em;
   border-radius:8px;padding:3px 8px;color:#2a1e05;background:linear-gradient(180deg,#f0d999,#cfa758);
   box-shadow:0 2px 8px rgba(0,0,0,.5)}
 /* AC-F7 (mock Ly): hồ sơ có pill HẠNG riêng dưới cụm BÀN/GHẾ. */
 .hangp{display:inline-block;margin:2px auto 12px;border:1px solid var(--line2);border-radius:11px;padding:5px 14px;background:rgba(5,13,24,.5)}
 .hangp .k{display:block;font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}
 .hangp b{font-size:1rem;color:var(--gold-b)}
 .pf-b .bgs{justify-content:center;margin:0 0 12px}
 /* AC-G4 (mock Ly) — khối GHI NHẬN TẠI QUẦY dưới CTA điểm danh. */
 .quay{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
 .quay h4{color:var(--acc);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin:0 0 12px;font-family:inherit;font-weight:800}
 .qf{margin-bottom:14px}
 .qf label{display:block;font-size:.8rem;font-weight:700;color:var(--cream);margin-bottom:6px}
 .qf textarea,.qf input{width:100%;font:inherit;font-size:.92rem;color:var(--cream);background:rgba(5,13,24,.6);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
 .qf textarea:focus,.qf input:focus{border-color:var(--acc)}
 .qnote{font-size:.72rem;color:var(--amber);margin-top:6px}
 .qh{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
 .qhh{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
 .qhr{font-size:.84rem;color:var(--cream);padding:7px 0;border-bottom:1px dashed var(--line)}
 .qhr b{color:var(--acc)}
 .qhm{font-size:.7rem;color:var(--muted2);margin-top:2px}
 .fb{border:1px solid var(--line);background:rgba(5,13,24,.5);color:var(--muted);border-radius:20px;padding:9px 14px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
 .fb .mk{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:none}.fb .xx{font-size:1rem}
 .fb.came.on{background:var(--green-ok);border-color:var(--green-ok);color:#042a17}.fb.no.on{background:var(--amber);border-color:var(--amber);color:#2a1e05}
 .sr{padding:2px 14px 8px;position:sticky;top:52px;z-index:20;background:linear-gradient(180deg,var(--sr1),var(--sr2));backdrop-filter:blur(8px)}
 .sr .box{position:relative}.sr input{width:100%;font:inherit;font-size:1rem;color:var(--cream);background:rgba(5,13,24,.6);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px 13px 42px;outline:none}
 .sr input:focus{border-color:var(--acc)}.sr .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
 /* padding-top 11px là CHỖ ĐỨNG cho stick: .quick cuộn ngang nên overflow-y
    tính là auto, stick nhô lên khỏi mép hộp sẽ bị cắt hoặc đẻ ra thanh cuộn dọc. */
 .quick{display:flex;gap:9px;padding:11px 14px 2px;overflow-x:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
 .qb{position:relative;flex:none;border:1px solid var(--line);background:rgba(5,13,24,.4);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
 .qb.on{border-color:var(--acc);background:var(--acc);color:#04121f}
 /* Stick đếm: PG nhìn một cái là biết cửa này có bao nhiêu VIP, bao nhiêu người
    nhà — không phải bấm từng nút. Số 0 VẪN hiện (Sponsor chốt): nút ra rỗng mà
    không có số trông như nút hỏng; có số 0 thì rõ là «không có khách», không
    phải «nút chết». */
 .qn{position:absolute;top:-7px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
   background:var(--acc);color:#04121f;font-size:.6rem;font-weight:800;line-height:18px;text-align:center;
   font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg1)}
 .qb.on .qn{background:var(--bg1);color:var(--acc)}
 .qn.zero{background:var(--line2);color:var(--bg1)}
 .hint{color:var(--muted2);font-size:.78rem;text-align:center;padding:6px}
 .list{padding:4px 14px 40px;display:flex;flex-direction:column;gap:8px}
 .gc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 11px;cursor:pointer}
 .gc.done{border-color:rgba(67,224,141,.4);background:rgba(67,224,141,.06)}
 .sd{width:9px;height:9px;border-radius:50%;flex:none;background:var(--amber)}.sd.came{background:var(--green-ok)}
 .av{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,var(--ph1),var(--ph2));border:1px solid var(--line2);color:var(--gold-b);font-family:serif;font-size:1rem}.av img{width:100%;height:100%;object-fit:cover}
 .gm{flex:1;min-width:0}.gm .n1{font-family:serif;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gm .n2{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tb{font-size:.64rem;font-weight:700;color:var(--acc);border:1px solid var(--line2);border-radius:8px;padding:3px 7px;white-space:nowrap;text-align:center}.tb b{font-family:serif;font-size:.88rem;display:block}
 .gt{color:var(--green-ok);font-size:.68rem;font-weight:700;white-space:nowrap}
 /* E08-D028 CỬA-1: banner cụm cửa dùng z-index 99999 nên đè kín nút «←».
    QC quét 648 điểm trên nút → 0 điểm chạm được; ngón tay thật không đóng
    được hồ sơ, mỗi khách xong phải tải lại trang. Hồ sơ là lớp phủ toàn
    màn nên phải nằm TRÊN banner. */
 .pf{position:fixed;inset:0;z-index:100000;background:linear-gradient(180deg,var(--bg1),var(--bg3));transform:translateY(100%);transition:transform .3s;overflow-y:auto}.pf.show{transform:translateY(0)}
 .pf-bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,rgba(8,17,31,.95),transparent);border-bottom:1px solid var(--line)}
 .pf-back{border:0;background:rgba(255,255,255,.08);color:var(--cream);width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer}
 .pf-b{padding:22px 18px 46px;max-width:520px;margin:0 auto;text-align:center}
 .pf-av{width:190px;height:190px;border-radius:18px;margin:0 auto;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,var(--ph1),var(--ph2));border:2px solid var(--acc);color:var(--gold-b);font-family:serif;font-size:3.4rem;box-shadow:0 12px 34px rgba(0,0,0,.4)}.pf-av img{width:100%;height:100%;object-fit:cover}
 .pf-nm{font-family:serif;font-size:1.7rem;color:#fff;margin-top:14px;line-height:1.2}
 .pf-rl{color:var(--muted);font-size:.92rem;margin-top:4px}.pf-rl b{color:var(--cream)}
 .th{margin:16px auto;display:inline-flex;gap:22px;border:1.5px solid var(--acc);border-radius:16px;background:var(--acc-dim);padding:12px 26px}
 .th .c .k{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}.th .c .v{font-family:serif;font-size:2.4rem;color:var(--acc);line-height:1}
 .facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
 .ft{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:.8rem;background:rgba(5,13,24,.4)}.ft .k{font-size:.55rem;text-transform:uppercase;color:var(--muted2)}.ft .v{color:var(--cream);font-weight:600}.ft.chay .v{color:var(--green-ok)}
 .info{text-align:left;border-top:1px solid var(--line);margin-top:6px}
 .ir{display:flex;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:.9rem}.ir .k{color:var(--muted)}.ir .v{color:var(--cream);text-align:right;font-weight:500}
 .cib{width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:20px;background:linear-gradient(180deg,#f0d999,#cfa758);color:#2a1e05;box-shadow:0 10px 26px rgba(216,184,118,.28);display:flex;align-items:center;justify-content:center;gap:10px}
 .cidone{border:1.5px solid rgba(67,224,141,.5);border-radius:14px;padding:15px;background:rgba(67,224,141,.08);margin-top:20px}.cidone .t{color:var(--green-ok);font-weight:700}
 .undo{margin-top:10px;width:100%;border:1px solid rgba(226,58,46,.3);background:transparent;color:#ff9a8f;border-radius:11px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
 .sheet{position:fixed;inset:0;z-index:70;background:rgba(5,13,24,.75);display:none;align-items:flex-end}.sheet.show{display:flex}
 .sheet-in{background:linear-gradient(180deg,var(--bg2),var(--bg3));width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;border-top:2px solid var(--acc);padding:20px 18px 40px}
 @media(min-width:600px){.sheet{align-items:center}.sheet-in{max-width:520px;margin:0 auto;border-radius:16px}.cnt .big .cn{font-size:3rem}}
 .sheet h3{color:var(--acc);font-size:1.2rem;text-align:center;margin-bottom:4px}.sheet .sub{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:14px}
 .si{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}.si .tm{font-family:serif;color:var(--acc);font-size:1.05rem;flex:none;width:80px}.si .d .n{color:var(--cream);font-weight:600}.si .d .s{color:var(--muted2);font-size:.78rem}
 input[type=file]{display:none}

  .camb{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--acc)}
  /* E08-D028: bản vá CỬA-1 nâng .pf lên z-index 100000, vô tình chôn toast
     (99) xuống DƯỚI lớp hồ sơ đục kín màn. Mọi lời báo lỗi đều bắn TỪ TRONG hồ
     sơ — check-in bị máy chủ từ chối, ảnh không lưu được — nên PG bấm mà không
     thấy gì xảy ra. CỬA-2 đã chặn được «báo xanh giả» nhưng thay bằng im lặng.
     Toast phải nằm TRÊN hồ sơ. */
  .ci-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100001;
    background:#0e2a1c;color:#d8f5e6;border:1px solid #1f6b45;border-radius:11px;
    padding:11px 17px;font-size:.84rem;max-width:88vw;text-align:center;display:none;
    box-shadow:0 6px 22px rgba(0,0,0,.45)}
  .ci-toast.bad{background:#2d1113;color:#ffd9dc;border-color:#7c2b31}

  /* AC-D0: list ở CẢ 2 trang cửa cũng vuông một cỡ — spec nêu đích danh
     "list trên 2 trang check-in". Đây là màn PG quét liên tục dưới áp lực hàng
     người, thẻ so le bề rộng còn hại hơn ở /crm. Luật ngang/dọc chỉ ở HỒ SƠ. */
  .pf-av img.landscape{object-fit:contain;background:var(--bg1)}
  .pf-av.landscape{width:100%;max-width:250px}

  .pv-sub{display:block;font-size:.86em;opacity:.72;line-height:1.35;margin-top:1px}
  .pv-jp{opacity:.9}
</style></head><body>
<!-- E08-D028 B4 (anh chốt 20:07): bỏ banner xanh + nút «Mở /crm». Trang này
     là dụng cụ cửa, PG không cần đường sang /crm; banner còn chiếm đầu màn
     và từng đè nút ← (CỬA-1). Số buổi/tổng nay nằm ở hero. -->
<header class="top"><div class="top-in">
  <img class="logo" src="logo-esuhai-mark.png" alt=""><div class="ttl" data-i="ci">CHECK-IN · Tọa đàm</div>
  <button class="lang" id="langBtn">日本語</button>
  <button class="lich" id="rfBtn" aria-label="Tải lại số" title="Tải lại số">&#8635;</button>
  <button class="lich" id="lichBtn" data-i="lich">📅 Lịch trình</button>
</div>
<div class="cnt">
  <div class="big b-came" data-f="came"><div class="cl" data-i="came_label">ĐÃ ĐẾN</div><div class="cn"><span id="cDone">0</span></div><div class="cs" data-i="guests">Tọa đàm</div></div>
  <div class="big b-no" data-f="no"><div class="cl" data-i="btn_no">CHƯA ĐẾN</div><div class="cn"><span id="cLeft">0</span><b>/<span id="cTot">0</span></b></div><div class="cs" data-i="guests">Tọa đàm</div></div>
</div></header><div class="upd" id="upd"></div>
<div class="sr"><div class="box"><span class="ic">&#8981;</span><input id="q" type="search" placeholder="Gõ tên khách (không dấu cũng được)…"></div></div>
<div class="quick" id="quick">
  <button class="qb" data-q="vip" data-i="vip">★ VIP</button><button class="qb" data-q="nhat" data-i="nhat">🎌 Khách Nhật</button>

  /* E08-D030 — cửa TỌA ĐÀM cố ý KHÔNG đọc ghế.

function merge(rows){

   if(!n.att&&o.att)n.att=o.att;
   if(!n.ghe&&o.ghe)n.ghe=o.ghe;

   if(!n.photo&&o.photo){n.photo=o.photo;n.photoBig=o.photoBig;}

   if(!n._came&&o._came){n._came=o._came;n._by=o._by;}}

async function refresh(manual){

 /* Đang mở hồ sơ thì KHÔNG nạp lại: PG đang thao tác trên một thẻ cụ thể, list

 if(!manual&&(curId||document.hidden))return;
 pollBusy=true;var b=$("#rfBtn");if(b)b.classList.add("busy");
 var seq=mutSeq;
 try{
  var j=await jget("/crm/guests?session="+SESSION+"&limit=1000");

  if(seq!==mutSeq)return;

function quickOk(g,q){

function pairVJ(vn,jp){

 if(h&&!skipVip)b.push('<span class="bg bg-vip">'+esc(h)+'</span>');
 var p=g.phanloai;

/* E08-D029 — thu nhỏ ảnh NGAY TRÊN MÁY trước khi gửi. Máy chủ cố ý KHÔNG có thư
   viện ảnh: thêm một phụ thuộc biên dịch gốc (sharp) vào ảnh production ba ngày
   trước lễ mà build hỏng là cả app không deploy được. Ở đây lỗi chỉ làm mất bản
   phụ — ảnh gốc vẫn lưu bình thường, màn hình lùi về đúng hành vi cũ.
   Kèm một cái lợi thứ hai: PG chụp ảnh vài MB rồi tải lên trên chính cái wifi
   yếu đó; bản 256px chỉ ~22 KB. */
async function shrinkImg(file,max,q){
  try{
    if(!file||!/^image\//.test(file.type||""))return null;
    if(typeof createImageBitmap!=="function")return null;
    var bmp=await createImageBitmap(file);
    var s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    var nw=Math.max(1,Math.round(bmp.width*s)),nh=Math.max(1,Math.round(bmp.height*s));
    var cv=document.createElement("canvas");cv.width=nw;cv.height=nh;
    var cx=cv.getContext("2d");if(!cx)return null;
    cx.drawImage(bmp,0,0,nw,nh);
    if(bmp.close)bmp.close();
    var blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",q);});
    /* Ảnh vốn đã nhẹ hơn bản thu nhỏ thì giữ gốc — thêm object chỉ tổ nặng kho. */
    if(!blob||blob.size>=file.size)return null;
    return blob;
  }catch(e){return null;}
}
async function addShrunk(fd,file){
  var th=await shrinkImg(file,256,.75); if(th)fd.append("thumb",th,"t256.jpg");
  var pv=await shrinkImg(file,1024,.8); if(pv)fd.append("preview",pv,"t1024.jpg");
  return fd;
}

/* ─────────── E08-D031 · trạng thái THAM DỰ ───────────

 if(a==="du")return '<span class="attd du" title="'+esc(attLbl(g))+'" aria-label="'+esc(attLbl(g))+'"></span>';

function av(g,big){var u=(big?(g.photoBig||g.photo):g.photo);return u?'<img src="'+esc(u)+'" loading="lazy" decoding="async" onload="imgFit(this)" onerror="this.remove()">'+esc(ini(g.name)):esc(ini(g.name));}

/* E08-D028 AC-C — chụp ảnh khách tại cửa → kệ MinIO.
   AC-C2 (Sponsor chốt): ĐIỂM DANH và ẢNH độc lập. Ảnh fail → báo đỏ, KHÔNG
   đụng tới trạng thái đã điểm danh. Ở cửa, thứ phải đúng là khách đã vào;
   ảnh là thứ chụp lại được, điểm danh thì không. */
var camFor=null,camQua=false;
function toast(msg,bad){var el=document.getElementById("ciToast");
  if(!el){el=document.createElement("div");el.id="ciToast";document.body.appendChild(el);}
  el.className="ci-toast"+(bad?" bad":"");el.textContent=msg;el.style.display="block";
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.display="none";},4200);}
async function sendPhoto(id,file,asGift){
  if(!file)return;
  if(!/^image\//.test(file.type||"")){toast(t("cam_notimg"),1);return;}
  // HEIC/HEIF: API cho qua nhưng TRÌNH DUYỆT KHÔNG HIỂN THỊ ĐƯỢC — Pha 2 đã phải
  // dọn 3 tấm kiểu này. Lưu vào thì thẻ có ảnh mà màn vẫn ra chữ viết tắt, tệ
  // hơn là không lưu. Từ chối kèm hướng dẫn đổi cài đặt máy.
  if(/heic|heif/i.test(file.type||'')||/\.(heic|heif)$/i.test(file.name||'')){toast(t('cam_heic'),1);return;}
  toast(t("cam_up"));
  /* Ảnh quà phải gắn vào một ghi nhận: tải lên trần như ảnh khách thì nó thành
     ẢNH MỚI NHẤT của thẻ, mà avatar ở cả 4 màn lấy đúng ảnh mới nhất — cái hộp
     quà sẽ thế chỗ mặt khách trên mọi danh sách, và không có route xoá ảnh.
     L-03: bản cũ tạo dòng ghi nhận NGAY Ở ĐÂY rồi mới gửi ảnh, nên ảnh hỏng ở
     bước sau (MinIO 503 — prod vừa dính đúng 8 phút) để lại dòng «Chụp ảnh quà»
     không có ảnh nào, và không xoá được. Nay chỉ GỬI KÈM nội dung; máy chủ tạo
     dòng ghi nhận SAU khi ảnh đã lên kệ, cùng transaction với dòng ảnh. */
  var fd=new FormData();fd.append("photo",file);
  await addShrunk(fd,file);
  var giftBody="";
  if(asGift){
    grabDraft();var gq=byId(id);
    giftBody=String((gq&&gq._q&&gq._q.tang)||"").trim()||t("q_camqua");
    fd.append("interaction_kind","anh-qua");
    fd.append("interaction_body",giftBody);
  }
  try{
    var r=await api("/crm/guests/"+id+"/photos",{method:"POST",body:fd});
    /* Hỏng thì bắt nạp lại lịch sử ở lần mở hồ sơ sau: openPf() chỉ gọi
       enrich() khi !_enriched, nếu không đánh dấu thì PG đóng-mở lại vẫn thấy
       lịch sử cũ và không biết trạng thái thật. */
    var gf=byId(id); if(gf)gf._enriched=false;
    if(r.status===401){toast(t("cam_auth"),1);return;}
    if(!r.ok){var e={};try{e=await r.json();}catch(_){}toast(e.error||t("cam_fail"),1);return;}
    var j={};try{j=await r.json();}catch(_){}
    var g=byId(id);
    /* Ảnh quà KHÔNG được thay ảnh đại diện khách — chỉ nạp lại hồ sơ để lịch
       sử tại quầy hiện thêm dòng vừa ghi. */
    /* j.url là ảnh GỐC; list phải trỏ bản thu nhỏ, hồ sơ trỏ bản 1024. */
    if(g&&j&&j.url&&!asGift){g.photo=j.url+"/thumb";g.photoBig=j.url+"/preview";lastSig=sig();if(curId===id)openPf(id);renderList();}
    else if(g){
      /* Nội dung quà ĐÃ nằm trên dòng ghi nhận của tấm ảnh vừa lưu. Không xoá ô
         thì PG bấm tiếp «Lưu ghi nhận» sẽ đẻ thêm một dòng qua-tang cùng nội
         dung — hai dòng cho một món quà, mà không có route xoá. */
      if(asGift){var qt=document.getElementById("qTang");if(qt)qt.value="";
        if(g._q)g._q.tang="";}
      g._enriched=false;enrich(g,id);}
    toast(asGift?t("q_saved"):t("cam_ok"));
  }catch(err){toast(t("cam_net"),1);}
}

async function saveQuay(id,btn){
 grabDraft();var g=byId(id);if(!g)return;var q=g._q||{};
 var items=[];
 if(String(q.tang||"").trim())items.push({kind:"qua-tang",body:q.tang.trim()});
 if(String(q.dap||"").trim())items.push({kind:"qua-dap-le",body:q.dap.trim()});
 if(String(q.note||"").trim())items.push({kind:"ghi-chu-quay",body:q.note.trim()});
 if(!items.length){toast(t("q_empty"),1);return;}
 btn.disabled=true;
 try{
  /* L-02: MỘT request cho cả ba ô, máy chủ ghi trong MỘT transaction. Bản cũ
     bắn ba POST tuần tự, mỗi cái tự commit: job 1 vào DB rồi job 2 hỏng thì màn
     báo ĐỎ «CHƯA lưu được» trong khi dòng 1 đã nằm trong bảng, PG bấm lại là
     ghi trùng — mà không có route xoá interaction. Nay hoặc vào hết, hoặc không
     dòng nào; bấm lại bao nhiêu lần cũng không đẻ bản sao.
     Vẫn phải kiểm r.ok: fetch KHÔNG ném khi máy chủ trả 4xx/5xx (lớp lỗi CỬA-2). */
  var r=await api("/crm/guests/"+id+"/interactions",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({items:items})});
  if(!r.ok){btn.disabled=false;g._enriched=false;
    toast(r.status===401?t("ci_auth"):t("q_fail")+" ("+r.status+")",1);return;}
  /* Phải xoá CẢ Ô TRÊN MÀN, không chỉ bản nháp trong bộ nhớ: enrich() gọi lại
     openPf(), mà openPf() mở đầu bằng grabDraft() — nó đọc lại đúng ba ô vẫn
     còn chữ và dựng lại bản nháp vừa xoá. Ở cửa nghĩa là PG lưu xong thấy chữ
     còn nguyên, tưởng chưa lưu, bấm lần nữa → hai dòng ghi nhận trùng. */
  ["qTang","qDap","qNote"].forEach(function(k){var el=document.getElementById(k);if(el)el.value="";});
  g._q={};g._enriched=false;toast(t("q_saved"));await enrich(g,id);
 }catch(e){btn.disabled=false;g._enriched=false;toast(t("q_net"),1);}}

    /* E08-D028 CỬA-2: jpost() KHÔNG ném lỗi khi máy chủ từ chối — nó trả

/* gate() THAY RUỘT <body> — mọi phần tử hero biến mất. Vòng poll kế tiếp sẽ
   ném lỗi ở counter() rồi bị catch của refresh() nuốt im, và trang chết vẫn
   tiếp tục gõ máy chủ mỗi 25 giây. Dựng cờ để dừng hẳn. */
function gate(html){DEAD=true;document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#eee;background:#0b1a30">'+html+'</div>';}
async function boot(){
 /* PG đứng cửa đăng nhập bằng OTP như mọi người (anh Kha chốt 05/08): mở link
    cửa → chưa có phiên thì sang màn nhập email, nhận mã qua mail, xong quay lại
    ĐÚNG cửa vừa mở. Trang này KHÔNG dựng màn đăng nhập riêng — dùng chung một
    luồng OTP với /crm để chỉ có một chỗ phát mã và một chỗ chặn tần suất.
    Tài khoản PG là role `staff`: vào được cửa, KHÔNG vào được bảng /crm. */
 try{await jget("/crm/me");}catch(e){
   if(e&&e.status===401){location.href="/crm?next="+encodeURIComponent(location.pathname);return;}
   return gate('<div><h2>Lỗi tải dữ liệu</h2><p style="color:#b9b096">Kiểm tra kết nối rồi thử lại.</p><button onclick="location.reload()" style="margin-top:12px;background:#d8b876;color:#1a1204;padding:10px 20px;border:0;border-radius:8px;font-weight:700;cursor:pointer">Tải lại</button></div>');}
 try{var j=await jget("/crm/guests?session="+SESSION+"&limit=1000");G=(j.rows||[]).map(mapRow);}catch(e){return gate('<div><h2>Lỗi tải dữ liệu</h2><p style="color:#b9b096">Kiểm tra kết nối rồi thử lại.</p><button onclick="location.reload()" style="margin-top:12px;background:#d8b876;color:#1a1204;padding:10px 20px;border:0;border-radius:8px;font-weight:700;cursor:pointer">Tải lại</button></div>');}
 lastSync=Date.now();counter();setLang(LANG);lastSig=sig();
}
boot();
