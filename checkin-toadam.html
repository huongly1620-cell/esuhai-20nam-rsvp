 return true;}
function renderList(){var rows=G.filter(match);
 $("#hint").textContent=(st.q||st.quick||st.f)?rows.length+" kết quả":"Tổng "+G.length+" khách "+SESS;
 $("#list").innerHTML=rows.map(function(g){var cm=came(g);
  return '<div class="gc'+(cm?" done":"")+'" data-id="'+esc(g.id)+'"><span class="sd'+(cm?" came":"")+'"></span>'
   +'<div class="av">'+(g.photo?'':esc(ini(g.name)))+'</div><div class="gm"><div class="n1">'+esc(g.name)+'</div><div class="n2">'+esc(g.title||g.org||"")+'</div></div>'
   +(cm?'<span class="gt">&#9711; '+cm+'</span>':'<span class="tb">BÀN<b>'+esc(g.table)+'</b></span>')+'</div>';}).join("")||'<div class="hint">Không tìm thấy.</div>';}
function openPf(id){var g=G.filter(function(x){return x.id===id;})[0];if(!g)return;curId=id;var cm=came(g);
 var dcls=g.diet==="Món chay"?"chay":"";
 var ciBox=cm?'<div class="cidone"><div class="t">&#9711; Đã check-in lúc '+cm+'</div></div><button class="undo" data-undo="'+esc(g.id)+'">Huỷ check-in</button>'
   :'<button class="cib" data-ci="'+esc(g.id)+'">&#9711;&nbsp; Check-in — Khách đã đến</button>';
 $("#pfBody").innerHTML='<div class="pf-av">'+(g.photo?'':esc(ini(g.name)))+'</div>'
  +'<div class="pf-nm">'+esc(g.name)+'</div><div class="pf-rl"><b>'+esc(g.title||"—")+'</b>'+(g.org?'<br>'+esc(g.org):'')+'</div>'
  +'<div class="th"><div class="c"><div class="k">Bàn</div><div class="v num">'+esc(g.table)+'</div></div><div class="c"><div class="k">Ghế</div><div class="v num">'+esc(g.seat)+'</div></div></div>'
  +'<div class="facts">'+(g.vip?'<div class="ft"><div class="k">Hạng</div><div class="v">'+esc(g.vip)+'</div></div>':'')+'<div class="ft"><div class="k">Buổi</div><div class="v">'+esc(g.buoi)+'</div></div><div class="ft '+dcls+'"><div class="k">Ẩm thực</div><div class="v">'+esc(g.diet||"—")+'</div></div></div>'
  +'<div class="info"><div class="ir"><span class="k">Người phụ trách</span><span class="v">'+esc(g.handler||"—")+'</span></div>'
  +'<div class="ir"><span class="k">Vai trò / đi cùng</span><span class="v">'+esc(g.role||"—")+(g.note?' · '+esc(g.note):'')+'</span></div>'
  +'<div class="ir"><span class="k">SĐT</span><span class="v">••• (đã ẩn)</span></div>'
  +'<div class="ir"><span class="k">Mã khách</span><span class="v">'+esc(g.id)+'</span></div></div>'+ciBox;
 $("#pf").classList.add("show");document.body.style.overflow="hidden";}
$("#list").addEventListener("click",function(e){var c=e.target.closest(".gc");if(c)openPf(c.getAttribute("data-id"));});
$("#pfBack").addEventListener("click",function(){$("#pf").classList.remove("show");document.body.style.overflow="";});
$("#pfBody").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.getAttribute("data-ci")){var id=b.getAttribute("data-ci");CK[id]={at:fmt(new Date().toISOString())};saveCi(CK);counter();openPf(id);renderList();}
 if(b.getAttribute("data-undo")){var id=b.getAttribute("data-undo");if(confirm("Huỷ check-in?")){delete CK[id];saveCi(CK);counter();openPf(id);renderList();}}});
$("#q").addEventListener("input",function(e){st.q=e.target.value;renderList();});
$("#quick").addEventListener("click",function(e){var b=e.target.closest(".qb");if(!b)return;var q=b.getAttribute("data-q");st.quick=(st.quick===q?"":q);document.querySelectorAll(".qb").forEach(function(x){x.classList.remove("on");});if(st.quick)b.classList.add("on");renderList();});
document.querySelectorAll(".fb").forEach(function(b){b.addEventListener("click",function(){var f=b.getAttribute("data-f");st.f=(st.f===f?"":f);document.querySelectorAll(".fb").forEach(function(x){x.classList.remove("on");});if(st.f)b.classList.add("on");renderList();});});
$("#lichBtn").addEventListener("click",function(){$("#sheet").classList.add("show");});
$("#sheet").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show");});
counter();renderList();
</script></body></html>
