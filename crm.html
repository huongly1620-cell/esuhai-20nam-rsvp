<!-- R0 · Hương Ly — CRM (mockup hợp nhất). Kha nối API /crm/* sau. -->
<style>
  :root{--gold:#d8b876;--gold-bright:#f4e2b0;--green:#0F955A;--green-dim:#0e7452;--blue:#2E7FCC;--blue-dim:#155A9C;
    --red:#e23a2e;--red-bright:#ff5b4d;--amber:#f0b34a;--green-ok:#43e08d;
    /* dark (mặc định) */
    --bg1:#0b1a30;--bg2:#0b2330;--bg3:#08111F;--panel:rgba(255,255,255,.035);--panel2:rgba(5,13,24,.5);
    --text:#f5efe1;--muted:#b9b096;--muted2:#8f886f;--line:rgba(216,184,118,.2);--line2:rgba(216,184,118,.42);--inp:rgba(5,13,24,.55);}
  :root[data-theme=light]{--bg1:#f3efe4;--bg2:#efe9db;--bg3:#e9e2d0;--panel:rgba(255,255,255,.7);--panel2:#fff;
    --text:#241f16;--muted:#6a6250;--muted2:#8a8270;--line:rgba(120,95,40,.22);--line2:rgba(120,95,40,.4);--inp:#fff;--gold:#a6873f;--gold-bright:#8a6614;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;color:var(--text);line-height:1.45;
    background:radial-gradient(900px 500px at 88% -8%,rgba(20,88,78,.22),transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));display:flex;flex-direction:column}
  h1,h2,h3{font-family:"Playfair Display","Cambria",Georgia,serif;font-weight:600;margin:0}.num{font-variant-numeric:tabular-nums}
  .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:linear-gradient(180deg,var(--bg3),transparent);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap}
  .logo{height:26px}.brand{font-weight:700;letter-spacing:.08em;font-size:.76rem;text-transform:uppercase}.brand b{color:var(--gold);font-weight:400}
  .hanh{display:flex;gap:5px;align-items:center}.hanh i{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);display:inline-block;title:''}
  .h-kim{background:#e8e2cf;border:1px solid #b7a06a}.h-moc{background:#3fae6a}.h-thuy{background:#2E7FCC}.h-hoa{background:#e23a2e}.h-tho{background:#c79a3e}
  .nav{display:flex;gap:3px;margin-left:6px;flex-wrap:wrap}
  .nav a{font-size:.74rem;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
  .nav a.on{color:#1a1204;background:var(--gold);font-weight:700}.nav a:not(.on):hover{color:var(--gold-bright)}
  .top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .icobtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:1rem}
  .btn{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--gold)}.btn-gold{background:linear-gradient(180deg,#f0d999,#cfa758);color:#2a1e05;border-color:transparent}
  /* Dashboard tổng quan */
  .dash{max-width:1180px;margin:14px auto 0;padding:0 16px;width:100%}
  .cd{border:2px solid var(--red);border-radius:14px;background:rgba(226,58,46,.08);text-align:center;padding:12px;margin-bottom:14px}
  .cd .lbl{color:var(--red-bright);font-size:.82rem;letter-spacing:.06em;font-weight:600}
  .cd .t{font-family:"Playfair Display",serif;color:var(--red-bright);font-size:2.3rem;font-weight:800;text-transform:uppercase;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
  .dgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:8px}@media(min-width:820px){.dgrid{grid-template-columns:1.1fr 1.4fr}}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}
  .card h3{font-size:.95rem;margin-bottom:12px}
  .bar-row{margin-bottom:12px}.bar-row .t{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px}.bar-row .t .nm{display:flex;gap:7px;align-items:center}
  .sw{width:9px;height:9px;border-radius:2px}.bar-track{height:9px;border-radius:5px;background:rgba(150,150,150,.18);overflow:hidden}.bar-fill{height:100%;border-radius:5px}
  .chk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.85rem;cursor:pointer}
  .chk:last-child{border-bottom:0}.chk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--green-ok)}
  .chk.done .box{background:rgba(67,224,141,.15);border-color:var(--green-ok)}.chk.done .lb{color:var(--muted);text-decoration:line-through}
  .chkhead{display:flex;justify-content:space-between;align-items:baseline}.chkhead .pg{color:var(--gold-bright);font-weight:700}
  /* tabs + toolbar */
  .tabs{max-width:1180px;margin:14px auto 0;padding:0 16px;width:100%;display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px 10px 0 0;padding:9px 16px;font-weight:600;font-size:.86rem;cursor:pointer}
  .tab.on{color:var(--text);border-bottom-color:transparent}
  .tab.toa.on{background:rgba(15,149,90,.16);border-color:var(--green);color:#8ff0c0}
  .tab.gal.on{background:rgba(46,127,204,.16);border-color:var(--blue);color:#bfe0ff}
  .tab.all.on{background:var(--gold);color:#1a1204}
  .toolbar{max-width:1180px;margin:0 auto;padding:10px 16px;width:100%;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--panel2)}
  .search{position:relative;flex:1;min-width:200px}.search input{width:100%;font:inherit;color:var(--text);background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 32px}
  .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .quick{display:flex;gap:6px;flex-wrap:wrap}
  .qb{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:20px;padding:7px 12px;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .qb.on{border-color:var(--gold);background:var(--gold);color:#1a1204}
  .qb.on.ok{background:var(--green-ok);border-color:var(--green-ok);color:#042a17}.qb.on.no{background:var(--amber);border-color:var(--amber);color:#2a1e05}
  .stats{margin-left:auto;font-size:.76rem;color:var(--muted)}.stats b{color:var(--text)}
  /* body */
  .body{flex:1;display:flex;min-height:0;max-width:1180px;width:100%;margin:0 auto;border:1px solid var(--line);border-top:0}
  .list{width:340px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel2)}
  .row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:rgba(216,184,118,.06)}.row.sel{background:rgba(216,184,118,.13);border-left:3px solid var(--gold)}
  .st-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--amber)}.st-dot.came{background:var(--green-ok)}
  .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#123f50,#0b2340);border:1px solid var(--line2);color:var(--gold-bright);font-family:serif;font-size:.85rem;overflow:hidden}
  .row .nm{flex:1;min-width:0}.row .nm .n1{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm .n2{color:var(--muted2);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rb{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
  .tag{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .tag.vip{color:var(--gold-bright);border:1px solid var(--line2)}.tag.dup{color:#ff9a8f;border:1px solid rgba(226,58,46,.4);background:rgba(226,58,46,.08)}
  .tag.came{color:#042a17;background:var(--green-ok)}.tag.no{color:var(--amber);border:1px solid rgba(240,179,74,.4)}
  .detail{flex:1;overflow-y:auto;padding:18px 20px 50px;min-width:0}
  .empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
  .dhead{display:flex;gap:14px;align-items:center;margin-bottom:8px}.dav{width:60px;height:60px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#123f50,#0b2340);border:1px solid var(--line2);color:var(--gold-bright);font-family:serif;font-size:1.4rem}
  .dupwarn{margin:10px 0;padding:10px 13px;border:1px solid rgba(226,58,46,.4);border-radius:9px;background:rgba(226,58,46,.08);color:#ff9a8f;font-size:.82rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 15px;margin-top:8px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}.fld.full{grid-column:1/-1}.fld label{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:.88rem;color:var(--text);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  .fld input[readonly]{color:var(--muted2)}
  .dactions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  @media(max-width:860px){.body{flex-direction:column}.list{width:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}.dgrid{grid-template-columns:1fr}}
</style></head><body>

  <nav class="nav"><!-- E08-D059: mục «Bảng RSVP» gỡ cùng trang /admin --><a class="on" href="/crm">CRM</a><a href="/xep-ban.html">Xếp bàn</a><a href="/check-in.html">Check-in</a></nav>

<div class="dash">

<div class="body"><aside class="list" id="list"></aside><section class="detail" id="detail"><div class="empty">Chọn khách để <b>sửa trực tiếp</b>.</div></section></div>

<script>
var SEED=[] /* R0 data removed E08-D019: SoT = /crm */;var KEY="esuhai20_crm_v2",CHK="esuhia20_prep",CI="esuhai20_checkin";
var PREP=["Chốt & rà DS khách (xử lý TRÙNG)","Phân hạng VIP từng khách","Xếp bàn (bàn/ghế)","Thu ảnh khách (đủ folder)","In thẻ tên bàn","In giấy số bàn/ghế phát khách","Phân công người phụ trách","Tập huấn PG/lễ tân (test 30/7)","Chuẩn bị quà tặng","Chuẩn bị thư cảm ơn","Chốt kịch bản đón tiếp"];
var FIELDS=[{k:"Mã khách",ro:1},{k:"Họ và tên"},{k:"Giới tính",opts:["","Nam","Nữ"]},{k:"Chức danh"},{k:"Đơn vị"},{k:"Buổi tham dự",opts:["","Tọa đàm","Gala","Tọa đàm + Gala"]},{k:"Ẩm thực",opts:["","Món mặn","Món chay"]},{k:"SĐT"},{k:"Vai trò",opts:["","Người đại diện","Khách đi cùng"]},{k:"Người phụ trách (Esuhai)"},{k:"Phân loại",opts:["","Khách VIP","Khách thường","Nội","Ngoại","Gia đình","Nội bộ","BTC","PG"]},{k:"Hạng VIP",opts:["","VIP1","VVIP"]},{k:"Số bàn"},{k:"Số ghế"},{k:"Kênh xác nhận",opts:["","Web","Điện thoại","Email","Trực tiếp","Chưa xác nhận"]},{k:"Trạng thái",opts:["","Đã xác nhận","Chưa xác nhận","Từ chối"]},{k:"Tên file ảnh"},{k:"Ghi chú nội bộ",area:1}];
function $(s){return document.querySelector(s);}
function norm(s){var t=String(s||"").toLowerCase().normalize("NFD"),o="";for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(c<0x300||c>0x36f)o+=t[i];}return o.replace(/đ/g,"d").replace(/^(ba|ong|co|chu|anh|chi|em|thay|gia dinh|ms|mr|mrs)\s+/,"").trim();}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function initials(n){var p=String(n||"").replace(/^(Bà|Ông|Cô|Chú|Anh|Chị|Em|Thầy|Gia đình|Ms\.|Mr\.)\s+/,"").trim().split(/\s+/);return(((p[p.length-2]||p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"")).toUpperCase();}
function isKanji(n){return /[぀-ヿ㐀-䶿一-鿿]/.test(String(n||""));}
var GUESTS,dirty=0,selId=null,state={tab:"all",q:"",quick:""},CImap={};
function load(){try{var s=localStorage.getItem(KEY);GUESTS=s?JSON.parse(s):SEED.map(function(g){return Object.assign({},g);});}catch(e){GUESTS=SEED.slice();}try{CImap=JSON.parse(localStorage.getItem(CI)||"{}");}catch(e){CImap={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(GUESTS));dirty=0;}catch(e){}}
function came(g){var c=CImap[g["Mã khách"]];return c&&c.at?c.at:"";}
// dedup theo TÊN không dấu
function computeDup(){var gr={};GUESTS.forEach(function(g){var n=norm(g["Họ và tên"]);if(n)(gr[n]=gr[n]||[]).push(g);});GUESTS.forEach(function(g){g.__dup=false;});Object.keys(gr).forEach(function(n){var a=gr[n];if(a.length<2)return;a.forEach(function(g){var gd=g["Giới tính"]||"";if(a.some(function(o){if(o===g)return false;var od=o["Giới tính"]||"";return !gd||!od||gd===od;}))g.__dup=true;});});}
function nm(g){return g["Họ và tên"]||"(chưa tên)";}
function match(g){
  if(state.tab==="toa" && String(g["Buổi tham dự"]||"").indexOf("Tọa đàm")===-1)return false;
  if(state.tab==="gal" && String(g["Buổi tham dự"]||"").indexOf("Gala")===-1)return false;
  if(state.quick==="vip" && String(g["Hạng VIP"]||"").indexOf("VIP")===-1 && String(g["Hạng VIP"]||"").indexOf("VVIP")===-1)return false;
  if(state.quick==="nhat" && !isKanji(nm(g)))return false;
  if(state.quick==="noi" && String(g["Phân loại"]||"").indexOf("Nội")===-1)return false;
  if(state.quick==="ngoai" && String(g["Phân loại"]||"").indexOf("Ngoại")===-1)return false;
  if(state.quick==="came" && !came(g))return false;
  if(state.quick==="no" && came(g))return false;
  if(state.q){var h=norm(nm(g)+" "+g["Chức danh"]+" "+g["Đơn vị"]+" "+g["Người phụ trách (Esuhai)"]);if(h.indexOf(norm(state.q))===-1)return false;}
  return true;}
function renderBuoi(){var toa=0,gal=0;GUESTS.forEach(function(g){var b=g["Buổi tham dự"]||"";if(b.indexOf("Tọa đàm")>=0)toa++;if(b.indexOf("Gala")>=0)gal++;});var mx=Math.max(toa,gal,1);
  $("#buoi").innerHTML=[["Tọa đàm chuyên đề",toa,"var(--green)"],["Gala Lễ kỷ niệm",gal,"var(--blue)"]].map(function(r){
    return '<div class="bar-row"><div class="t"><span class="nm"><span class="sw" style="background:'+r[2]+'"></span>'+r[0]+'</span><span class="num">'+r[1]+' khách</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(r[1]/mx*100)+'%;background:'+r[2]+'"></div></div></div>';}).join("");}
function renderChk(){var done={};try{done=JSON.parse(localStorage.getItem(CHK)||"{}");}catch(e){}var n=0;
  $("#chklist").innerHTML=PREP.map(function(t,i){var d=!!done[i];if(d)n++;return '<div class="chk'+(d?" done":"")+'" data-i="'+i+'"><span class="box">'+(d?"&#10003;":"")+'</span><span class="lb">'+esc(t)+'</span></div>';}).join("");
  $("#chkpg").textContent=n+"/"+PREP.length+" xong";}
function renderStats(){var t=GUESTS.filter(match).length,dup=GUESTS.filter(function(g){return g.__dup;}).length,cm=GUESTS.filter(came).length;
  $("#stats").innerHTML='<b>'+t+'</b> hiện · <b>'+cm+'</b> đã đến · <b style="color:var(--amber)">'+dup+'</b> nghi TRÙNG';}
function renderList(){var rows=GUESTS.filter(match);
  $("#list").innerHTML=rows.map(function(g){var cm=came(g);
    return '<div class="row'+(g["Mã khách"]===selId?" sel":"")+'" data-id="'+esc(g["Mã khách"])+'"><span class="st-dot'+(cm?" came":"")+'" title="'+(cm?"đã đến":"chưa đến")+'"></span>'
     +'<div class="av">'+esc(initials(nm(g)))+'</div><div class="nm"><div class="n1">'+esc(nm(g))+'</div><div class="n2">'+esc(g["Chức danh"]||g["Đơn vị"]||"")+'</div></div>'
     +'<div class="rb">'+(g["Hạng VIP"]?'<span class="tag vip">'+esc(g["Hạng VIP"])+'</span>':'')+(g.__dup?'<span class="tag dup">⚠ TRÙNG</span>':'')+(cm?'<span class="tag came">✓ '+esc(cm)+'</span>':'')+'</div></div>';}).join("")||'<div class="empty" style="height:auto;padding:24px">Không có khách khớp.</div>';}
function renderDetail(){var g=GUESTS.filter(function(x){return x["Mã khách"]===selId;})[0];if(!g){$("#detail").innerHTML='<div class="empty">Chọn khách để sửa.</div>';return;}
  var dupers=g.__dup?GUESTS.filter(function(x){return norm(x["Họ và tên"])===norm(g["Họ và tên"])&&x["Mã khách"]!==g["Mã khách"];}):[];
  var warn=g.__dup?'<div class="dupwarn">⚠ <b>Nghi TRÙNG tên</b> với: '+dupers.map(function(x){return esc(x["Mã khách"]+" "+x["Họ và tên"]);}).join(", ")+'. Đối chiếu kỹ trước khi giữ/gộp (không tự xoá).</div>':'';
  var grid=FIELDS.map(function(f){var v=g[f.k]||"",inp;if(f.opts)inp='<select data-k="'+esc(f.k)+'"'+(f.ro?' disabled':'')+'>'+f.opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o||"—")+'</option>';}).join("")+'</select>';else if(f.area)inp='<textarea data-k="'+esc(f.k)+'">'+esc(v)+'</textarea>';else inp='<input data-k="'+esc(f.k)+'" value="'+esc(v)+'"'+(f.ro?' readonly':'')+'>';return '<div class="fld'+(f.area?' full':'')+'"><label>'+esc(f.k)+'</label>'+inp+'</div>';}).join("");
  $("#detail").innerHTML='<div class="dhead"><div class="dav">'+esc(initials(nm(g)))+'</div><div><h2>'+esc(nm(g))+'</h2><div style="color:var(--muted);font-size:.85rem">'+esc(g["Mã khách"])+(came(g)?' · <span style="color:var(--green-ok)">đã đến '+esc(came(g))+'</span>':' · chưa đến')+'</div></div></div>'+warn+'<div class="grid">'+grid+'</div><div class="dactions"><button class="btn btn-gold" id="saveBtn">✓ Lưu</button><button class="btn" id="revertBtn">Hoàn tác</button><button class="btn" style="color:#ff9a8f" id="delBtn">Xoá</button></div>';}
function renderAll(){computeDup();renderBuoi();renderChk();renderStats();renderList();renderDetail();}
document.addEventListener("input",function(e){var el=e.target.closest("[data-k]");if(!el)return;var g=GUESTS.filter(function(x){return x["Mã khách"]===selId;})[0];if(g){g[el.getAttribute("data-k")]=el.value==="—"?"":el.value;dirty=1;}});
document.addEventListener("click",function(e){
  var row=e.target.closest(".row");if(row){selId=row.getAttribute("data-id");renderList();renderDetail();return;}
  var chk=e.target.closest(".chk");if(chk){var i=chk.getAttribute("data-i");var d={};try{d=JSON.parse(localStorage.getItem(CHK)||"{}");}catch(x){}d[i]=!d[i];localStorage.setItem(CHK,JSON.stringify(d));renderChk();return;}
  var tab=e.target.closest(".tab");if(tab){state.tab=tab.getAttribute("data-tab");document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});tab.classList.add("on");renderList();renderStats();return;}
  var qb=e.target.closest(".qb");if(qb){var q=qb.getAttribute("data-q");state.quick=(state.quick===q?"":q);document.querySelectorAll(".qb").forEach(function(b){b.classList.remove("on","ok","no");});if(state.quick){qb.classList.add("on");if(q==="came")qb.classList.add("ok");if(q==="no")qb.classList.add("no");}renderList();renderStats();return;}
  if(e.target.id==="saveBtn"){save();computeDup();renderList();renderStats();}
  if(e.target.id==="revertBtn"){load();renderAll();}
  if(e.target.id==="delBtn"){if(confirm("Xoá khách này?")){GUESTS=GUESTS.filter(function(x){return x["Mã khách"]!==selId;});selId=null;save();renderAll();}}
});
$("#addBtn").addEventListener("click",function(){var mx=0;GUESTS.forEach(function(g){var m=/^K(\d+)/.exec(g["Mã khách"]||"");if(m)mx=Math.max(mx,+m[1]);});var id="K"+String(mx+1).padStart(3,"0");var g={};FIELDS.forEach(function(f){g[f.k]="";});g["Mã khách"]=id;g["Trạng thái"]="Chưa xác nhận";GUESTS.unshift(g);save();selId=id;renderAll();});
$("#q").addEventListener("input",function(e){state.q=e.target.value;renderList();renderStats();});
$("#theme").addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="light"?"":"light";if(d)document.documentElement.setAttribute("data-theme",d);else document.documentElement.removeAttribute("data-theme");localStorage.setItem("crm_theme",d);this.innerHTML=d?"&#9788;":"&#9789;";});
if(localStorage.getItem("crm_theme")==="light"){document.documentElement.setAttribute("data-theme","light");$("#theme").innerHTML="&#9788;";}
$("#expBtn").addEventListener("click",function(){var cols=FIELDS.map(function(f){return f.k;});var rows=[cols].concat(GUESTS.map(function(g){return cols.map(function(k){return g[k]||"";});}));var csv="﻿"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="DS_CRM.csv";a.click();});
function tickCd(){var t=new Date(2026,7,8,17,0,0)-new Date();if(t<0){$("#cd").textContent="ĐÃ DIỄN RA";return;}var d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;$("#cd").textContent="CHỈ CÒN "+d+" NGÀY "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
load();renderAll();tickCd();setInterval(tickCd,1000);
</script></body></html>
