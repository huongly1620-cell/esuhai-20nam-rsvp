<html lang="vi"><head>

<title>CRM Khách mời · Gala 20 Năm ESUHAI</title>
<!-- R0 · Hương Ly — CRM Khách mời (sửa trực tiếp). Seed = DS TGĐ mời (import lần 1). localStorage tạm; Kha nối DB sau. -->
<style>
  :root{--ink:#050d18;--navy:#0E1B31;--deep:#08111F;--panel:#0d1f38;--gold:#d8b876;--gold-bright:#f4e2b0;
    --cream:#f5efe1;--muted:#b9b096;--muted-2:#8f886f;--green:#43e08d;--crimson:#e23a2e;--amber:#f0b34a;
    --line:rgba(216,184,118,.2);--line-strong:rgba(216,184,118,.42);--card:rgba(255,255,255,.035);
    --serif:"Playfair Display","Cambria",Georgia,serif;--sans:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--cream);line-height:1.45;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 500px at 88% -8%,rgba(20,88,78,.3),transparent 60%),linear-gradient(170deg,#0b1a30,#0b2330 55%,#08111F);
    display:flex;flex-direction:column}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}.num{font-variant-numeric:tabular-nums}
  /* topbar (giống admin để hiểu cùng web) */
  .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(8,17,31,.94),rgba(8,17,31,.6));border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
  .logo{height:26px}.brand{font-weight:700;letter-spacing:.1em;font-size:.78rem;text-transform:uppercase}.brand b{color:var(--gold);font-weight:400}
  .nav{display:flex;gap:4px;margin-left:6px;flex-wrap:wrap}
  .nav a{font-size:.74rem;color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:8px;letter-spacing:.02em}
  .nav a.on{color:var(--ink);background:var(--gold);font-weight:700}
  .nav a:not(.on):hover{color:var(--gold-bright);background:rgba(216,184,118,.08)}
  .top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:rgba(5,13,24,.5);color:var(--cream);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:var(--gold-bright)}
  .btn-gold{background:linear-gradient(180deg,#f0d999,#cfa758);color:#2a1e05;border-color:transparent}
  .btn-danger{color:#ff9a8f;border-color:rgba(226,58,46,.35)}
  .save-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted-2);margin-right:6px}
  .save-dot.dirty{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(5,13,24,.25)}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;font:inherit;color:var(--cream);background:rgba(5,13,24,.6);border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px}
  .search input:focus{outline:none;border-color:var(--gold)}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  select.f{font:inherit;font-size:.82rem;color:var(--cream);background:rgba(5,13,24,.5);border:1px solid var(--line);border-radius:9px;padding:8px 10px;-webkit-appearance:none}
  select.f:focus{outline:none;border-color:var(--gold)}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-left:auto}
  .stats b{color:var(--cream)}.stats .warn b{color:var(--amber)}
  /* body master-detail */
  .body{flex:1;display:flex;min-height:0}
  .list{width:340px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:rgba(5,13,24,.2)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
  .row:hover{background:rgba(216,184,118,.05)}.row.sel{background:rgba(216,184,118,.12);border-left:3px solid var(--gold)}
  .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#123f50,#0b2340);border:1px solid var(--line-strong);color:var(--gold-bright);font-family:var(--serif);font-size:.9rem;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .row .nm{flex:1;min-width:0}.row .nm .n1{color:var(--cream);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .n2{color:var(--muted-2);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rb{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
  .tag{font-size:.6rem;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .tag.vip{color:var(--gold-bright);border:1px solid var(--line-strong)}
  .tag.ok{color:var(--green);border:1px solid rgba(67,224,141,.35)}.tag.no{color:var(--amber);border:1px solid rgba(240,179,74,.35)}.tag.re{color:#ff9a8f;border:1px solid rgba(226,58,46,.35)}
  .flag{color:var(--amber);font-size:.62rem}
  /* detail */
  .detail{flex:1;overflow-y:auto;padding:20px 22px 60px;min-width:0}
  .empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
  .dhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .dhead .dav{width:66px;height:66px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#123f50,#0b2340);border:1px solid var(--line-strong);color:var(--gold-bright);font-family:var(--serif);font-size:1.5rem;overflow:hidden}
  .dhead .dav img{width:100%;height:100%;object-fit:cover}
  .dhead h2{font-size:1.4rem}.dhead .sub{color:var(--muted);font-size:.85rem}
  .healthbar{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
  .health{font-size:.72rem;padding:6px 11px;border-radius:8px;border:1px solid rgba(240,179,74,.4);background:rgba(240,179,74,.08);color:var(--amber)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:8px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}.fld.full{grid-column:1/-1}
  .fld label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:.9rem;color:var(--cream);background:rgba(5,13,24,.55);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,184,118,.12)}
  .fld input[readonly]{color:var(--muted-2);background:rgba(5,13,24,.3)}
  .fld textarea{resize:vertical;min-height:60px}
  .dactions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:sticky;bottom:0;padding:14px 0;background:linear-gradient(180deg,transparent,#0a1930 30%)}
  @media(max-width:860px){.body{flex-direction:column}.list{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}}
</style></head>

  }).join("");
  $("#detail").innerHTML=
    '<div class="dhead"><div class="dav">'+esc(initials(nm(g)))+'</div>'
    +'<div><h2>'+esc(nm(g))+'</h2><div class="sub">'+esc(g["Mã khách"])+(g["Người phụ trách (Esuhai)"]?' · phụ trách: '+esc(g["Người phụ trách (Esuhai)"]):'')+'</div></div></div>'
    +health+'<div class="grid">'+grid+'</div>'
    +'<div class="dactions"><button class="btn btn-gold" id="saveBtn">&#10003; Lưu thay đổi</button><button class="btn" id="revertBtn">Hoàn tác</button><button class="btn btn-danger" id="delBtn">Xoá khách này</button></div>';
}
document.addEventListener("input",function(e){
  var el=e.target.closest("[data-k]");if(!el)return;var g=GUESTS.filter(function(x){return x["Mã khách"]===selId;})[0];if(!g)return;
  g[el.getAttribute("data-k")]=el.value==="—"?"":el.value; dirty=true; renderDot();
});
document.addEventListener("click",function(e){
  var row=e.target.closest(".row");if(row){selectG(row.getAttribute("data-id"));return;}
  if(e.target.id==="saveBtn"){save();renderList();renderStats();renderDetail();}
  if(e.target.id==="revertBtn"){load();dirty=false;renderDot();renderList();renderStats();renderDetail();}
  if(e.target.id==="delBtn"){if(confirm("Xoá khách này khỏi danh sách?")){GUESTS=GUESTS.filter(function(x){return x["Mã khách"]!==selId;});selId=null;dirty=true;renderDot();save();renderAll();}}
});
$("#addBtn").addEventListener("click",function(){
  var max=0;GUESTS.forEach(function(g){var m=/^K(\d+)/.exec(g["Mã khách"]||"");if(m)max=Math.max(max,+m[1]);});
  var id="K"+String(max+1).padStart(3,"0");var g={};FIELDS.forEach(function(f){g[f.k]="";});g["Mã khách"]=id;g["Trạng thái"]="Chưa xác nhận";g["Kênh xác nhận"]="Trực tiếp";
  GUESTS.unshift(g);dirty=true;renderDot();save();selectG(id);renderStats();
});
$("#exportBtn").addEventListener("click",function(){
  var cols=FIELDS.map(function(f){return f.k;});
  var rows=[cols].concat(GUESTS.map(function(g){return cols.map(function(k){return g[k]||"";});}));
  var csv="﻿"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="DS_khach_CRM_gala.csv";a.click();
});
$("#q").addEventListener("input",function(e){state.q=e.target.value;renderList();});
$("#fStatus").addEventListener("change",function(e){state.status=e.target.value;renderList();});
$("#fVip").addEventListener("change",function(e){state.vip=e.target.value;renderList();});
$("#fPT").addEventListener("change",function(e){state.pt=e.target.value;renderList();});
function renderAll(){renderStats();renderList();renderDetail();renderDot();}
load();renderAll();
</script>
</body></html>
