  .nav a.on{color:#1a1204;background:var(--gold);font-weight:700}.nav a:not(.on):hover{color:var(--gold-bright)}

  .btn:hover{border-color:var(--gold)}.btn-gold{background:linear-gradient(180deg,#f0d999,#cfa758);color:#2a1e05;border-color:transparent}

  .sw{width:9px;height:9px;border-radius:2px}.bar-track{height:9px;border-radius:5px;background:rgba(150,150,150,.18);overflow:hidden}.bar-fill{height:100%;border-radius:5px}
  .chk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.85rem;cursor:pointer}
  .chk:last-child{border-bottom:0}.chk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--green-ok)}

  .tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px 10px 0 0;padding:9px 16px;font-weight:600;font-size:.86rem;cursor:pointer}

  .dactions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}

  if(state.quick==="vip" && String(g["Hạng VIP"]||"").indexOf("VIP")===-1 && String(g["Hạng VIP"]||"").indexOf("VVIP")===-1)return false;
  if(state.quick==="nhat" && !isKanji(nm(g)))return false;
  if(state.quick==="noi" && String(g["Phân loại"]||"").indexOf("Nội")===-1)return false;
  if(state.quick==="ngoai" && String(g["Phân loại"]||"").indexOf("Ngoại")===-1)return false;
  if(state.quick==="came" && !came(g))return false;
  if(state.quick==="no" && came(g))return false;
  if(state.q){var h=norm(nm(g)+" "+g["Chức danh"]+" "+g["Đơn vị"]+" "+g["Người phụ trách (Esuhai)"]);if(h.indexOf(norm(state.q))===-1)return false;}
  return true;}
function renderBuoi(){var toa=0,gal=0;GUESTS.forEach(function(g){var b=g["Buổi tham dự"]||"";if(b.indexOf("Tọa đàm")>=0)toa++;if(b.indexOf("Gala")>=0)gal++;});var mx=Math.max(toa,gal,1);
  $("#buoi").innerHTML=[["Tọa đàm chuyên đề",toa,"var(--green)"],["Gala Lễ kỷ niệm",gal,"var(--blue)"]].map(function(r){
    return '<div class="bar-row"><div class="t"><span class="nm"><span class="sw" style="background:'+r[2]+'"></span>'+r[0]+'</span><span class="num">'+r[1]+' khách</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(r[1]/mx*100)+'%;background:'+r[2]+'"></div></div></div>';}).join("");}
function renderChk(){var done={};try{done=JSON.parse(localStorage.getItem(CHK)||"{}");}catch(e){}var n=0;
  $("#chklist").innerHTML=PREP.map(function(t,i){var d=!!done[i];if(d)n++;return '<div class="chk'+(d?" done":"")+'" data-i="'+i+'"><span class="box">'+(d?"&#10003;":"")+'</span><span class="lb">'+esc(t)+'</span></div>';}).join("");
  $("#chkpg").textContent=n+"/"+PREP.length+" xong";}
function renderStats(){var t=GUESTS.filter(match).length,dup=GUESTS.filter(function(g){return g.__dup;}).length,cm=GUESTS.filter(came).length;
  $("#stats").innerHTML='<b>'+t+'</b> hiện · <b>'+cm+'</b> đã đến · <b style="color:var(--amber)">'+dup+'</b> nghi TRÙNG';}
function renderList(){var rows=GUESTS.filter(match);
  $("#list").innerHTML=rows.map(function(g){var cm=came(g);
    return '<div class="row'+(g["Mã khách"]===selId?" sel":"")+'" data-id="'+esc(g["Mã khách"])+'"><span class="st-dot'+(cm?" came":"")+'" title="'+(cm?"đã đến":"chưa đến")+'"></span>'
     +'<div class="av">'+esc(initials(nm(g)))+'</div><div class="nm"><div class="n1">'+esc(nm(g))+'</div><div class="n2">'+esc(g["Chức danh"]||g["Đơn vị"]||"")+'</div></div>'
     +'<div class="rb">'+(g["Hạng VIP"]?'<span class="tag vip">'+esc(g["Hạng VIP"])+'</span>':'')+(g.__dup?'<span class="tag dup">⚠ TRÙNG</span>':'')+(cm?'<span class="tag came">✓ '+esc(cm)+'</span>':'')+'</div></div>';}).join("")||'<div class="empty" style="height:auto;padding:24px">Không có khách khớp.</div>';}
function renderDetail(){var g=GUESTS.filter(function(x){return x["Mã khách"]===selId;})[0];if(!g){$("#detail").innerHTML='<div class="empty">Chọn khách để sửa.</div>';return;}
  var dupers=g.__dup?GUESTS.filter(function(x){return norm(x["Họ và tên"])===norm(g["Họ và tên"])&&x["Mã khách"]!==g["Mã khách"];}):[];
  var warn=g.__dup?'<div class="dupwarn">⚠ <b>Nghi TRÙNG tên</b> với: '+dupers.map(function(x){return esc(x["Mã khách"]+" "+x["Họ và tên"]);}).join(", ")+'. Đối chiếu kỹ trước khi giữ/gộp (không tự xoá).</div>':'';
  var grid=FIELDS.map(function(f){var v=g[f.k]||"",inp;if(f.opts)inp='<select data-k="'+esc(f.k)+'"'+(f.ro?' disabled':'')+'>'+f.opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o||"—")+'</option>';}).join("")+'</select>';else if(f.area)inp='<textarea data-k="'+esc(f.k)+'">'+esc(v)+'</textarea>';else inp='<input data-k="'+esc(f.k)+'" value="'+esc(v)+'"'+(f.ro?' readonly':'')+'>';return '<div class="fld'+(f.area?' full':'')+'"><label>'+esc(f.k)+'</label>'+inp+'</div>';}).join("");
  $("#detail").innerHTML='<div class="dhead"><div class="dav">'+esc(initials(nm(g)))+'</div><div><h2>'+esc(nm(g))+'</h2><div style="color:var(--muted);font-size:.85rem">'+esc(g["Mã khách"])+(came(g)?' · <span style="color:var(--green-ok)">đã đến '+esc(came(g))+'</span>':' · chưa đến')+'</div></div></div>'+warn+'<div class="grid">'+grid+'</div><div class="dactions"><button class="btn btn-gold" id="saveBtn">✓ Lưu</button><button class="btn" id="revertBtn">Hoàn tác</button><button class="btn" style="color:#ff9a8f" id="delBtn">Xoá</button></div>';}
function renderAll(){computeDup();renderBuoi();renderChk();renderStats();renderList();renderDetail();}
document.addEventListener("input",function(e){var el=e.target.closest("[data-k]");if(!el)return;var g=GUESTS.filter(function(x){return x["Mã khách"]===selId;})[0];if(g){g[el.getAttribute("data-k")]=el.value==="—"?"":el.value;dirty=1;}});
document.addEventListener("click",function(e){
  var row=e.target.closest(".row");if(row){selId=row.getAttribute("data-id");renderList();renderDetail();return;}
  var chk=e.target.closest(".chk");if(chk){var i=chk.getAttribute("data-i");var d={};try{d=JSON.parse(localStorage.getItem(CHK)||"{}");}catch(x){}d[i]=!d[i];localStorage.setItem(CHK,JSON.stringify(d));renderChk();return;}
  var tab=e.target.closest(".tab");if(tab){state.tab=tab.getAttribute("data-tab");document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});tab.classList.add("on");renderList();renderStats();return;}
  var qb=e.target.closest(".qb");if(qb){var q=qb.getAttribute("data-q");state.quick=(state.quick===q?"":q);document.querySelectorAll(".qb").forEach(function(b){b.classList.remove("on","ok","no");});if(state.quick){qb.classList.add("on");if(q==="came")qb.classList.add("ok");if(q==="no")qb.classList.add("no");}renderList();renderStats();return;}
  if(e.target.id==="saveBtn"){save();computeDup();renderList();renderStats();}
  if(e.target.id==="revertBtn"){load();renderAll();}
  if(e.target.id==="delBtn"){if(confirm("Xoá khách này?")){GUESTS=GUESTS.filter(function(x){return x["Mã khách"]!==selId;});selId=null;save();renderAll();}}
});
$("#addBtn").addEventListener("click",function(){var mx=0;GUESTS.forEach(function(g){var m=/^K(\d+)/.exec(g["Mã khách"]||"");if(m)mx=Math.max(mx,+m[1]);});var id="K"+String(mx+1).padStart(3,"0");var g={};FIELDS.forEach(function(f){g[f.k]="";});g["Mã khách"]=id;g["Trạng thái"]="Chưa xác nhận";GUESTS.unshift(g);save();selId=id;renderAll();});
$("#q").addEventListener("input",function(e){state.q=e.target.value;renderList();renderStats();});
$("#theme").addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="light"?"":"light";if(d)document.documentElement.setAttribute("data-theme",d);else document.documentElement.removeAttribute("data-theme");localStorage.setItem("crm_theme",d);this.innerHTML=d?"&#9788;":"&#9789;";});
if(localStorage.getItem("crm_theme")==="light"){document.documentElement.setAttribute("data-theme","light");$("#theme").innerHTML="&#9788;";}
$("#expBtn").addEventListener("click",function(){var cols=FIELDS.map(function(f){return f.k;});var rows=[cols].concat(GUESTS.map(function(g){return cols.map(function(k){return g[k]||"";});}));var csv="﻿"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="DS_CRM.csv";a.click();});
function tickCd(){var t=new Date(2026,7,8,17,0,0)-new Date();if(t<0){$("#cd").textContent="ĐÃ DIỄN RA";return;}var d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;$("#cd").textContent=d+" ngày "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
load();renderAll();tickCd();setInterval(tickCd,1000);
</script></body></html>
