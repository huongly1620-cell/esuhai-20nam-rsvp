<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Đón tiếp · ESUHAI 20 năm</title>
<style>
  :root{--bg:#050d18;--panel:#0c1726;--panel2:#0a1420;--gold:#d8b876;--gold-b:#f4e2b0;--cream:#f5efe1;
    --muted:#8a9bb0;--line:#1d2c40;--green:#57c98a;--red:#ff8a7d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    line-height:1.5;padding-bottom:40px}
  .top{position:sticky;top:0;z-index:20;background:rgba(5,13,24,.96);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
  .top .t{font-weight:700;font-size:.95rem}
  .top .role{font-size:.66rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:2px 8px;text-transform:uppercase}
  .top .sp{margin-left:auto}
  .lnk{background:none;border:0;color:var(--muted);font-size:.78rem;cursor:pointer;padding:6px}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .search{position:relative}
  .search input{width:100%;font-size:1.1rem;padding:15px 14px 15px 42px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--cream)}
  .search input:focus{outline:none;border-color:var(--gold)}
  .search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:20px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--gold);background:var(--gold);color:#1a1204}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--cream);border-radius:10px;padding:11px 15px;font-size:.9rem;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn.gold{background:var(--gold);color:#1a1204;border-color:transparent;font-weight:700}
  .btn.green{background:var(--green);color:#04150c;border-color:transparent;font-weight:700}
  .btn.danger{color:var(--red);border-color:rgba(255,138,125,.4)}
  .btn.block{width:100%;justify-content:center;padding:15px;font-size:1.02rem}
  .btn:disabled{opacity:.5}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .g{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .g .nm{font-weight:600}
  .g .meta{color:var(--muted);font-size:.78rem}
  .g .sp{margin-left:auto;text-align:right}
  .badge{font-size:.66rem;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .badge.in{background:rgba(87,201,138,.16);color:var(--green);border:1px solid rgba(87,201,138,.4)}
  .badge.out{background:rgba(138,155,176,.12);color:var(--muted);border:1px solid var(--line)}
  .rsvp-tag{font-size:.6rem;font-weight:700;color:#7fd6c0;border:1px solid rgba(127,214,192,.4);border-radius:20px;padding:1px 6px;vertical-align:middle;margin-left:4px}
  .table-tag{font-size:.68rem;font-weight:800;color:#1a1204;background:var(--gold);border-radius:20px;padding:2px 9px;white-space:nowrap;display:inline-block;margin-bottom:4px}
  .empty{color:var(--muted);text-align:center;padding:36px 16px}
  /* sheet / modal */
  .sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,8,16,.72)}
  .sheet.show{display:block}
  .sheet-in{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--panel);
    border-top-left-radius:18px;border-top-right-radius:18px;border-top:1px solid var(--line);padding:16px 16px calc(env(safe-area-inset-bottom) + 24px)}
  @media(min-width:640px){.sheet-in{max-width:560px;margin:0 auto;border-radius:16px;top:50%;bottom:auto;transform:translateY(-50%)}}
  .sheet h2{font-size:1.15rem;margin:2px 0 2px}
  .sheet .close{position:absolute;right:12px;top:12px}
  .fld{margin:12px 0}
  .fld .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:4px}
  .fld .v{color:var(--cream)}
  input.f,select.f,textarea.f{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--cream);font-size:1rem;font-family:inherit}
  input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--gold)}
  .ci-on{border:1px solid rgba(87,201,138,.4);background:rgba(87,201,138,.1);color:var(--green);border-radius:10px;padding:11px 14px;font-size:.9rem;margin:10px 0}
  .inter{border-top:1px solid var(--line);padding:10px 0;font-size:.88rem}
  .inter .m{color:var(--muted);font-size:.72rem}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .msg{font-size:.82rem;min-height:1em;margin-top:8px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .sec-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin:18px 0 6px}
  table.aud{width:100%;border-collapse:collapse;font-size:.78rem}
  table.aud td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
</style>
</head>
<body>
  <div class="top">
    <div class="t">CRM Đón tiếp</div>
    <span class="role" id="roleTag">—</span>
    <span class="sp"></span>
    <button class="lnk" id="auditBtn" style="display:none">Audit</button>
    <button class="lnk" id="importBtn" style="display:none">Import</button>
    <button class="lnk" id="logoutBtn">Đăng xuất</button>
  </div>

  <div class="wrap">
    <div class="search">
      <span class="ic">&#8981;</span>
      <input id="q" type="search" placeholder="Tìm khách theo tên / SĐT / đơn vị…" autocomplete="off">
    </div>
    <div class="row">
      <button class="chip on" id="chipAll" data-mine="0">Tất cả khách</button>
      <button class="chip" id="chipMine" data-mine="1">Của tôi</button>
      <span class="sp" style="margin-left:auto"></span>
      <button class="btn gold" id="addBtn" style="display:none">+ Thêm khách</button>
    </div>
    <div class="list" id="list"><div class="empty">Nhập từ khóa để tìm khách…</div></div>
  </div>

  <!-- guest detail sheet -->
  <div class="sheet" id="sheet">
    <div class="sheet-in">
      <button class="btn close" id="sheetClose">Đóng &#10005;</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- generic form sheet (add guest / import / audit) -->
  <div class="sheet" id="sheet2">
    <div class="sheet-in">
      <button class="btn close" id="sheet2Close">Đóng &#10005;</button>
      <div id="sheet2Body"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  var me={email:"",role:"staff"};
  var mine="0", curGuest=null;

  function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fmt(iso){ if(!iso) return "—"; try{ return new Date(iso).toLocaleString("vi-VN"); }catch(_){ return iso; } }
  async function api(url, opts){
    opts=opts||{}; opts.credentials="same-origin"; opts.headers=opts.headers||{};
    var r=await fetch(url, opts);
    if(r.status===401){ location.href="/crm"; throw new Error("unauth"); }
    return r;
  }
  async function jget(url){ var r=await api(url); return r.json(); }
  async function jsend(url, method, body){
    var r=await api(url,{method:method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    var j=await r.json().catch(function(){return {};}); return {ok:r.ok,status:r.status,body:j};
  }

  /* ---- search ---- */
  var t;
  function scheduleSearch(){ clearTimeout(t); t=setTimeout(doSearch, 220); }
  async function doSearch(){
    var q=$("#q").value.trim();
    if(!q && mine==="0"){ $("#list").innerHTML='<div class="empty">Nhập từ khóa để tìm khách…</div>'; return; }
    try{
      var j=await jget("/crm/guests?mine="+mine+"&q="+encodeURIComponent(q));
      var rows=j.rows||[];
      if(!rows.length){ $("#list").innerHTML='<div class="empty">Không tìm thấy khách phù hợp.</div>'; return; }
      $("#list").innerHTML=rows.map(function(g){
        var badge=g.checked_in?'<span class="badge in">&#10003; Đã điểm danh</span>':'<span class="badge out">Chưa</span>';
        var tban=g.table_no?'<span class="table-tag">Bàn '+esc(g.table_no)+'</span>':'';
        return '<div class="g" data-id="'+g.id+'"><div><div class="nm">'+esc(g.full_name)+(g.from_rsvp?' <span class="rsvp-tag">RSVP</span>':'')+'</div>'
          +'<div class="meta">'+esc([g.org,g.title].filter(Boolean).join(" · ")||"—")+'</div></div>'
          +'<div class="sp">'+tban+badge+'</div></div>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll(".g"), function(el){
        el.addEventListener("click", function(){ openGuest(el.getAttribute("data-id")); });
      });
    }catch(e){ if(e.message!=="unauth") $("#list").innerHTML='<div class="empty">Lỗi tải dữ liệu.</div>'; }
  }

  /* ---- guest detail ---- */
  async function openGuest(id){
    try{
      var j=await jget("/crm/guests/"+id);
      curGuest=j; renderGuest(j);
      $("#sheet").classList.add("show");
    }catch(e){}
  }
  function renderGuest(j){
    var g=j.guest, ci=j.checkIn;
    var canDelete=(me.role==="btl");
    var ciBlock = ci
      ? '<div class="ci-on">&#10003; Đã điểm danh bởi <b>'+esc(ci.actor_email)+'</b> lúc '+esc(fmt(ci.checked_in_at))+'</div>'
      : '<button class="btn green block" id="ciBtn">&#10003; Điểm danh khách này</button>';
    var photos=(j.photos||[]).map(function(p){ return '<img src="'+esc(p.url)+'" alt="ảnh khách" loading="lazy">'; }).join("");
    var inter=(j.interactions||[]).map(function(x){
      return '<div class="inter"><div>'+esc(x.body)+'</div><div class="m">'+esc(x.kind)+' · '+esc(x.actor_email)+' · '+esc(fmt(x.created_at))+'</div></div>';
    }).join("") || '<div class="inter m">Chưa có ghi chú tương tác.</div>';
    var assigned=(j.assignments||[]).map(function(a){return esc(a.staff_email);}).join(", ")||"—";

    $("#sheetBody").innerHTML =
      '<h2>'+esc(g.full_name)+'</h2>'
      + (g.table_no?'<div class="table-tag" style="font-size:1rem;padding:6px 14px;margin:6px 0 2px">&#127869; Bàn '+esc(g.table_no)+'</div>':'')
      + '<div class="fld"><div class="k">Đơn vị · Chức danh</div><div class="v">'+esc([g.org,g.title].filter(Boolean).join(" · ")||"—")+'</div></div>'
      + '<div class="fld"><div class="k">Liên hệ</div><div class="v">'+esc([g.phone,g.email].filter(Boolean).join(" · ")||"—")+'</div></div>'
      + '<div class="fld"><div class="k">Phân công</div><div class="v">'+assigned+'</div></div>'
      + ciBlock
      + '<div class="sec-title">Ghi tương tác</div>'
      + '<div class="row"><select class="f" id="iKind" style="flex:0 0 34%"><option>gọi</option><option>gặp</option><option>gửi ảnh</option><option>khác</option></select>'
      + '<input class="f" id="iBody" placeholder="Nội dung…" style="flex:1"></div>'
      + '<button class="btn block" id="iSave">Lưu ghi chú</button>'
      + '<div>'+inter+'</div>'
      + '<div class="sec-title">Ảnh</div>'
      + '<div class="thumbs" id="thumbs">'+ (photos||'<span class="m" style="color:var(--muted);font-size:.82rem">Chưa có ảnh.</span>') +'</div>'
      + '<label class="btn block" style="margin-top:8px">&#128247; Chụp / tải ảnh lên<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"></label>'
      + '<div class="sec-title">Sửa thông tin</div>'
      + '<div class="fld"><input class="f" id="ePhone" placeholder="SĐT" value="'+esc(g.phone||"")+'"></div>'
      + '<div class="fld"><input class="f" id="eOrg" placeholder="Đơn vị" value="'+esc(g.org||"")+'"></div>'
      + '<div class="fld"><input class="f" id="eNote" placeholder="Ghi chú nội bộ" value="'+esc(g.note||"")+'"></div>'
      + '<button class="btn block" id="eSave">Lưu thông tin</button>'
      + (canDelete?'<button class="btn danger block" id="delBtn" style="margin-top:8px">Xóa khách này</button>':'')
      + '<div class="msg" id="gMsg"></div>';

    var ciBtn=$("#ciBtn");
    if(ciBtn) ciBtn.addEventListener("click", async function(){
      ciBtn.disabled=true;
      var r=await jsend("/crm/guests/"+g.id+"/check-in","POST",{});
      if(r.body.already){ gmsg("Khách đã điểm danh bởi "+r.body.by+" lúc "+fmt(r.body.at),"ok"); }
      openGuest(g.id);
    });
    $("#iSave").addEventListener("click", async function(){
      var body=$("#iBody").value.trim(); if(!body){ gmsg("Nhập nội dung.","err"); return; }
      var r=await jsend("/crm/guests/"+g.id+"/interactions","POST",{kind:$("#iKind").value,body:body});
      if(r.ok){ openGuest(g.id); } else gmsg(r.body.error||"Lỗi lưu.","err");
    });
    $("#eSave").addEventListener("click", async function(){
      var r=await jsend("/crm/guests/"+g.id,"PATCH",{phone:$("#ePhone").value,org:$("#eOrg").value,note:$("#eNote").value});
      if(r.ok){ gmsg("Đã lưu.","ok"); openGuest(g.id); } else gmsg(r.body.error||"Lỗi.","err");
    });
    var delBtn=$("#delBtn");
    if(delBtn) delBtn.addEventListener("click", async function(){
      if(!confirm("Xóa khách "+g.full_name+"? (ẩn khỏi danh sách)")) return;
      var r=await jsend("/crm/guests/"+g.id,"DELETE");
      if(r.ok){ $("#sheet").classList.remove("show"); doSearch(); } else gmsg(r.body.error||"Lỗi xóa.","err");
    });
    $("#photoInput").addEventListener("change", async function(){
      var f=this.files && this.files[0]; if(!f) return;
      gmsg("Đang tải ảnh…","ok");
      var fd=new FormData(); fd.append("photo", f);
      try{ var r=await api("/crm/guests/"+g.id+"/photos",{method:"POST",body:fd});
        var jj=await r.json().catch(function(){return {};});
        if(r.ok){ openGuest(g.id); } else gmsg(jj.error||"Lỗi tải ảnh.","err");
      }catch(e){ gmsg("Lỗi tải ảnh.","err"); }
    });
  }
  function gmsg(t,c){ var m=$("#gMsg"); if(m){ m.textContent=t; m.className="msg"+(c?(" "+c):""); } }

  /* ---- btl: add guest ---- */
  function openAdd(){
    $("#sheet2Body").innerHTML =
      '<h2>Thêm khách mới</h2>'
      + '<div class="fld"><input class="f" id="nName" placeholder="Họ tên *"></div>'
      + '<div class="fld"><input class="f" id="nPhone" placeholder="Số điện thoại"></div>'
      + '<div class="fld"><input class="f" id="nOrg" placeholder="Đơn vị"></div>'
      + '<div class="fld"><input class="f" id="nTitle" placeholder="Chức danh"></div>'
      + '<button class="btn gold block" id="nSave">Tạo khách</button><div class="msg" id="nMsg"></div>';
    $("#nSave").addEventListener("click", async function(){
      var name=$("#nName").value.trim(); if(!name){ $("#nMsg").textContent="Nhập họ tên."; $("#nMsg").className="msg err"; return; }
      var r=await jsend("/crm/guests","POST",{full_name:name,phone:$("#nPhone").value,org:$("#nOrg").value,title:$("#nTitle").value});
      if(r.ok){ $("#sheet2").classList.remove("show"); openGuest(r.body.id); } else { $("#nMsg").textContent=r.body.error||"Lỗi."; $("#nMsg").className="msg err"; }
    });
    $("#sheet2").classList.add("show");
  }
  /* ---- btl: import ---- */
  function openImport(){
    $("#sheet2Body").innerHTML =
      '<h2>Import CSV phân công</h2>'
      + '<p style="color:var(--muted);font-size:.84rem">Cột: guest_ext_id, full_name, org, title, phone, email, assigned_email, tags. Chạy lại nhiều lần không nhân đôi (upsert).</p>'
      + '<input class="f" type="file" id="impFile" accept=".csv,.xlsx">'
      + '<button class="btn gold block" id="impRun" style="margin-top:10px">Chạy import</button><div class="msg" id="impMsg"></div>';
    $("#impRun").addEventListener("click", async function(){
      var f=$("#impFile").files && $("#impFile").files[0]; if(!f){ $("#impMsg").textContent="Chọn file CSV."; $("#impMsg").className="msg err"; return; }
      $("#impMsg").textContent="Đang import…"; $("#impMsg").className="msg";
      var fd=new FormData(); fd.append("file", f);
      try{ var r=await api("/crm/import",{method:"POST",body:fd}); var j=await r.json().catch(function(){return {};});
        if(r.ok){ $("#impMsg").textContent="Xong: tạo "+j.created+", cập nhật "+j.updated+", phân công "+j.assigned+"."; $("#impMsg").className="msg ok"; }
        else { $("#impMsg").textContent=j.error||"Lỗi import."; $("#impMsg").className="msg err"; }
      }catch(e){ $("#impMsg").textContent="Lỗi import."; $("#impMsg").className="msg err"; }
    });
    $("#sheet2").classList.add("show");
  }
  /* ---- btl: audit ---- */
  async function openAudit(){
    $("#sheet2Body").innerHTML='<h2>Nhật ký (audit)</h2><div id="audArea" class="msg">Đang tải…</div>'
      +'<a class="btn block" href="/crm/audit/export.csv" style="margin-top:10px">&#8681; Xuất CSV audit</a>';
    $("#sheet2").classList.add("show");
    try{ var j=await jget("/crm/audit?limit=100");
      var rows=(j.rows||[]).map(function(x){
        return '<tr><td>'+esc(fmt(x.created_at))+'</td><td>'+esc(x.actor_email||"—")+'</td><td>'+esc(x.event_type)+'</td><td>'+esc(x.target_id||"")+'</td></tr>';
      }).join("");
      $("#audArea").outerHTML='<table class="aud"><tbody>'+ (rows||'<tr><td>Chưa có sự kiện.</td></tr>') +'</tbody></table>';
    }catch(e){}
  }

  /* ---- init ---- */
  $("#q").addEventListener("input", scheduleSearch);
  $("#chipAll").addEventListener("click", function(){ mine="0"; this.classList.add("on"); $("#chipMine").classList.remove("on"); doSearch(); });
  $("#chipMine").addEventListener("click", function(){ mine="1"; this.classList.add("on"); $("#chipAll").classList.remove("on"); doSearch(); });
  $("#sheetClose").addEventListener("click", function(){ $("#sheet").classList.remove("show"); });
  $("#sheet2Close").addEventListener("click", function(){ $("#sheet2").classList.remove("show"); });
  $("#sheet").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("show"); });
  $("#sheet2").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("show"); });
  $("#addBtn").addEventListener("click", openAdd);
  $("#importBtn").addEventListener("click", openImport);
  $("#auditBtn").addEventListener("click", openAudit);
  $("#logoutBtn").addEventListener("click", async function(){ await fetch("/auth/logout",{method:"POST",credentials:"same-origin"}); location.href="/crm"; });

  jget("/crm/me").then(function(j){
    me.email=j.email; me.role=j.role; $("#roleTag").textContent=j.role;
    if(j.role==="btl"){ $("#addBtn").style.display=""; $("#importBtn").style.display=""; $("#auditBtn").style.display=""; }
  }).catch(function(){});
})();
</script>
</body>
</html>
