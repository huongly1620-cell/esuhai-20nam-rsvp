<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Đón tiếp · ESUHAI 20 năm</title>
<!-- R0 (Hương Ly) · UX v3 trên /crm · GIỮ NGUYÊN API của Kha (auth/list/detail/check-in/photo/PATCH/import/audit). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── DARK (mặc định) ── */
    --gold:#e0bd77;--gold-b:#f6e6bd;--gold-d:#b8963f;--gold-soft:rgba(224,189,119,.14);
    --green:#1fb073;--green-b:#5fe4a6;--blue:#4a97e6;--blue-b:#96c8ff;
    --red:#ec5140;--red-b:#ff8676;--amber:#f2b74e;--ok:#45e08e;
    --bg1:#0a1826;--bg2:#0b2130;--bg3:#081019;--glow:rgba(31,176,115,.14);--glow2:rgba(224,189,119,.06);
    --panel:rgba(255,255,255,.05);--panel2:rgba(7,16,27,.66);--card:rgba(255,255,255,.032);--hover:rgba(255,255,255,.07);
    --text:#f4eede;--muted:#aca592;--muted2:#837c66;--line:rgba(224,189,119,.16);--line2:rgba(224,189,119,.32);--inp:rgba(4,11,22,.55);
    --shadow:0 10px 32px rgba(0,0,0,.36);--r:16px;
  }
  :root[data-theme=light]{
    /* ── LIGHT (ivory sang trọng) ── */
    --gold:#a97f2e;--gold-b:#8a6414;--gold-d:#c6a458;--gold-soft:rgba(169,127,46,.1);
    --green:#0e955f;--green-b:#0b7a4d;--blue:#2f74c4;--blue-b:#2560a8;
    --red:#d23a2a;--red-b:#b02a1c;--amber:#c8892a;--ok:#12a15f;
    --bg1:#faf6ec;--bg2:#f5efe1;--bg3:#efe7d5;--glow:rgba(20,140,100,.08);--glow2:rgba(169,127,46,.07);
    --panel:rgba(255,255,255,.75);--panel2:rgba(255,255,255,.92);--card:rgba(255,255,255,.9);--hover:#fff;
    --text:#2a2418;--muted:#6d6552;--muted2:#9a9078;--line:rgba(120,92,36,.18);--line2:rgba(120,92,36,.34);--inp:#fff;
    --shadow:0 8px 26px rgba(120,92,40,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);line-height:1.45;padding-bottom:46px;
    background:radial-gradient(1200px 600px at 82% -12%,var(--glow),transparent 60%),radial-gradient(760px 380px at 6% 2%,var(--glow2),transparent 58%),linear-gradient(166deg,var(--bg1),var(--bg2) 50%,var(--bg3))}
  body.jp{font-family:"Noto Sans JP","Be Vietnam Pro",sans-serif;letter-spacing:.005em}
  h1,h2,h3{font-family:"Playfair Display",Georgia,"Cambria",serif;font-weight:600;margin:0}
  body.jp h2,body.jp h3,body.jp .pf-nm{font-family:"Noto Serif JP","Playfair Display",serif}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px}
  ::selection{background:var(--gold-soft)}

  /* ── HEADER ── */
  .top{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);background:linear-gradient(180deg,rgba(8,16,25,.9),rgba(8,16,25,.58));border-bottom:1px solid var(--line)}
  :root[data-theme=light] .top{background:linear-gradient(180deg,rgba(250,246,236,.94),rgba(250,246,236,.72))}
  .top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
  .logo{height:27px;filter:drop-shadow(0 1px 5px rgba(0,0,0,.35))}
  .brand{line-height:1.03}.brand .b1{font-family:"Playfair Display",serif;font-size:1rem;font-weight:700;letter-spacing:.015em}.brand .b2{font-size:.56rem;text-transform:uppercase;letter-spacing:.24em;color:var(--gold)}
  .hanh{display:flex;gap:4px;margin-left:1px}.hanh i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}.h-kim{background:#ece6d3;border:1px solid #b7a06a}.h-moc{background:#2fae6a}.h-thuy{background:#4a97e6}.h-hoa{background:#ec5140}.h-tho{background:#c79a3e}
  .role{font-size:.56rem;color:var(--gold-b);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:2px 9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .top-r{margin-left:auto;display:flex;gap:7px;align-items:center}
  .lang{border:1px solid var(--line2);background:transparent;color:var(--gold-b);border-radius:9px;padding:6px 11px;font:inherit;font-size:.68rem;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:.15s}.lang:hover{background:var(--gold-soft)}
  .icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:1rem;display:grid;place-items:center;transition:.15s}.icobtn:hover{border-color:var(--line2);background:var(--hover)}
  .menu{position:relative}.menu-pop{position:absolute;right:0;top:42px;background:var(--panel2);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow);padding:6px;display:none;min-width:196px;z-index:50}
  .menu.open .menu-pop{display:block;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}}
  .menu-pop button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;color:var(--text);font:inherit;font-size:.83rem;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;transition:.12s}.menu-pop button:hover{background:var(--panel)}.menu-pop .sep{height:1px;background:var(--line);margin:5px 4px}.menu-pop .cap{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:6px 12px 3px}
  /* metabar: 2 countdown + counter */
  .metabar{display:flex;align-items:center;gap:8px;padding:8px 14px;max-width:1080px;margin:0 auto;flex-wrap:wrap;border-top:1px solid var(--line)}
  .cdm{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
  .cdm .dt{width:6px;height:6px;border-radius:50%}.cdm.toa .dt{background:var(--green);box-shadow:0 0 7px var(--green)}.cdm.gala .dt{background:var(--blue);box-shadow:0 0 7px var(--blue)}
  .cdm .k{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.6rem}.cdm .v{color:var(--text)}
  .counter{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:5px 14px 5px 6px}
  .counter .lb{font-size:.56rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.counter .big{font-family:"Playfair Display",serif;font-weight:800;font-size:1.1rem;color:var(--ok);line-height:1}.counter .tot{color:var(--muted);font-size:.82rem}
  .ring{width:32px;height:32px;border-radius:50%;background:conic-gradient(var(--ok) var(--p,0deg),rgba(140,140,140,.2) 0);display:grid;place-items:center}.ring i{width:23px;height:23px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.55rem;color:var(--ok);font-style:normal;font-weight:800}

  /* ── OVERVIEW ── */
  .ov{margin:14px 0 0}
  .ov-head{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:.18s}.ov-head:hover{border-color:var(--line2)}
  .ov.open .ov-head{border-radius:var(--r) var(--r) 0 0;border-bottom:0}
  .ov-head .ico{color:var(--gold)}.ov-head h3{flex:1;font-size:.98rem}.ov-head .chev{color:var(--gold);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.ov.open .ov-head .chev{transform:rotate(180deg)}
  .ov-head .mini{display:flex;gap:6px;font-size:.64rem;color:var(--muted)}.ov.open .ov-head .mini{display:none}
  .pill{padding:2px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .ov-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}.ov.open .ov-wrap{grid-template-rows:1fr}
  .ov-body{overflow:hidden;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);background:var(--panel)}
  .ov-in{padding:16px 15px;display:grid;gap:15px}
  .cd2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cdbox{border-radius:14px;padding:13px;text-align:center;border:1.5px solid;position:relative;overflow:hidden}
  .cdbox.toa{border-color:rgba(31,176,115,.4);background:linear-gradient(165deg,rgba(31,176,115,.13),rgba(31,176,115,.03))}
  .cdbox.gala{border-color:rgba(74,151,230,.42);background:linear-gradient(165deg,rgba(74,151,230,.14),rgba(74,151,230,.03))}
  .cdbox .tag2{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.cdbox.toa .tag2{color:var(--green-b)}.cdbox.gala .tag2{color:var(--blue-b)}
  .cdbox .cd-big{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-weight:800;font-size:1.3rem;line-height:1.14;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--text)}
  .cdbox .hh{font-size:.72rem;color:var(--muted);margin-top:4px}
  .cdv{font-size:.72rem;color:var(--muted);margin-top:8px;display:flex;gap:5px;align-items:center;justify-content:center;line-height:1.3}.cdv .pin{opacity:.85}
  .venue-edit{grid-column:1/-1;border:1px dashed var(--line);background:none;color:var(--gold);border-radius:11px;padding:9px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer;transition:.15s}.venue-edit:hover{background:var(--gold-soft)}
  .tag.dup{color:#fff;background:var(--red);animation:dpul 2s infinite}@keyframes dpul{50%{opacity:.7}}
  .chip.act{color:var(--gold-b);border-color:var(--line2)}.chip.act:hover{background:var(--gold-soft)}
  .dupwarn{border:1px solid rgba(236,81,64,.4);background:rgba(236,81,64,.1);color:var(--red-b);border-radius:11px;padding:10px 12px;font-size:.82rem;margin:10px 0;text-align:center;font-weight:600}
  .bar-h{font-size:.68rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold);margin-bottom:11px;font-weight:700}
  .bar-row{margin-bottom:12px}.bar-row:last-child{margin-bottom:0}.bar-row .t{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem;margin-bottom:5px}.bar-row .t .nm{display:flex;gap:7px;align-items:center}.sw{width:9px;height:9px;border-radius:2px}.bar-track{height:10px;border-radius:6px;background:rgba(140,140,140,.16);overflow:hidden}.bar-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .bar-row .t b{font-size:1.02rem;font-family:"Playfair Display",serif}
  .chk-card{border-top:1px dashed var(--line);padding-top:14px}
  .chk-toggle{display:flex;align-items:center;gap:9px;cursor:pointer}.chk-toggle .bar-h{margin:0;flex:1}.chk-toggle .chev{color:var(--gold);transition:transform .22s}.chk-open .chk-toggle .chev{transform:rotate(90deg)}.chk-toggle .pg{color:var(--gold-b);font-weight:800;font-size:.8rem}
  .chk-body{display:none;margin-top:11px}.chk-open .chk-body{display:block}
  .chk-list{display:grid;grid-template-columns:1fr;gap:2px}@media(min-width:560px){.chk-list{grid-template-columns:1fr 1fr;gap:2px 14px}}
  .chk{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:9px;font-size:.84rem;transition:.12s;position:relative}.chk:hover{background:var(--panel)}
  .chk .box{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--ok);font-size:.72rem;cursor:pointer;transition:.15s}.chk.done .box{background:rgba(69,224,142,.16);border-color:var(--ok);animation:tick .3s}
  @keyframes tick{50%{transform:scale(1.25)}}
  .chk .lb{flex:1;cursor:pointer}.chk.done .lb{color:var(--muted);text-decoration:line-through}
  .chk .del{opacity:0;color:var(--red-b);cursor:pointer;font-size:.9rem;border:0;background:none;padding:2px 5px}.chk:hover .del{opacity:.7}.chk .del:hover{opacity:1}
  .addtask{display:flex;gap:7px;margin-top:9px}.addtask input{flex:1;font:inherit;font-size:.82rem;color:var(--text);background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:9px 11px}.addtask input:focus{outline:none;border-color:var(--line2)}
  .addtask button{border:1px solid var(--line2);background:var(--gold-soft);color:var(--gold-b);border-radius:9px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}

  /* ── FILTER BAR (sticky) ── */
  .fbar{position:sticky;top:0;z-index:30;margin-top:16px;padding-top:10px;background:linear-gradient(180deg,var(--bg2) 72%,transparent)}
  :root[data-theme=light] .fbar{background:linear-gradient(180deg,var(--bg1) 72%,transparent)}
  .tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:12px;padding:9px 16px;font-weight:700;font-size:.83rem;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:.18s}
  .tab:hover{border-color:var(--line2)}
  .tab .ct{font-size:.66rem;background:var(--panel);border-radius:10px;padding:1px 7px;color:var(--muted)}
  .tab.all.on{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#241802;border-color:transparent;box-shadow:0 3px 12px rgba(184,150,63,.28)}.tab.all.on .ct{background:rgba(0,0,0,.15);color:#241802}
  .tab.toa.on{background:rgba(31,176,115,.16);border-color:var(--green);color:var(--green-b)}.tab.toa.on .ct{color:var(--green-b)}
  .tab.gal.on{background:rgba(74,151,230,.16);border-color:var(--blue);color:var(--blue-b)}.tab.gal.on .ct{color:var(--blue-b)}
  .tools{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .search{position:relative;flex:1;min-width:180px}.search input{width:100%;font:inherit;color:var(--text);background:var(--inp);border:1px solid var(--line);border-radius:11px;padding:11px 13px 11px 38px;transition:.15s}.search input:focus{outline:none;border-color:var(--line2);box-shadow:0 0 0 3px var(--gold-soft)}.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:9px 12px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}.chip:hover{border-color:var(--line2)}.chip.on{background:rgba(69,224,142,.14);border-color:var(--ok);color:var(--ok)}
  select.sel{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:9px 10px;font:inherit;font-size:.76rem;cursor:pointer}
  .statline{font-size:.76rem;color:var(--muted);padding:11px 2px 5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.statline b{color:var(--text)}.statline .ok{color:var(--ok)}

  /* ── LIST ── */
  .list{display:flex;flex-direction:column;gap:8px;padding-bottom:20px;animation:fadein .3s}
  @keyframes fadein{from{opacity:0}}
  .g{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:11px 13px;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
  .g:hover{border-color:var(--line2);background:var(--hover);transform:translateY(-1px)}
  .g:active{transform:scale(.988)}
  .g.done{border-color:rgba(69,224,142,.3);background:linear-gradient(90deg,rgba(69,224,142,.08),transparent 62%)}
  .av{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,#17475c,#0d2648);border:1px solid var(--line2);color:var(--gold-b);font-family:"Playfair Display",serif;font-size:1rem;font-weight:600;position:relative}
  :root[data-theme=light] .av{background:linear-gradient(155deg,#e8ddc2,#d8c9a4);color:#6a4e12}
  .av img{width:100%;height:100%;object-fit:cover}
  .av .sd{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--bg2);background:var(--amber)}.av .sd.in{background:var(--ok)}
  :root[data-theme=light] .av .sd{border-color:#fff}
  .g .nm{flex:1;min-width:0}.g .n1{font-family:"Playfair Display",serif;font-size:1.06rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}.g .n2{color:var(--muted2);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .rb{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .tag{font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
  .tag.v1{color:#3a2600;background:linear-gradient(180deg,#f6e6bd,#dcb75e)}.tag.v2{color:#241802;background:linear-gradient(180deg,var(--gold),var(--gold-d))}
  .tag.v3{color:var(--gold-b);border:1px solid var(--line2)}.tag.v4{color:var(--muted);border:1px solid var(--line)}
  .tag.tbl{color:var(--gold-b);border:1px solid var(--line2)}.tag.rsvp{color:var(--green-b);border:1px solid rgba(95,228,166,.36)}.tag.in{color:#04220f;background:var(--ok)}
  .empty{color:var(--muted);text-align:center;padding:46px 16px}.empty .em-ic{font-size:2.1rem;opacity:.5;margin-bottom:8px}
  .skel{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--panel),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* ── SHEET ── */
  .sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(3,8,16,.72);backdrop-filter:blur(4px)}.sheet.show{display:block;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet-in{position:absolute;left:0;right:0;bottom:0;max-height:95vh;overflow:auto;background:linear-gradient(180deg,var(--bg2),var(--bg3));border-radius:22px 22px 0 0;border-top:2px solid var(--gold);padding:16px 16px 40px;box-shadow:0 -14px 44px rgba(0,0,0,.42);animation:slideup .3s cubic-bezier(.2,.85,.25,1)}
  @keyframes slideup{from{transform:translateY(100%)}}
  @media(min-width:640px){.sheet-in{max-width:560px;margin:0 auto;border-radius:18px;top:50%;bottom:auto;transform:translateY(-50%);animation:fade .22s}}
  .grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 8px}@media(min-width:640px){.grab{display:none}}
  .close{position:absolute;right:12px;top:12px;z-index:2}
  .pf-b{text-align:center}
  .pf-av{width:190px;height:190px;border-radius:18px;margin:6px auto 0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,#17475c,#0d2648);border:2px solid var(--gold);color:var(--gold-b);font-family:"Playfair Display",serif;font-size:3.3rem;box-shadow:var(--shadow)}
  :root[data-theme=light] .pf-av{background:linear-gradient(155deg,#e8ddc2,#d8c9a4);color:#6a4e12}
  .pf-av img{width:100%;height:100%;object-fit:cover}
  .pf-nm{font-family:"Playfair Display",serif;font-size:1.58rem;font-weight:700;color:var(--text);margin-top:14px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  .pf-rl{color:var(--muted);font-size:.9rem;margin-top:4px}

 async function api(url,opts){opts=opts||{};opts.credentials="same-origin";opts.headers=opts.headers||{};var r=await fetch(url,opts);if(r.status===401){location.href="/crm";throw new Error("unauth");}return r;}
 async function jget(url){var r=await api(url);return r.json();}
 async function jsend(url,method,body){var r=await api(url,{method:method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});var j=await r.json().catch(function(){return {};});return {ok:r.ok,status:r.status,body:j};}
 /* ---- tags/note helpers ---- */
 function tagList(g){return String(g.tags||"").split(",").map(function(s){return s.trim();}).filter(Boolean);}
 function hasTag(g,x){return tagList(g).indexOf(x)>=0;}
 // Buổi HIỆU LỰC do máy chủ tính (tag ∪ form) — E08-D028. Làn rollback cũng
 // phải đếm đúng: lật CRM_UI=classic mà vẫn đếm tag là mất 47 khách Gala.
 function duBuoi(g,t){return t==="toa"?!!g.du_toa_dam:t==="gal"?!!g.du_gala:true;}
 function buoiOf(g){var t=!!g.du_toa_dam,ga=!!g.du_gala;return t&&ga?tt("toa")+" + "+tt("gal"):t?tt("toa"):ga?tt("gal"):"—";}
 function vipOf(g){var m=tagList(g).filter(function(x){return /vip/i.test(x)&&x.toLowerCase()!=="khách vip";});return m[0]||"";}
 function vipRank(g){var v=noAcc(vipOf(g)).replace(/[^0-9]/g,"");return v?parseInt(v,10):(vipOf(g)?1:99);}
 function noteF(g,label){var m=new RegExp(label+"\\s*[:：]\\s*([^·]+)").exec(g.note||"");return m?m[1].trim():"";}

 function match(g){
   if(state.tab!=="all"&&!duBuoi(g,state.tab))return false;
   if(state.wait&&g.checked_in)return false;
   if(state.dup&&!isDup(g))return false;
   if(state.q){var s=noAcc(state.q);if(noAcc(g.full_name+" "+(g.org||"")+" "+(g.title||"")+" "+(g.phone||"")).indexOf(s)===-1)return false;}
   return true;
 }

/* E08-D028 AC-D — ảnh ngang / nhiều người không bị cắt mất người.
   Không có metadata kích thước trong crm_photos, nên phải đo phía client bằng
   naturalWidth/naturalHeight khi ảnh load xong (CSS không đọc được tỉ lệ gốc).
   w/h >= 1.25 → khổ ngang: nới BỀ RỘNG khung, GIỮ NGUYÊN chiều cao để không
   giật layout, và đổi sang object-fit:contain để không crop. */
function imgFit(el){
  try{
    if(!el||!el.naturalWidth||!el.naturalHeight)return;
    if(el.naturalWidth/el.naturalHeight>=1.25){
      el.classList.add("landscape");
      if(el.parentNode&&el.parentNode.classList)el.parentNode.classList.add("landscape");
    }
  }catch(e){}
}

   else if(state.sort==="table")rows.sort(function(a,b){return (parseInt(a.table_no,10)||999)-(parseInt(b.table_no,10)||999);});
   else if(state.sort==="status")rows.sort(function(a,b){return (a.checked_in?1:0)-(b.checked_in?1:0)||String(a.full_name).localeCompare(String(b.full_name),"vi");});
   else rows.sort(function(a,b){return String(a.full_name).localeCompare(String(b.full_name),"vi");});
   var inShown=rows.filter(function(g){return g.checked_in;}).length;
   var nd=ALL.filter(isDup).length;$("#statline").innerHTML=tt("showing")+' <b>'+rows.length+'</b> '+tt("of")+' '+ALL.length+' · <span class="ok">'+inShown+'</span> '+tt("arr2")+(nd?' · <span style="color:var(--red-b)">⚠ '+nd+(LANG==="jp"?" 件重複":" trùng")+'</span>':'');

   }).join("");

 function setLang(l){LANG=l;localStorage.setItem("crm_lang",l);document.body.classList.toggle("jp",l==="jp");document.documentElement.lang=l==="jp"?"ja":"vi";document.querySelectorAll("[data-i]").forEach(function(el){var v=tt(el.getAttribute("data-i"));if(v)el.innerHTML=v;});document.querySelectorAll("[data-iph]").forEach(function(el){el.placeholder=tt(el.getAttribute("data-iph"));});$("#langBtn").textContent=l==="jp"?"Tiếng Việt":"日本語";renderDash();renderList();tickCd();if(curId)openGuest(curId);}
 function cdParts(target){var t=new Date(target.replace(" ","T"))-new Date();if(isNaN(t))return null;if(t<0)return {over:true};var d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;return {d:d,h:h,m:m,s:s};}
 function P(x){return String(x).padStart(2,"0");}
 function cdText(p,full){if(!p)return "—";if(p.over)return tt("over");var base=p.d+" "+tt("days")+" "+P(p.h)+":"+P(p.m)+(full?":"+P(p.s):"");return base;}
 function cdMini(p){if(!p||p.over)return tt("over");return p.d+tt("days")+" "+P(p.h)+":"+P(p.m);}
 function hhLabel(iso){try{var d=new Date(iso.replace(" ","T"));var dd=d.toLocaleDateString(LANG==="jp"?"ja-JP":"vi-VN",{day:"2-digit",month:"2-digit"});return dd+" · "+P(d.getHours())+":"+P(d.getMinutes());}catch(e){return "";}}
 function tickCd(){var pt=cdParts(CFG.toa),pg=cdParts(CFG.gala);$("#cdToa").textContent=cdText(pt,true);$("#cdGala").textContent=cdText(pg,true);$("#cdmToa").textContent=cdMini(pt);$("#cdmGala").textContent=cdMini(pg);$("#hhToa").textContent=hhLabel(CFG.toa);$("#hhGala").textContent=hhLabel(CFG.gala);}
 /* ---- events ---- */
 $("#ovHead").addEventListener("click",function(){$("#ov").classList.toggle("open");});
 $("#chkToggle").addEventListener("click",function(e){e.stopPropagation();$("#chkCard").classList.toggle("chk-open");});
 $("#chklist").addEventListener("click",function(e){
   var tk=e.target.getAttribute("data-tk");if(tk!=null){TASKS[+tk].d=!TASKS[+tk].d;saveTasks();renderTasks();return;}
   var dl2=e.target.getAttribute("data-tkdel");if(dl2!=null){TASKS.splice(+dl2,1);saveTasks();renderTasks();}
 });
 function addTask(){var v=$("#taskInput").value.trim();if(!v)return;TASKS.push({t:v,d:false});saveTasks();renderTasks();$("#taskInput").value="";$("#chkCard").classList.add("chk-open");}
 $("#taskAdd").addEventListener("click",addTask);
 $("#taskInput").addEventListener("keydown",function(e){if(e.key==="Enter")addTask();});
 document.addEventListener("click",function(e){
   var tab=e.target.closest(".tab");if(tab){state.tab=tab.getAttribute("data-tab");document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});tab.classList.add("on");renderList();return;}
   var g=e.target.closest(".g");if(g){openGuest(g.getAttribute("data-id"));return;}
   if(!e.target.closest("#menu"))$("#menu").classList.remove("open");
 });
 $("#menuBtn").addEventListener("click",function(e){e.stopPropagation();$("#menu").classList.toggle("open");});
 $("#q").addEventListener("input",function(e){state.q=e.target.value;renderList();});
 $("#chipWait").addEventListener("click",function(){state.wait=!state.wait;this.classList.toggle("on",state.wait);renderList();});
 $("#chipDup").addEventListener("click",function(){state.dup=!state.dup;this.classList.toggle("on",state.dup);renderList();});
 $("#impBtn2").addEventListener("click",openImport);
 $("#expBtn2").addEventListener("click",openExport);
 $("#sort").addEventListener("change",function(e){state.sort=e.target.value;renderList();});
 $("#langBtn").addEventListener("click",function(){setLang(LANG==="jp"?"vn":"jp");});
 $("#themeBtn").addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="light"?"":"light";if(d)document.documentElement.setAttribute("data-theme",d);else document.documentElement.removeAttribute("data-theme");localStorage.setItem("crm_theme",d);this.innerHTML=d?"&#9788;":"&#9789;";});
 $("#venueEdit").addEventListener("click",function(e){e.stopPropagation();openCfg();});
 $("#sheetClose").addEventListener("click",function(){$("#sheet").classList.remove("show");curId=null;});
 $("#sheet2Close").addEventListener("click",function(){$("#sheet2").classList.remove("show");});
 $("#sheet").addEventListener("click",function(e){if(e.target===this){this.classList.remove("show");curId=null;}});
 $("#sheet2").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show");});
 $("#addBtn").addEventListener("click",openAdd);$("#importBtn").addEventListener("click",openImport);$("#auditBtn").addEventListener("click",openAudit);$("#cfgBtn").addEventListener("click",openCfg);
 $("#expCsvBtn").addEventListener("click",function(){exportCSV();$("#menu").classList.remove("open");});
 $("#expXlsBtn").addEventListener("click",function(){exportXls();$("#menu").classList.remove("open");});
 $("#logoutBtn").addEventListener("click",async function(){await fetch("/auth/logout",{method:"POST",credentials:"same-origin"});location.href="/crm";});
 var toTop=$("#toTop");window.addEventListener("scroll",function(){toTop.classList.toggle("show",window.scrollY>420);});
 toTop.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
 /* ---- init ---- */
 if(localStorage.getItem("crm_theme")==="light"){document.documentElement.setAttribute("data-theme","light");$("#themeBtn").innerHTML="&#9788;";}
 setLang(LANG);tickCd();setInterval(tickCd,1000);
 jget("/crm/me").then(function(j){me.email=j.email;me.role=j.role;$("#roleTag").textContent=j.role;if(j.role==="btl"){$("#addBtn").style.display="";$("#importBtn").style.display="";$("#auditBtn").style.display="";$("#cfgBtn").style.display="";$("#venueEdit").style.display="";$("#impBtn2").style.display="";}}).catch(function(){});
 loadAll();
})();
</script>
</body>
