<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ảnh sự kiện · ESUHAI 20 năm</title>
<style>
  :root{
    --bg1:#050b14;--bg2:#071019;--panel:rgba(255,255,255,.05);--panel2:rgba(7,16,27,.66);
    --text:#f4eede;--muted:#aca592;--line:rgba(224,189,119,.16);--line2:rgba(224,189,119,.32);
    --gold:#e0bd77;--ok:#43e08d;--bad:#e05a5a;--fs-small:.72rem;--fs-micro:.66rem;
    /* E08-D122 · cỡ riêng cho ba nhãn ĐÈ LÊN ẢNH (`.hieu` `.nhan` `.pt`). Không hạ
       thẳng `--fs-micro`: biến ấy còn nuôi `.dem` và `.canh` — hai thứ nằm trên MẶT
       GIẤY của trang, nơi chữ nhỏ hơn nữa là chữ khó đọc chứ không phải chữ khiêm
       tốn. Chỉ chữ nằm trên ảnh mới phải nhường ảnh. */
    --fs-nhan:.6rem;
  }
  :root[data-theme=light]{
    --bg1:#f7f3e8;--bg2:#efe8d6;--panel:rgba(255,255,255,.75);--panel2:rgba(255,255,255,.92);
    --text:#2a2418;--muted:#6d6552;--line:rgba(120,92,36,.18);--line2:rgba(120,92,36,.34);--gold:#a97f2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",system-ui,Arial,sans-serif;
    color:var(--text);background:linear-gradient(166deg,var(--bg1),var(--bg2));min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:1.05rem;margin:0;font-weight:700}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;
    padding:8px 13px;font:inherit;font-size:.82rem;cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--gold)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{padding:5px 10px;font-size:var(--fs-small)}
  /* Nút chỉ có HÌNH. `min-width`/`min-height` 30px là ngưỡng chạm, không phải cỡ
     hình: hình chỉ 14px, phần còn lại là vùng bấm. Không dùng `width` cứng — nút
     này đứng trong hàng flex cùng ba nút chữ, `min-*` cho nó cao bằng hàng mà
     không bóp hình khi trình duyệt phóng chữ to. */
  .btn.ic-nut{padding:5px;min-width:30px;min-height:30px;
    display:inline-flex;align-items:center;justify-content:center}
  .btn.ic-nut .ic{display:block;width:14px;height:14px}
  .btn.ok{border-color:rgba(67,224,141,.5);color:var(--ok)}
  .btn.bad{border-color:rgba(224,90,90,.5);color:#ffb3b3}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:var(--fs-small)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:13px}
  input[type=search],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:9px 12px;font:inherit;font-size:.85rem;width:100%}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:.85rem}
  th{color:var(--muted);font-size:var(--fs-small);font-weight:600}
  tr.kh{cursor:pointer}
  tr.kh:hover{background:var(--panel2)}
  .dem{display:inline-block;min-width:26px;text-align:center;border-radius:999px;padding:2px 8px;
    font-size:var(--fs-micro);border:1px solid var(--line2)}
  .dem.co{background:rgba(67,224,141,.14);border-color:rgba(67,224,141,.4);color:var(--ok)}
  .dem.cho{background:rgba(224,189,119,.14);border-color:var(--line2);color:var(--gold)}
  .canh{color:var(--bad);font-size:var(--fs-micro)}
  /* E08-D102 · lưới ảnh là màn chính. minmax nhỏ hơn bản D077 (150→120) vì ở 360px
     một cột 150 cộng khe cộng padding vẫn vừa, nhưng hai cột thì tràn — mà lưới một
     cột thì không còn là lưới. 120 cho đúng hai cột ở 360px. */
  .luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .o{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel2)}
  .o img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
  button.o{padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
  button.o:hover{border-color:var(--gold)}
  /* Hai dấu trên ô lưới. Chữ nghĩa của chúng nằm ở dòng chú giải phía trên lưới,
     không nhét vào `title`: chuỗi trong title không đổi theo ngôn ngữ nếu quên
     dịch, và AC-7 quét đúng chỗ đó.

     Tên `.hieu` chứ KHÔNG phải `.co` (Gate 2 D103 · N1). Bản D102 đặt tên nó là
     `.co`, trùng với `.co` vốn đã là bổ nghĩa MÀU của `.dem` ở trên. Hệ quả: mọi
     `<span class="dem co">` — số «trong album» của khối, và dấu ✓ trong trang xem
     ảnh — nuốt luôn `position:absolute; top:6px`. Không có tổ tiên nào được định
     vị nên chúng neo theo TRANG: chồng lên nhau ở góc trên, đè nút «← Về CRM», và
     biến mất khỏi hàng số của khối. Một tên class dùng cho hai nghĩa thì lỗi không
     nằm ở chỗ ta sửa mà ở chỗ khác — nên đổi tên, không vá bằng position:relative. */
  /* ── E08-D118 · MỘT HỌ NỀN MỜ cho mọi nhãn ĐÈ LÊN ẢNH ──────────────────────
     Ba nhãn ngồi trên tấm hình — số gợi ý trên lưới (`.hieu`), thanh đáy trong
     khối (`.nhan`), ô phần trăm góc phải (`.pt`) — dùng CHUNG một nền: kính mờ
     tối, chữ sáng. Trước D118 mỗi cái một nền ĐẶC vàng hoặc xanh; đứng cạnh nhau
     trên cùng một trang chúng đọc như ba viên thuốc dán lên ảnh, mà tấm ảnh mới
     là thứ người ta mở trang để xem.
     Vì sao scrim TỐI + chữ SÁNG chứ không ngược lại: nền của ba nhãn này là ẢNH,
     không phải mặt giấy của trang. Ảnh hội trường phần lớn sáng, nên một nền
     trong suốt sáng mang chữ đen sẽ chìm ngay vào chỗ sáng của ảnh; nền tối cộng
     `text-shadow` thì đọc được trên cả tấm sáng lẫn tấm tối.
     Cũng vì nền là ẢNH nên ba nhãn này KHÔNG theo `data-theme`: màu chữ ở đây là
     số cố định, không `var(--gold)` — biến ấy đổi sang vàng sẫm #a97f2e ở giao
     diện sáng, và vàng sẫm trên scrim tối là chữ không đọc được.
     `-webkit-backdrop-filter` phải nói riêng: Safari trên iPhone — máy của người
     ngồi duyệt — chưa nhận tên không tiền tố. Trình duyệt nào không có
     `backdrop-filter` thì vẫn còn độ đục đỡ nền, chữ không rơi thẳng lên ảnh.
     ── E08-D122 · MỎNG HƠN · NHỎ HƠN · NHẠT HƠN ẢNH ─────────────────────────
     D118 làm ba nhãn cùng một họ, nhưng để họ ấy ở 600/700 đậm, .66rem, scrim .56
     và chữ trắng gần đặc — cộng lại thành một tấm biển dán đè lên ảnh. Người mở
     khối là để nhìn TẤM HÌNH; nhãn chỉ trả lời câu hỏi thứ hai.
     Ba đòn bẩy đi CÙNG nhau chứ không một mình, vì mỗi cái một mình đều hỏng:
     hạ mỗi độ đậm thì chữ nhạt mà khối chữ vẫn to; hạ mỗi cỡ thì chữ bé mà vẫn
     đen kịt; hạ mỗi scrim thì chữ đậm rơi thẳng lên ảnh, đọc còn khó hơn cũ.
     Chữ KHÔNG trắng đặc nữa (`.86` thay vì `#eef3f9`) và `text-shadow` giữ
     nguyên: khi scrim mỏng đi thì bóng chữ mới là thứ giữ chữ đọc được trên tấm
     sáng, và bóng thì không làm chữ trông nặng thêm như độ đậm. */
  .hieu,.nhan,.pt{background:rgba(7,16,27,.42);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    font-size:var(--fs-nhan);font-weight:450;letter-spacing:.005em;
    color:rgba(238,243,249,.86);text-shadow:0 1px 2px rgba(0,0,0,.6)}
  /* Bo NHẸ, không `999px`: cùng lý do bỏ viên thuốc ở thanh đáy — hình tròn lẳn
     nằm trên ảnh là một vật thể lạ, hình chữ nhật bo nhẹ là một lớp phủ. */
  .hieu{position:absolute;top:6px;border-radius:7px;
    padding:2px 6px;border:1px solid rgba(224,189,119,.22)}
  .hieu.cho{right:6px;color:rgba(232,199,137,.9);border-color:rgba(224,189,119,.34)}
  .hieu.alb{left:6px;color:rgba(111,232,168,.9);border-color:rgba(67,224,141,.34)}
  .chip{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:999px;
    padding:6px 13px;font:inherit;font-size:var(--fs-small);cursor:pointer}
  /* E08-D106 · chip tab Kho là <a>, không phải <button>: nó rời tài liệu này. Mặc
     định của trình duyệt cho <a> khác <button> ở ba chỗ (gạch chân, màu link,
     line-height) nên phải nói lại cả ba, không thì ba chip cùng hàng cao thấp
     khác nhau. `aria-current` chứ không `aria-pressed`: link không có trạng thái
     nhấn, nó có trạng thái "đang ở đây". */
  a.chip{text-decoration:none;display:inline-flex;align-items:center;line-height:1.45}
  .chip[aria-pressed=true],.chip[aria-current=page]{background:rgba(224,189,119,.18);
    border-color:var(--gold);color:var(--gold)}
  /* `.tab` = THANH BA TAB của trang, đúng một chỗ trên trang này. Hàng chip lọc bên
     trong mỗi tab mang tên riêng `.hang-loc` (E08-D106). Bản D102 cho cả hai đeo
     chung tên `.tab`: đọc thì thấy ba hàng chip giống nhau, mà chỉ một hàng đổi
     TAB còn hai hàng kia đổi BỘ LỌC trong tab. Đúng bài N1 của Gate 2 D103 — một
     tên mang hai nghĩa thì phép quét DOM (AC-2b) không phân biệt được «tab» với
     «bộ lọc», và người sửa sau cũng vậy. */
  .tab{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
  .hang-loc{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  /* ── E08-D103 · khối theo khách ──────────────────────────────────────────
     Hai trạng thái phải phân biệt được BẰNG MẮT và BẰNG CHỮ (FR-2). Chỉ đổi màu
     là chưa đủ: người mù màu đọc viền vàng thành viền xanh, mà nhầm chiều này
     nghĩa là khách B nhận ảnh khách A. Nên mỗi tấm mang cả viền, cả nhãn chữ. */
  .khoi{border-color:var(--line2)}
  /* E08-D122 · 700 → 600. Tên khách KHÔNG nằm trên ảnh nên nó không phải nhường
     đường như ba nhãn kia, nhưng nó là thứ đậm nhất trong khối và mắt bám vào nó
     trước tấm hình. 600 vẫn là chữ đậm nhất khối — chỉ thôi đua với ảnh. */
  .khoi h3{margin:0;font-size:.95rem;font-weight:600;word-break:break-word}
  /* Con số và nhãn của nó là MỘT khối không tách. Bản đầu để chúng là bốn phần tử
     rời trong một hàng flex-wrap: ở 360px hàng gãy giữa chừng, "6" ở lại dòng trên
     còn "trong album" rơi xuống cạnh "9" — hai con số đổi nhãn cho nhau trước mắt
     người đọc. Không tràn ngang nên phép đo scrollWidth vẫn xanh; chỉ nhìn mới thấy. */
  .khoi-so{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 9px}
  .cap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .anh-o{position:relative;border-radius:11px;overflow:hidden;background:var(--panel2);
    border:2px solid transparent}
  .anh-o img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
  .anh-o.alb{border-color:var(--ok)}
  .anh-o.cho{border-color:var(--gold)}
  /* E08-D118 · thanh đáy: nền mờ họ chung (khai báo cùng `.hieu`/`.pt` ở trên),
     SÁT ba mép ảnh nên `border-radius` của chính nó là 0 — hai góc dưới đã được
     `overflow:hidden` của `.anh-o` cắt theo bo 11px của tấm. Không dựng lại bo
     riêng cho thanh: bo trong bo thì thừa ra một vành ảnh mỏng dưới thanh, nhìn
     như thanh bị lệch.
     Hai trạng thái vẫn phân biệt được KHÔNG CẦN màu (FR-2 · AC-4): chữ đã khác
     nhau («Đã trong album» ≠ «Máy đoán, chờ duyệt») và một vạch viền trên khác
     màu. Người mù màu đọc được cả hai lối còn lại.
     E08-D122 · BỎ hẳn lối phân biệt thứ ba là ĐỘ ĐẬM (alb 700 vs chờ 600). Nó
     vốn là lối yếu nhất trong ba lối — không ai đọc được «đậm hơn» khi không có
     tấm kia nằm cạnh để so — mà lại là lối đắt nhất: chính nó biến thanh đáy
     thành cái biển. Hai lối còn lại đứng một mình vẫn đọc được, nên bỏ được.
     ── VÉ ICON · THANH ĐÁY → HUY HIỆU GÓC ────────────────────────────────────
     Nhãn nay chỉ còn một hình bé. Giữ nguyên thanh CHẠY SUỐT bề ngang tấm để
     đựng đúng một dấu tick thì lại dựng lại cái biển mà D122 vừa gỡ — lần này
     còn tệ hơn, vì cả dải kính mờ ấy nay không chở chữ nghĩa gì. Nên thu về
     huy hiệu góc dưới-trái, soi gương với ô `%` ở góc trên-phải: hai chấm nhỏ
     cùng cỡ ở hai góc chéo đọc ra "chú thích của tấm", còn một dải ngang đọc ra
     "chú thích ĐÈ LÊN tấm".
     Góc dưới-TRÁI chứ không phải dưới-phải: ô tick nằm trên-trái, nên mép trái
     đã là cột dành cho "thao tác/trạng thái của tấm này"; đẩy huy hiệu sang phải
     là bắt mắt đi chéo qua ảnh mỗi lần đối chiếu tick với trạng thái.
     MÀU trở lại làm một lối phân biệt (vàng chờ · xanh album) vì kênh CHỮ đã mất.
     Nó KHÔNG đứng một mình: số nét tick (1 vs 2) và bề rộng huy hiệu mới là lối
     chính, màu chỉ phụ hoạ — người mù màu vẫn đếm được nét. Màu lấy đúng cặp màu
     viền tấm (`--ok`/`--gold`) nên huy hiệu và viền nói cùng một chuyện. */
  .nhan{position:absolute;left:5px;bottom:5px;border-radius:7px;
    padding:3px 5px;display:inline-flex;align-items:center;
    border:1px solid rgba(224,189,119,.22)}
  /* 11px chứ không 9: ở 9px nét tick mảnh 1.03px, và «một» với «hai» chỉ hơn nhau
     mấy pixel bề ngang — người chấm nhìn lướt thumb thì hai thứ ấy như nhau. 11px
     vẫn nhỏ hơn hẳn thanh chữ cũ, mà đếm được nét. */
  .nhan .ic{display:block;height:11px;width:auto}
  .anh-o.cho .nhan{color:rgba(232,199,137,.92);border-color:rgba(224,189,119,.34)}
  .anh-o.alb .nhan{color:rgba(111,232,168,.92);border-color:rgba(67,224,141,.34)}
  /* Ô tick phải to và dễ chạm: đây là cử chỉ bắt buộc trước mọi lượt duyệt, làm
     nó bé là dồn người dùng đi tìm nút tắt — mà nút tắt là thứ vé này cấm. */
  .tick{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:7px;
    background:rgba(7,16,27,.72);border:1px solid var(--line2);display:flex;
    align-items:center;justify-content:center;cursor:pointer}
  .tick input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;margin:0}
  .anh-o.daChon{box-shadow:0 0 0 3px rgba(224,189,119,.5)}
  /* E08-D105 → D118 · góc phải trên tấm chờ duyệt. D105 để BA CHỮ ở đây và đặt
     tên class là `.giong`; D118 đổi nội dung thành SỐ PHẦN TRĂM nên đổi luôn tên
     thành `.pt`. Đổi tên chứ không giữ `.giong` cho một ô chỉ còn con số: đúng bài
     học N1 của Gate 2 D103 — một cái tên nói sai nội dung của nó là cái bẫy đặt
     sẵn cho người sửa sau. Vẫn KHÔNG mượn `.dem` hay `.hieu`.
     `.anh-o` đã là position:relative nên ô neo trong đúng tấm của nó.
     `max-width` giữ lại làm chốt chặn @360 dù `100%` chỉ dài bốn ký tự: 42px là
     chỗ của ô tick góc trái trên, ô % không được bò sang đè nó (AC-6).
     `tabular-nums`: cả cột thumb có số rộng bằng nhau, không nhảy trái phải giữa
     «9%» và «71%». */
  .pt{position:absolute;top:5px;right:5px;max-width:calc(100% - 42px);
    border-radius:7px;padding:2px 5px;
    border:1px solid rgba(224,189,119,.22);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Chỉ dải chắc nhất mới đổi màu. Tô ba màu khác nhau là dựng lại một thang điểm
     bằng màu, mà thang ấy chính là thứ người chấm không nên bị neo vào. */
  .pt.chac{color:rgba(232,199,137,.9);border-color:rgba(224,189,119,.36)}
  .mo-them{display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed var(--line2);border-radius:11px;background:transparent;
    color:var(--gold);font:inherit;font-size:var(--fs-small);cursor:pointer;padding:8px;
    aspect-ratio:4/3}
  .mo-them:hover{background:var(--panel2)}
  .thanhChon{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px;
    padding-top:10px;border-top:1px solid var(--line)}
  .chonHet{display:flex;gap:8px;align-items:center;font-size:var(--fs-small);
    color:var(--muted);cursor:pointer}
  .chonHet input{width:16px;height:16px;accent-color:var(--gold)}
  /* Khung mặt vẽ CHỒNG lên ảnh gốc. Cố ý không cắt-và-lưu ảnh mặt: mỗi tấm mặt
     lưu ra là một bản sao dữ liệu sinh trắc phải nhớ mà xoá (AC-13). Không tạo
     thì không phải xoá. */
  .khung{position:absolute;border:2px solid var(--gold);border-radius:3px;pointer-events:none}
  .khung.chon{border-color:var(--ok);box-shadow:0 0 0 2px rgba(67,224,141,.35)}
  .khung.tron{border-color:rgba(255,255,255,.34);border-style:dashed}
  /* ── E08-D112 · khung mặt là thứ BẤM ĐƯỢC (FR-1) ──────────────────────────
     Chỉ khung mang `data-face` mới nhận cú chạm. Khung đang kéo (`.khung.moi`)
     vẫn là hình vẽ thuần — nó chưa là mặt của ai. Và khi đang ở chế độ khoanh
     mẫu thì cả lớp khung phải trả cú kéo lại cho ảnh: không thì cú kéo bắt đầu
     trên một khuôn mặt bị khung nuốt, người dùng khoanh mãi không ra khung nào,
     tức tính năng ảnh mẫu của D077 chết vì vé này. */
  .khung[data-face]{pointer-events:auto;cursor:pointer}
  .anhto.khoanh .khung[data-face]{pointer-events:none;cursor:inherit}
  /* Mặt đang chọn: viền VÀNG ĐẶC 3px. Phải thắng cả `.chon` (xanh, đã gắn tên)
     lẫn `.tron` (nét đứt, máy không có gợi ý) — hai lớp ấy cùng độ đặc hiệu với
     lớp này, nên thứ quyết định là THỨ TỰ, và phải nói lại cả ba thuộc tính viền
     chứ không riêng màu: chỉ đổi màu thì khung `.tron` được chọn vẫn nét đứt. */
  .khung.pick{border:3px solid var(--gold);box-shadow:0 0 0 2px rgba(7,16,27,.55)}
  /* Dấu ✓ nằm HẲN trên mép khung (`bottom:100%`), không phủ lên mặt. Đặt nó ở góc
     trong khung — hay lấn vào khung vài pixel — thì với khuôn mặt nhỏ nhất trong
     kho (~15px ở 360px) huy hiệu che gần hết chính khuôn mặt người ta đang nhìn để
     nhận ra là ai. `bottom:100%` không phụ thuộc cỡ khung nên nó đúng cho cả mặt
     to lẫn mặt bé, không cần đo trong JS.
     Lệch phải 3px thôi (không 9px): mặt sát mép phải ảnh mà huy hiệu thò ra xa là
     trang tràn ngang ở 360px. Thò lên trên thì an toàn — chỗ ấy là khe giữa hai
     thẻ, không đè lên nội dung nào.
     `+5px` chứ không `+2px`: gốc của `bottom:100%` là HỘP PADDING của khung, tức
     mép TRONG của viền. Viền lúc đang chọn dày 3px, nên 2px hụt đúng 3px và huy
     hiệu vẫn liếm lên viền — 3px viền + 2px khe. */
  .khung .dau{position:absolute;bottom:calc(100% + 5px);right:-3px;background:var(--gold);
    color:#231a06;border-radius:999px;font-size:10px;line-height:1;font-weight:700;
    padding:3px 5px;pointer-events:auto}
  .anhto{position:relative;display:inline-block;max-width:100%}
  .anhto img{max-width:100%;display:block;border-radius:11px}
  .goi{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .goi b{word-break:break-word}
  /* E08-D106 · AC-11 (G6, QC D103 v2 ghi sổ) — hàng «Đã gắn tên trong ảnh này».
     Dấu ✓ thuộc về CÁI TÊN, không phải về hàng. Bản trước để tên, đơn vị và ✓ là
     ba con rời của một hàng `flex-wrap:wrap`: ở 360px một tên dài + đơn vị dài đẩy
     ✓ rơi xuống dòng riêng, nơi nó nằm ngay trên tên của người KẾ TIẾP — người đọc
     thấy một dấu xác nhận không rõ đang xác nhận ai.
     Không dùng `white-space:nowrap` cho cả hàng: tên vẫn PHẢI được ngắt dòng trong
     cột của nó, chỉ có ✓ là không được rời khỏi hàng. Nên: hàng nowrap, cột tên co
     được (`min-width:0` — thiếu nó thì cột flex không co dưới nội dung và hàng
     tràn ngang, hỏng AC-8), ✓ cố định bên phải. */
  .goi.da{flex-wrap:nowrap;align-items:flex-start}
  .goi.da .ten{flex:1 1 auto;min-width:0}
  .goi.da .dem{flex:0 0 auto;margin-left:auto}
  /* Hàng gợi ý màn xem lớn. Ô này KHÔNG nằm trên ảnh nên không vào họ nền mờ — nó
     đứng trên mặt giấy của trang, và ở đó `var(--gold)` là màu đúng cho cả hai
     giao diện. Chỉ con số bên trong là chung với ô `.pt` trên tấm (AC-3). */
  .diem{font-size:var(--fs-small);color:var(--gold);font-variant-numeric:tabular-nums}
  .diem.vua{color:var(--muted)}
  .ta{position:relative}
  .ta-ds{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel2);
    border:1px solid var(--line2);border-radius:10px;max-height:220px;overflow:auto}
  .ta-ds div{padding:8px 11px;cursor:pointer;font-size:.85rem}
  .ta-ds div:hover{background:var(--panel)}
  .an{display:none}
  /* ── E08-D110 · bộ chọn bậc khi tải ──────────────────────────────────────
     Bảng chọn nằm TRONG luồng, không `position:absolute`. Ở 360px một lớp phủ tuyệt
     đối rộng hơn nút mẹ là đúng cách làm trang tràn ngang mà trên máy để bàn không
     ai thấy — mà AC-5 đo `scrollWidth ≤ clientWidth` với bảng ĐANG MỞ.
     Đóng thì `.tai` chỉ là một nút, nằm cùng hàng với các nút khác; mở thì nó chiếm
     trọn một hàng riêng (`.mo`), nên câu giải thích dài không phải chen với ai. */
  .tai{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;min-width:0}
  .tai.mo{flex:1 1 100%}
  #taiXem{display:contents}
  .tai-bang{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:10px;
    border:1px solid var(--line2);border-radius:11px;padding:11px;background:var(--panel2)}
  .tai-muc{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
  .tai-muc input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--gold);flex:0 0 auto}
  /* `min-width:0` cho cột chữ: thiếu nó thì cột flex không co xuống dưới nội dung,
     và câu giải thích ảnh gốc — câu dài nhất trang — đẩy cả hàng tràn ngang. Đúng
     bài AC-8 của D106, chỉ khác chỗ đứng. */
  .tai-muc .noi{min-width:0;font-size:var(--fs-small);overflow-wrap:anywhere}
  .tai-muc .noi b{font-size:.82rem;font-weight:700}
  .tai-muc.tat{cursor:default}
  .tai-muc.tat .noi b{color:var(--muted)}
  /* Ô radio đã tắt được trình duyệt vẽ thành chấm xám ĐẶC — liếc nhanh trên điện
     thoại rất dễ đọc thành «đang chọn», tức đúng kiểu hiểu nhầm mà vé này sinh ra
     để dẹp. Làm mờ hẳn để trạng thái tắt không thể đọc thành trạng thái chọn. */
  .tai-muc.tat input{opacity:.4}
  .tai-day{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* Chế độ khoanh: con trỏ đổi để người dùng biết cú kéo tới sẽ vẽ khung chứ
     không phải cuộn trang — không có dấu hiệu này thì cú kéo đầu tiên luôn hỏng. */
  .anhto.khoanh{cursor:crosshair;touch-action:none}
  .anhto.khoanh img{user-select:none;-webkit-user-drag:none}
  .khung.moi{border-color:var(--ok);border-style:dashed}
  /* ── E08-D126 · bảng điều khiển máy quét ────────────────────────────────────
     Cả khối phải lọt màn 390px mà không cần cuộn (AC-1), nên mọi thứ ở đây cố ý
     mỏng: thanh tiến độ 7px, chữ cỡ nhỏ, một dòng một luồng. Số dùng
     tabular-nums vì chúng đổi 3 giây một lần — chữ số không cùng bề rộng thì cả
     hàng nhảy qua nhảy lại dưới mắt người đang nhìn. */
  .qtien{height:7px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
  .qtien i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .5s ease}
  .qso{display:flex;gap:13px;flex-wrap:wrap;font-size:var(--fs-small);color:var(--muted)}
  .qso b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
  .qluong{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-small)}
  .qluong .qmuc{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .qluong .qmuc b{color:var(--text)}
  /* Đèn trạng thái: MÀU không phải thứ duy nhất mang tin — cạnh nó luôn có chữ
     (đang chạy / tạm dừng / mất liên lạc), vì một cái chấm màu không đọc được
     bằng máy đọc màn hình và không phân biệt được với mắt loạn màu. */
  .qden{width:9px;height:9px;border-radius:999px;background:var(--muted);flex:0 0 auto}
  .qden.chay{background:var(--ok);box-shadow:0 0 0 3px rgba(67,224,141,.16)}
  .qden.tam-dung{background:var(--gold)}
  .qden.loi,.qden.mat-lien-lac{background:var(--bad)}
  .qden.xong{background:var(--ok);opacity:.5}
  .qsl{font-weight:700;min-width:1.2em;font-variant-numeric:tabular-nums}
  .qanh{flex:1 1 120px;min-width:0;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* Viết đủ `.qluong .qmuc.qxau`, không phải `.qxau` trơn: `.qluong .qmuc` là hai
     lớp nên nó ĐẶC HIỆU HƠN một lớp, và màu đỏ sẽ thua màu xám mà không báo gì —
     tỉ lệ lỗi 100% hiện ra y như tỉ lệ lỗi 0%. Đo được ở lab trước khi sửa. */
  .qluong .qmuc.qxau,.qluong .qmuc.qxau b{color:var(--bad)}
  /* Cùng bẫy độ đặc hiệu ở dòng toàn kho: `.qso b` là (0,1,1) nên nó thắng một
     lớp `.qxau` trơn, và con số đậm lại không đỏ trong khi chữ quanh nó thì đỏ. */
  .qso .qxau,.qso .qxau b{color:var(--bad)}
  .qcanh{color:var(--gold);font-size:var(--fs-micro);flex:1 1 100%;margin:2px 0 0}
  .qchon{display:flex;gap:6px;align-items:center;font-size:var(--fs-small);color:var(--muted)}
  .qchon select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);
    border-radius:8px;padding:4px 7px;font:inherit;font-size:var(--fs-small)}
  /* `.an` khai báo TRƯỚC khối này, nên ở cùng độ đặc hiệu một quy tắc display ở
     đây sẽ THẮNG nó — và nút ẩn lại hiện ra. Nhắc lại `.an` cho đúng những lớp
     mới có display riêng, chứ không đụng vào quy tắc chung của cả trang. */
  .qchon.an,.qluong.an{display:none}
  /* ── E08-D127 · bảng thu gọn khi không đứng ở lưới ──────────────────────────
     Bản THU là một dòng, và nó phải mỏng thật: AC-6 đo đáy khối ≤ 220px từ đỉnh
     trang ở 390px, mà phía trên nó còn thanh đầu trang (hay xuống hai hàng ở bề
     ngang ấy) và hàng chip tab. Nên ở thể thu, chính cái thẻ cũng bớt đệm — chữ
     không nhỏ đi, chỉ khoảng trắng quanh nó nhường chỗ. */
  .qthu{display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap;
    background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;
    font-size:var(--fs-small);text-align:left;cursor:pointer}
  .qthu .spacer{flex:1}
  .qthu-tt{font-weight:700}
  .qthu-nut{color:var(--gold);white-space:nowrap}
  .qthu:hover .qthu-nut{text-decoration:underline}
  #theDongBo.thu{padding:9px 11px;margin-bottom:10px}
  #theDongBo.thu #qDu{display:none}
  .qthu.an{display:none}
  /* Tên máy trên dòng luồng (FR-5). Cắt bằng CSS, KHÔNG cắt trong textContent:
     AC-4 đọc đúng chuỗi API trả về, và một cái tên bị cắt bằng JS thì không có
     cách nào phục hồi — `title` giữ bản đầy đủ cho người rê chuột. */
  .qluong .qmay{color:var(--muted);max-width:11em;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* Câu cảnh báo của cả thẻ. Cùng màu vàng với `.qcanh` (câu lỗi của một luồng)
     vì cùng vai — nhưng cỡ chữ của MẶT GIẤY, không phải cỡ nhãn đè lên ảnh: đây
     là câu người ta đọc TRƯỚC khi bấm, không phải chú thích liếc qua. */
  .qbao{color:var(--gold);font-size:var(--fs-small);margin:0}
  .qbao.an{display:none}
</style>
</head>

  <!-- ══ E08-D124 (CR-181) · MỘT NÚT, MÁY ĐOÁN MẶT ══
       Đặt NGOÀI ba màn con, ngay dưới thanh tab: việc này thuộc về cả trang, không

       «đang chạy» phải nhìn thấy ở mọi màn, vì nó nói về máy chứ không về màn.

       Hai dòng chữ, hai nhiệm vụ khác nhau, cố ý không gộp: `#dbTom` là TRẠNG THÁI

  <!-- ══ E08-D126 · …VÀ NHÌN THẤY NÓ ĐANG LÀM GÌ ══
       MỞ RỘNG khối D124 ở trên, không dựng khối thứ hai cạnh nó: hai thẻ nói về

         · nút chung ở cuối — vì nút phải nằm SAU thứ nó tác động lên.

  <!-- ══ E08-D127 · …VÀ KHÔNG CHE MẤT THỨ NGƯỜI TA MỞ TRANG ĐỂ XEM ══
       Bảng D126 tốt ở tab Phân loại, nhưng nó nằm NGOÀI ba màn con nên nó cũng

  <div class="card" id="theDongBo">

      <div class="top" style="margin:0">
        <button class="btn ok" id="nutDongBo" data-i="db_nut">Bắt đầu quét</button>
        <label class="qchon" id="qChonO">

/* E08-D106 · ngôn ngữ và theme là của NGƯỜI, không của trang. Ba tab giờ là MỘT
   trang trước mắt người dùng, nhưng vẫn là hai tài liệu HTML: mỗi tài liệu giữ một
   khoá riêng thì bật 日本語 ở tab Phân loại, sang tab Kho lại thấy tiếng Việt —
   người dùng đọc đó là "nút ngôn ngữ hỏng", không phải "hai trang".
   Đây KHÔNG phải luật mới: Sponsor đã chốt 09/08 «trang trước là ngôn ngữ gì thì
   qua trang khác cũng phải vậy» và /crm + hai cửa đã gom về `esuhai_lang`
   (crm-app-v2.html:699). Trang này với kho-anh là hai chỗ chưa di trú theo.
   Khoá cũ `nd_*` chỉ còn được ĐỌC, cho ai đã chọn trước D106; không ghi vào nữa. */
function nhoCu(chung, cu){ var v = localStorage.getItem(chung); return v == null ? localStorage.getItem(cu) : v; }
var LANG = nhoCu('esuhai_lang', 'nd_lang') === 'jp' ? 'jp' : 'vn';
function tt(k){ return (T[LANG] && T[LANG][k]) || T.vn[k] || k; }
function fmt(k,o){ var s = tt(k); for (var i in o) s = s.split('{'+i+'}').join(o[i]); return s; }
function setLang(l){
  LANG = l; localStorage.setItem('esuhai_lang', l);
  document.documentElement.lang = l === 'jp' ? 'ja' : 'vi';
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = tt(el.getAttribute('data-i')); if (v) el.textContent = v; });
  $('#langBtn').textContent = l === 'jp' ? 'Tiếng Việt' : '日本語';
  $('#timKhach').placeholder = tt('tim_ph');
  $('#ganO').placeholder = tt('gan_ph');
  $('#chuGiai').textContent = tt('chu_giai');
  /* D124 · thẻ đồng bộ nằm NGOÀI ba màn con nên nó không được vẽ lại bởi khối
     bên dưới — mà chữ của nó (giờ giấc, con số, câu lỗi) do JS ghép, tức `data-i`
     không với tới. Vẽ lại trước cả cửa `DA_NAP`: thẻ này có chữ ngay từ lượt hỏi
     đầu tiên, không đợi lưới ảnh. */
  veDongBo(DB_CUOI);
  /* Vẽ lại đúng màn đang mở. Không gọi hết mọi hàm vẽ: màn đang ẩn mà vẫn nạp lại
     là mỗi lần đổi ngôn ngữ lại bắn ba yêu cầu mạng không ai nhìn. */
  if (!DA_NAP) return;
  /* E08-D109 · đổi ngôn ngữ làm HỎNG mọi DOM đang được giữ lại. Bốn dòng dưới chỉ
     vẽ lại màn ĐANG HIỆN; từ vé này, `#dsKhoi` và `#manMotKhach` còn sống cả khi bị
     giấu, nên chữ vẽ bằng ngôn ngữ cũ nằm lại trong đó — bấm 日本語 ở màn một khách
     rồi «Khối theo khách» là thấy cả list tiếng Việt. Cùng đúng lý do `hienMan` xoá
     ruột màn xem (:449): người dùng không thấy chữ cũ, nhưng nó vẫn ở đó và mọi
     phép quét ngôn ngữ đều vấp phải. Đánh dấu cũ = lượt «về» tới sẽ nạp lại đúng
     ngôn ngữ, đổi lấy việc mất chỗ cuộn — đúng thứ tự ưu tiên: đọc được trước, tiện
     sau. Không tự gọi vẽ lại ở đây: màn đang giấu mà nạp lại là bắn yêu cầu mạng
     không ai nhìn, đúng điều chú thích ngay dưới đã cấm. */
  KHOI_CU = true;
  $('#manMotKhach').removeAttribute('data-gid');
  $('#manMotKhach').removeAttribute('data-offset');
  if (!$('#manAnh').classList.contains('an')) veLuoi();
  else if (!$('#manXem').classList.contains('an')) moAnh(ANH_DANG);
  else if (!$('#manKhach').classList.contains('an')) veKhoi();
  else if (!$('#manMotKhach').classList.contains('an')) moMotKhach(KHACH_DANG, KHACH_OFFSET);
}
function apDungTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('crm_theme', t || ''); $('#themeBtn').innerHTML = t ? '☀' : '☽'; }

async function jget(u){ var r = await fetch(u); if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function jpost(u,b,m){ var r = await fetch(u,{ method: m||'POST',
  headers:{'content-type':'application/json'}, body: b?JSON.stringify(b):undefined });
  if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

/* N1 (Gate 2 vòng 1) · ĐÓNG chế độ khoanh — trạng thái DOM lẫn trạng thái JS.
   Vì sao phải gom vào một hàm và gọi ở HAI chỗ: khung đang vẽ nằm bên trong
   `#anhTo`, mà `#anhTo` bị dựng lại nguyên khối mỗi lần moAnh() chạy. Khung biến
   mất khỏi màn hình, nhưng `dataset.box` thì không — và ô typeahead phân nhánh
   dựa trên đúng `dataset.box` ấy. Còn sót nó thì cú chọn tên kế tiếp không GẮN
   TÊN mà lại GHI MỘT ẢNH MẪU, với khung của tấm trước, dưới tên người đang đăng
   nhập. Album không tăng, người dùng tưởng đã gắn, còn khớp khách thì bị đầu độc
   bằng một khuôn mặt không phải của ai cả.
   Rộng hơn phiếu một nhịp: phiếu đòi reset khi RỜI trang xem, nhưng cùng một tấm
   cũng rò — vẽ khung xong bấm "Đúng người này" là `#anhTo` dựng lại ngay. Nên
   trạng thái khoanh đi theo vòng đời của `#anhTo`, không theo vòng đời màn hình. */
function dongKhoanh(){
  KHUNG_MOI = null;
  var the = $('#theAnh'), anh = $('#anhTo');
  delete the.dataset.box;
  anh.classList.remove('khoanh');
  var k = anh.querySelector('.khung.moi'); if (k) k.remove();
  $('#nutKhoanh').textContent = tt('khoanh');
  var hg = the.querySelector('.khoanhHuong');
  hg.classList.add('an'); hg.textContent = '';
}

function hienMan(id){
  ['manAnh','manXem','manKhach','manMotKhach'].forEach(function(m){
    document.getElementById(m).classList.toggle('an', m !== id); });
  /* E08-D110 · đổi màn thì đóng bảng chọn bậc. Một bảng đang mở thuộc về phạm vi
     người dùng vừa rời — để nó mở là để một cú bấm nhắm vào chỗ khác. */
  TAI_MO = '';
  /* Rời trang xem thì XOÁ nội dung của nó, không chỉ giấu đi. Hai lý do:
     ảnh preview cỡ lớn thôi nằm trong bộ nhớ; và chữ đã vẽ bằng ngôn ngữ cũ thôi
     nằm lại trong DOM — người dùng không thấy, nhưng mọi phép quét chuỗi (AC-7)
     đều vấp phải nó và không có cách nào phân biệt với lỗi dịch thật. */
  if (id !== 'manXem'){
    $('#anhTo').innerHTML = ''; $('#dsGoi').innerHTML = '';
    $('#xemTom').textContent = ''; $('#ganO').value = '';
    $('#baoXem').textContent = '';
    $('#taiXem').innerHTML = '';
    dongKhoanh();
    /* E08-D112 · tập mặt đang chọn cũng phải chết cùng màn hình, đúng một lý do
       với hai dòng trên: `face_id` của tấm vừa rời không có nghĩa ở tấm sắp mở,
       mà nếu nó sống sót thì lượt vẽ sau lại lọc danh sách theo một khuôn mặt
       không còn trên màn — cùng bài học với `dataset.box` của D077. */
    PICK = []; XEM = { goi: [], alb: [] };
  }
  /* Trang xem một ảnh không phải một tab — nó là màn con của tab mà người dùng ĐI
     TỪ ĐÓ vào. D103 gán cứng nó cho tab Phân loại; từ D106 URL cũng nói tab đang
     mở, nên gán cứng như thế là chip và thanh địa chỉ nói hai điều khác nhau khi
     người ta mở một tấm từ tab Theo khách. `TU_DAU` đã ghi sẵn lối vào ấy (nó
     được đặt TRƯỚC hienMan trong moAnh) — đọc nó, đừng đoán. */
  var xemTuLuoi = (id === 'manXem') && TU_DAU === 'luoi';
  $('#tabAnh').setAttribute('aria-pressed', String(id === 'manAnh' || xemTuLuoi));
  $('#tabKhach').setAttribute('aria-pressed',
    String(id === 'manKhach' || id === 'manMotKhach' || (id === 'manXem' && !xemTuLuoi)));
  /* D127 · FR-7 — bảng máy quét đổi hình dáng theo màn. Đặt ở ĐÂY chứ không rải
     vào từng hàm mở màn: `hienMan` là cửa duy nhất mọi lối đổi màn phải đi qua,
     nên không có lối nào quên gọi. */
  apDungThu();
}

/* ══════════ E08-D106 · FR-5 — URL nói đúng tab đang mở ══════════
   Chỉ TAB vào lịch sử, không phải từng màn con. Mở một tấm ảnh hay một khách là đi
   sâu TRONG một tab; nếu đẩy cả màn con vào lịch sử thì nút Back của điện thoại

var URL_TAB = { anh: '/crm/anh-su-kien', khach: '/crm/anh-su-kien/theo-khach' };
function tabTuUrl(){ return location.pathname.indexOf('/theo-khach') > -1 ? 'khach' : 'anh'; }
function moTab(tab, day){

  else { TU_DAU = 'luoi'; hienMan('manAnh'); veLuoi(); }

/* ══════════ LƯỚI ẢNH (FR-H1) ══════════ */
var LOC = 'tat-ca', ANH = [], TONG = 0, ANH_DANG = null;
/* Nhớ lối vào để nút quay lại trả người dùng về đúng chỗ họ vừa rời: mở ảnh từ
   album của một khách rồi bị đẩy ra lưới 3 479 tấm là mất chỗ đang soát. */
var TU_DAU = 'luoi';
/* ══ E08-D109 · «về đúng chỗ vừa rời» cần ba mẩu, không chỉ một cái nhãn nút ══
   Nhãn nút đã đúng từ D103, nhưng cú bấm thì gọi `veKhoi()` — hỏi lại máy chủ và
   thay sạch `#dsKhoi`. Người dùng mất HAI thứ trong một cú: chỗ đang cuộn (về 0)
   và mọi ô đã tick (checkbox mới dựng thì không có cái nào `checked`). Người đang
   soát khối thứ chín, tick sáu tấm, mở một tấm ra xem cho chắc — quay về là mất
   cả sáu cú tick lẫn chỗ đứng. `hienMan` vốn chỉ GIẤU `#manKhach` chứ không xoá,
   nên DOM cũ còn nguyên: thứ phá nó là chính lời gọi vẽ lại, không phải việc đổi
   màn. Nhớ chỗ cuộn + khối vừa mở, rồi hiện lại đúng DOM ấy.
   `KHOI_CU` là lối thoát trung thực cho trường hợp KHÔNG vá được bằng một ô: gắn
   tên tay trên màn xem tạo một dòng album cho khách có thể đang nằm trong list —
   không có `data-cid` nào trên màn khối để sửa. Đánh dấu cũ rồi nạp lại lúc về
   còn hơn hiện một con số biết chắc là sai. */
var SCROLL_KHOI = 0, SCROLL_KHACH = 0, GID_TU_TAM = null, KHOI_CU = false;
/* Chưa nạp lần nào thì setLang không được vẽ lại — nếu không, mỗi lần khởi động
   trang bắn hai lượt yêu cầu y hệt nhau, một từ setLang một từ dòng gọi cuối file. */
var DA_NAP = false;

/* `giuTrang` · D127 (vòng rà 2) — chỉ dùng cho lượt vẽ lại TỰ ĐỘNG của FR-8.
   Không có nó thì tính năng «lưới theo kịp máy» tự tay phá đúng người nó phục vụ:
   ai đã bấm «Xem thêm ảnh» ba lần đang đứng ở tấm thứ 150, và một lượt vẽ lại
   `limit=60` cắt lưới về 60 ô — trang co lại, chỗ cuộn rơi xuống cuối, và họ mất
   chỗ đang soát. Xin lại ĐÚNG số ô đang có thì chiều cao trang không đổi, nên
   trình duyệt giữ nguyên chỗ cuộn mà không cần ai nhớ nó.
   Lượt vẽ do NGƯỜI gây ra (đổi tab, đổi bộ lọc) vẫn về 60 như cũ: ở đó người dùng
   đang bắt đầu một lượt xem mới, không phải đang giữ chỗ. */
async function veLuoi(noiTiep, giuTrang){
  var offset = noiTiep ? ANH.length : 0;
  var soCan = (!noiTiep && giuTrang) ? Math.max(60, ANH.length) : 60;
  var j = await jget('/crm/face-match/photos?filter=' + encodeURIComponent(LOC)
    + '&limit=' + soCan + '&offset=' + offset);
  ANH = noiTiep ? ANH.concat(j.items || []) : (j.items || []);
  TONG = j.tong || 0;
  $('#anhTom').textContent = ANH.length ? fmt('anh_tom', { n: TONG, c: ANH.length }) : tt('anh_rong');
  $('#luoiAnh').innerHTML = ANH.map(function(a){
    return '<button class="o" data-anh="' + a.id + '">'
      + '<img loading="lazy" src="' + a.thumb_url + '" alt="' + esc(tt('anh_alt')) + '">'
      + (a.so_cho ? '<span class="hieu cho">' + a.so_cho + '</span>' : '')
      + (a.so_album ? '<span class="hieu alb">✓</span>' : '')
      + '</button>';
  }).join('');
  var het = ANH.length >= TONG;
  $('#taiThem').disabled = het;
  $('#taiThem').textContent = het ? tt('het_anh') : tt('tai_them');
  DA_NAP = true;
  /* D127 · FR-8 — lưới vừa vẽ xong thì mốc đặt lại tại đây, dù cú vẽ đến từ đâu
     (đổi tab, đổi bộ lọc, «xem thêm ảnh», hay chính nhịp +20). Mốc là «lưới trên
     màn đang nói con số nào», nên nó phải đi theo lượt VẼ chứ không theo lượt hỏi
     trạng thái. Đọc từ `DB_CUOI` vì đó là ảnh chụp mới nhất của máy chủ. */
  GY_MOC = (DB_CUOI && DB_CUOI.goi_y_cho != null) ? DB_CUOI.goi_y_cho : 0;
}

/* ══════════ XEM MỘT ẢNH (FR-H2 / H3 / H6) ══════════ */
/* E08-D118 · mức tự tin của máy hiện bằng PHẦN TRĂM. D105 khoá nó thành ba chữ
   («rất / khá / hơi giống») dựng từ hai mốc 0,55 và 0,50; anh mở lại khoá ấy —
   con số nhỏ ở góc nói được "chắc cỡ nào" mà không chiếm chỗ bằng ba chữ.
   Làm tròn về số nguyên, không hiện 0.512: một chữ số thập phân là mời người ta so
   hai gợi ý hơn kém nhau 0,3% — thứ mà chính máy cũng không phân biệt nổi.
   Hàm này chỉ ĐỌC RA. Ngưỡng nhận 0,45 của máy và việc người chấm đúng/sai không
   dính gì tới đây (Luật 5).
   MỘT hàm cho cả ô góc tấm lẫn hàng gợi ý màn xem lớn (AC-3): hai bản sao của cùng
   một phép làm tròn là hai thứ sẽ lệch nhau vào lúc không ai để ý.
   Không đi qua `tt()`: chữ số Ả Rập và dấu `%` đọc y hệt nhau ở vi lẫn jp, nên
   không có gì để dịch — và không có gì để quên dịch (AC-5). */
function phanTram(s){
  if (s == null) return '';
  return Math.round(s * 100) + '%';
}
function tenKh(x){ return (LANG==='jp' && x.name_jp ? x.name_jp : x.full_name) || ''; }

async function moAnh(id, tuDau){
  if (!id) return;
  /* E08-D112 · sang tấm KHÁC thì tập mặt đang chọn phải chết theo: một `face_id`
     của tấm này không có nghĩa gì ở tấm kia. Còn vẽ lại CHÍNH tấm đang mở — sau
     mỗi cú duyệt gợi ý, hay khi đổi ngôn ngữ — thì giữ nguyên tập ấy: mất chỗ
     đang chọn sau mỗi lượt chốt là bắt người ta bấm lại mặt từ đầu, mà đúng cái
     lặp đó là thứ vé này sinh ra để cắt. */
  var doiTam = String(ANH_DANG == null ? '' : ANH_DANG) !== String(id);
  ANH_DANG = id;
  /* Ghi chỗ cuộn TRƯỚC khi đổi màn, và chỉ khi đây là một lượt MỞ thật (có
     `tuDau`). `moAnh(ANH_DANG)` không tham số còn được gọi để vẽ lại chính tấm
     đang mở — lúc ấy `scrollY` là của màn xem, ghi đè vào đây là ghi nhầm chỗ
     đứng của màn kia. */
  if (tuDau === 'khoi') SCROLL_KHOI = window.scrollY;
  else if (tuDau === 'khach') SCROLL_KHACH = window.scrollY;
  if (doiTam) PICK = [];
  if (tuDau) TU_DAU = tuDau;
  hienMan('manXem');
  /* Đổi ảnh (hoặc vẽ lại chính tấm này) = `#anhTo` bị dựng lại → khung đang vẽ
     mất theo. Trạng thái khoanh phải chết cùng nó, xem dongKhoanh(). */
  dongKhoanh();
  $('#baoXem').textContent = '';
  $('#veLuoi').querySelector('span').textContent = tt(
    TU_DAU === 'khach' ? 've_khach_lai' : (TU_DAU === 'khoi' ? 've_khoi_lai' : 've_luoi'));
  var j = await jget('/crm/face-match/photo/' + id + '/faces');
  var mat = j.items || [], goi = j.goi_y || [], alb = j.album || [];
  /* Kích thước lấy từ chính phản hồi, không nhặt lại từ mảng lưới: mở ảnh từ album
     thì mảng đó không có tấm này. */
  var W = Number(j.anh && j.anh.width) || 0, H = Number(j.anh && j.anh.height) || 0;
  $('#xemTom').textContent = fmt('xem_tom', { m: mat.length, g: goi.length, a: alb.length });
  /* E08-D110 · trường này CHƯA tồn tại trong phản hồi (D111 mới thêm cột). Đọc nó ở
     đây thay vì đặt cứng `false` là để ngày ấy tới, mục «Ảnh gốc» sáng lên mà không
     cần ai nhớ ra còn một chỗ nữa phải sửa. */
  XEM_GOC = !!(j.anh && j.anh.drive_file_id);
  veTaiXem();

  /* Khung vẽ theo TỈ LỆ so với ảnh gốc, không theo pixel: ảnh hiển thị đã co lại,
     mà toạ độ trong CSDL là của ảnh gốc. */
  function oKhung(f, lop){
    if (!f.box_w || !W || !H) return '';
    /* `data-face` là thứ duy nhất nối khung trên ảnh với dòng gợi ý bên dưới —
       trước D112 khung không mang id nào, nên không có cách nào hỏi "gợi ý này
       của mặt nào". */
    return '<i class="khung ' + lop + '" data-face="' + Number(f.id)
      + '" style="left:' + (f.box_x/W*100).toFixed(2) + '%;top:'
      + (f.box_y/H*100).toFixed(2) + '%;width:' + (f.box_w/W*100).toFixed(2) + '%;height:'
      + (f.box_h/H*100).toFixed(2) + '%"></i>';
  }
  var coGoi = {}; goi.forEach(function(c){ if (c.face_id) coGoi[c.face_id] = 1; });
  var daXn = {}; alb.forEach(function(c){ if (c.face_id) daXn[c.face_id] = 1; });
  var khung = mat.map(function(f){
    return oKhung(f, daXn[f.id] ? 'chon' : (coGoi[f.id] ? '' : 'tron')); }).join('');

  $('#anhTo').innerHTML = '<img src="/crm/event-photos/' + id + '/preview" alt="'
    + esc(tt('anh_alt')) + '">' + khung;
  $('#theAnh').setAttribute('data-anh', id);
  $('#theAnh').setAttribute('data-w', W);
  $('#theAnh').setAttribute('data-h', H);

  /* Mặt có thể biến mất giữa hai lượt vẽ (kho chạy lại nhận diện). Lọc PICK theo
     đúng những khung VỪA vẽ: giữ một face_id không còn khung nào là lọc danh sách
     gợi ý xuống rỗng trong khi trên ảnh không còn gì đang sáng để bấm bỏ — người
     dùng bị nhốt trong một bộ lọc vô hình. */
  var coMat = {}; mat.forEach(function(f){ coMat[String(f.id)] = 1; });
  PICK = PICK.filter(function(x){ return coMat[x]; });
  XEM = { goi: goi, alb: alb };
  apDungPick(false);
}

/* ══════════ E08-D112 · chọn khuôn mặt trên ảnh lớn (FR-1…FR-5) ══════════

   LUẬT CHỌN — một luật, viết ra đây để người sau và người chấm đọc cùng một chỗ:
     · bấm trong một khung          = cộng mặt đó vào tập đang chọn
     · bấm lại đúng khung đang chọn = bỏ mặt đó ra
     · bấm nền ảnh, ngoài mọi khung = bỏ hết
   KHÔNG dùng phím phụ (Ctrl/Cmd) để chọn nhiều. Trang này chạy trên điện thoại ở
   cửa sự kiện, nơi không ai có bàn phím — một luật cần phím phụ là luật mà phân
   nửa người dùng không thực hiện được, và họ sẽ không biết vì sao mình không làm
   được. Cộng-dồn-bằng-cú-bấm chạy giống nhau trên cả chuột lẫn ngón tay.

   Tập chọn giữ trong biến, KHÔNG đọc lại từ URL hay localStorage: nó là chỗ đứng
   trong một lượt soát, không phải một tuỳ chọn của người dùng. */
var PICK = [], XEM = { goi: [], alb: [] };

/* FR-5 · hit-slop. Khung vẽ đúng bằng khuôn mặt máy tìm thấy, mà trong ảnh đám
   đông ở 360px khuôn mặt chỉ còn ~20px — nhỏ hơn đầu ngón tay. Nới VÙNG CHẠM cho
   đủ 44px; không nới khung vẽ, vì khung vẽ đang nói "máy thấy mặt ở đúng đây".
   Làm bằng JS chứ không bằng một pseudo-element phủ rộng: vùng nới của mặt này
   chồng lên khung THẬT của mặt bên cạnh, mà trong CSS cái vẽ sau luôn thắng — nới
   bằng CSS là cướp mất cú bấm chính xác của hàng xóm. Ở đây cú bấm trúng khung
   thật đã được xử trước khi gọi hàm này; xuống tới đây chỉ còn những cú bấm trượt
   ra nền, và ta trả về khung có tâm gần nhất. */
function matGanDiem(el, ev){
  var x = ev.clientX, y = ev.clientY, gan = null, xa = Infinity;
  /* Cú `.click()` tổng hợp không có toạ độ (0,0). Không có toạ độ thì không có cú
     bấm trượt để cứu — đừng đo từ góc màn hình, vì góc ấy có thể lọt vào vùng nới
     của một khuôn mặt trên cùng và biến "bấm nền" thành "chọn mặt". */
  if (!x && !y) return null;
  el.querySelectorAll('.khung[data-face]').forEach(function(k){
    var r = k.getBoundingClientRect();
    var nx = Math.max(0, (44 - r.width) / 2), ny = Math.max(0, (44 - r.height) / 2);
    if (x < r.left - nx || x > r.right + nx || y < r.top - ny || y > r.bottom + ny) return;
    var d = Math.abs(x - (r.left + r.right) / 2) + Math.abs(y - (r.top + r.bottom) / 2);
    if (d < xa){ xa = d; gan = k; }
  });
  return gan;
}

function doiPick(fid){
  var i = PICK.indexOf(fid);
  if (i > -1) PICK.splice(i, 1); else PICK.push(fid);
  apDungPick(true);
}
function boPick(){ if (!PICK.length) return; PICK = []; apDungPick(false); }

/* Một đường duy nhất để trạng thái chọn hiện ra: viền + dấu ✓ trên ảnh, và danh
   sách bên dưới. Hai nơi ấy phải đổi CÙNG một nhịp — lệch nhau là người dùng thấy
   một mặt đang sáng mà danh sách nói chuyện của mặt khác. */
function apDungPick(cuon){
  document.querySelectorAll('#anhTo .khung[data-face]').forEach(function(k){
    var co = PICK.indexOf(k.getAttribute('data-face')) > -1;
    k.classList.toggle('pick', co);
    var d = k.querySelector('.dau');
    if (co && !d){
      d = document.createElement('b'); d.className = 'dau'; d.textContent = '✓';
      /* Nhãn cho trình đọc màn hình đi qua tt(): dấu ✓ không mang chữ nào, nhưng
         cái nhãn thì có — để nguyên tiếng Việt là bỏ quên nó ở bản 日本語. */
      d.setAttribute('aria-label', tt('dau_chon'));
      k.appendChild(d);
    } else if (!co && d) d.remove();
  });
  veDsGoi();
  /* FR-3 · cuộn tới danh sách sau khi CHỌN. Không cuộn khi bỏ chọn hay khi vẽ lại
     ảnh: lúc ấy người dùng đang nhìn ảnh, giật trang xuống là cướp chỗ họ đang nhìn. */
  if (cuon && PICK.length) $('#dsGoi').scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* FR-3 · danh sách dưới ảnh. 0 mặt đang chọn = cả tấm, đúng như trước D112.
   Có mặt đang chọn = CHỈ những dòng thuộc các mặt ấy. Dòng gắn tay không có
   `face_id` (API cho phép NULL) nên khi đang lọc nó không thuộc mặt nào — đúng,
   vì nó gắn vào TẤM ẢNH chứ không vào một khuôn mặt. */
function veDsGoi(){
  var loc = PICK.length;
  function cuaPick(c){
    return !loc || PICK.indexOf(String(c.face_id == null ? '' : c.face_id)) > -1; }
  function dfa(c){ return c.face_id ? ' data-face="' + Number(c.face_id) + '"' : ''; }
  var alb = XEM.alb.filter(cuaPick), goi = XEM.goi.filter(cuaPick);
  var html = '';
  /* Danh sách ngắn lại mà không nói vì sao thì người dùng đọc đó là "gợi ý biến
     mất", không phải "đang lọc" — và cách thoát cũng phải nằm ngay trong câu ấy. */
  if (loc) html += '<p class="hint" id="chuPick" style="margin:11px 0 0">'
    + esc(loc === 1 ? tt('pick_1') : fmt('pick_n', { n: loc })) + '</p>';
  if (alb.length){
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('da_gan')) + '</p>';
    /* AC-11 (D106) · tên + đơn vị nằm trong MỘT cột co được, ✓ là con thứ hai của
       hàng. Bản trước dùng `<div class="spacer">` đẩy ✓ sang phải — spacer là phần
       tử thứ ba, và ở 360px chính nó là chỗ hàng gãy. */
    html += alb.map(function(c){
      return '<div class="goi da"' + dfa(c) + '><span class="ten"><b>' + esc(tenKh(c)) + '</b>'
        + (c.org ? ' <span class="hint">' + esc(c.org) + '</span>' : '')
        + '</span><span class="dem co">✓</span></div>'; }).join('');
  }
  if (goi.length){
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('may_goi')) + '</p>';
    html += goi.map(function(c){
      var m = c.score != null && c.score >= 0.55;
      return '<div class="goi" data-cid="' + c.id + '"' + dfa(c) + '>'
        + '<b>' + esc(tenKh(c)) + '</b>'
        + (c.org ? ' <span class="hint">' + esc(c.org) + '</span>' : '')
        + '<span class="diem' + (m ? '' : ' vua') + '">' + esc(phanTram(c.score)) + '</span>'
        + '<div class="spacer"></div>'
        + '<button class="btn sm ok" data-do="confirm">' + esc(tt('xac_nhan')) + '</button>'
        + '<button class="btn sm bad" data-do="reject">' + esc(tt('tu_choi')) + '</button>'
        + '<button class="btn sm" data-do="skip">' + esc(tt('bo_qua')) + '</button></div>';
    }).join('');
  } else if (!loc){
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('chua_goi')) + '</p>';
  } else if (!alb.length){
    /* Mặt đang chọn không có gợi ý NÀO và cũng chưa mang tên: lối đi tiếp là ô gắn
       tay ngay bên dưới, nên chỉ tới đó. Mặt đã có tên thì dòng tên ở trên đã trả
       lời rồi, không cần thêm câu nào. */
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('pick_trong')) + '</p>';
  }
  $('#dsGoi').innerHTML = html;
}

/* Sau mỗi cú bấm: vẽ lại chính tấm đang mở. Con số trên ô lưới không phải sửa tay
   ở đây — nút quay lại luôn gọi veLuoi(), tức hỏi lại máy chủ, nên dấu trên lưới
   không thể lệch với thứ vừa quyết. */
async function lamMoiAnhDang(){ await moAnh(ANH_DANG); }

/* ══════════ TAB THEO KHÁCH = KHỐI ẢNH (E08-D103) ══════════ */
var LOC_KHOI = 'co-goi-y', KHOI = [], KHOI_TONG = 0, KHACH_DANG = null;
/* Màn một khách: cỡ trang do MÁY CHỦ cắt, không phải trình duyệt. «Đang hiện» của
   ràng buộc precision được khoá ở Gate 1 nghĩa là ĐÚNG trang này — nếu ta tự cắt
   từ một mảng lớn hơn đã tải sẵn thì «chọn tất cả trên trang» lại phủ cả thứ người
   dùng chưa từng nhìn, tức đúng thứ vé này sinh ra để cấm. */
var TRANG_KHACH = 24, KHACH_OFFSET = 0, KHACH_DL = null;

/* Trạng thái tick đọc THẲNG từ DOM của phạm vi đang xét, không giữ trong một tập
   riêng. Cố ý: một tập nhớ ngoài DOM sẽ sống sót qua lượt vẽ lại và qua chuyển
   trang, tức đúng cái cửa hậu cho phép duyệt tấm không còn trên màn. Đọc từ DOM
   thì «đang tick» không thể rộng hơn «đang hiện».
   Chỉ dòng `cho` có ô tick — ảnh đã vào album coi như đã quyết xong; «gỡ khỏi
   album» là việc khác, không thuộc vé này. */
function demTick(pham){
  var n = 0;
  document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked').forEach(function(){ n++; });
  return n;
}
function idsTick(pham){
  var ra = [];
  document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked').forEach(function(o){
    ra.push(Number(o.closest('.anh-o').getAttribute('data-cid'))); });
  return ra;
}

/* ══════════ E08-D110 · TẢI VỀ — hai bậc, MỘT bộ chọn ══════════
   Bộ chọn này phục vụ hai chỗ (trang xem một ảnh, và khối / màn một khách) nhưng
   chỉ có MỘT bản dựng. Hai bản sao của cùng bộ chọn là hai chỗ sẽ lệch nhau vào
   lúc không ai để ý — đúng bài N1 mà Gate 2 D103 đã bắt một lần rồi.

   `TAI_MO` giữ khoá của bảng ĐANG mở; đúng một bảng mở tại một thời điểm. Hai bảng
   mở cùng lúc là hai bậc đang chọn khác nhau trên cùng màn hình, và cú bấm kế tiếp
   không nói được nó theo bảng nào. */
var TAI_MO = '', TAI_BAC = 'mobile', XEM_GOC = false;

/* Ảnh gốc = file máy ảnh, và nó nằm trên Google Drive chứ không trong kho: chốt
   D082 nói kho chỉ giữ ba bản 2048/1024/256, còn lượt nạp D091 không lưu mã file
   Drive. Nên hôm nay KHÔNG tấm nào bật được mục này.
   Đọc `drive_file_id` chứ không đặt cứng `disabled`: ngày D111 thêm cột ấy, mục tự
   sáng mà không ai phải nhớ quay lại sửa chỗ này. Trả bản 2048 rồi gọi là «gốc» là
   điều vé này cấm thẳng — 2048 là bản CHÍNH của kho, không phải ảnh gốc. */
function gocDuoc(pham){
  var o = document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked');
  if (!o.length) return false;
  var het = true;
  o.forEach(function(i){ if (!i.closest('.anh-o').hasAttribute('data-goc')) het = false; });
  return het;
}

/* Danh sách ẢNH sẽ tải trong một phạm vi. Khác `idsTick` ở chỗ nó lấy `data-anh`
   (tấm ảnh) chứ không `data-cid` (gợi ý đang chờ duyệt) — tải là việc với tấm ảnh.
   Lọc trùng: người dùng đếm số TICK, nhưng thứ họ nhận là số FILE; hai con số phải
   bằng nhau, nên nhãn nút in độ dài của chính danh sách này. */
function idsAnh(pham){
  var ra = [], thay = {};
  document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked').forEach(function(o){
    var id = o.closest('.anh-o').getAttribute('data-anh');
    if (id && !thay[id]){ thay[id] = 1; ra.push(id); }
  });
  return ra;
}

function mucTai(nhom, bac, ten, chu, bat, chon){
  return '<label class="tai-muc' + (bat ? '' : ' tat') + '">'
    + '<input type="radio" name="' + nhom + '" value="' + bac + '"'
    + (chon ? ' checked' : '') + (bat ? '' : ' disabled') + '>'
    + '<span class="noi"><b>' + esc(ten) + '</b>'
    + (chu ? '<br><span class="hint">' + esc(chu) + '</span>' : '') + '</span></label>';
}

/* `khoa` vừa là danh tính của bảng vừa là bộ chọn CSS của phạm vi (trừ 'xem').
   Tên nhóm radio suy từ nó nên hai khối trên cùng màn không cướp lựa chọn của nhau. */
function veBangTai(khoa, ids, coGoc){
  var n = ids.length;
  var mo = TAI_MO === khoa && n > 0;
  var bac = (TAI_BAC === 'goc' && coGoc) ? 'goc' : 'mobile';
  /* Nút MỞ bộ chọn tải nay chỉ còn mũi tên xuống. `aria-label`/`title` giữ nguyên
     câu «Tải về» vi/jp — nút không chữ mà không có nhãn phụ trợ là một nút câm
     với người đọc màn hình.
     `.btn.ic-nut` để nó thành ô vuông: `.btn.sm` có `padding:5px 10px` tính cho
     chữ, bỏ chữ đi mà giữ nguyên đệm thì ra một nút dẹt lệch. Ô vuông ~30px cũng
     là để còn CHẠM được — dưới 28px là mất ngưỡng ngón tay, mà nút này đứng ngay
     cạnh ba nút duyệt nên bấm nhầm là quyết nhầm.
     Nút CHẠY tải bên trong bộ chọn thì GIỮ chữ «Tải {n} tấm»: nó chở một CON SỐ
     người dùng vừa tick, mà mũi tên thì không nói được "3 tấm". */
  var cauTai = tt('tai_ve');
  var h = '<div class="tai' + (mo ? ' mo' : '') + '">'
    + '<button class="btn sm ic-nut" data-tai-mo="' + esc(khoa) + '" aria-expanded="' + mo + '"'
    + ' aria-label="' + esc(cauTai) + '" title="' + esc(cauTai) + '"'
    + (n ? '' : ' disabled') + '>'
    + '<svg class="ic" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor"'
    + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M7 2.2v7.6"/><path d="M3.4 6.4L7 10l3.6-3.6"/><path d="M2.4 12.2h9.2"/>'
    + '</svg></button>';
  if (mo){
    var nhom = 'bac_' + khoa.replace(/[^A-Za-z0-9]/g, '_');
    h += '<div class="tai-bang">'
      + mucTai(nhom, 'mobile', tt('bac_mobile'), tt('bac_mobile_chu'), true, bac === 'mobile')
      /* Mục tắt vẫn PHẢI đọc được, và câu bên dưới nó phải nói lý do thật. Một mục
         mờ đi không kèm lý do thì người dùng đọc ra "hỏng", rồi bấm lại năm lần. */
      + mucTai(nhom, 'goc', tt('bac_goc'), coGoc ? '' : tt('goc_chua'), coGoc, bac === 'goc')
      + '<div class="tai-day">'
      +   '<button class="btn sm ok" data-tai-chay="' + esc(khoa) + '">'
      +     esc(fmt('tai_chay', { n: n })) + '</button>'
      +   '<span class="hint" data-tai-bao></span>'
      + '</div></div>';
  }
  return h + '</div>';
}

function veTaiXem(){
  var co = $('#manXem').classList.contains('an') ? false : !!ANH_DANG;
  $('#taiXem').innerHTML = co ? veBangTai('xem', [String(ANH_DANG)], XEM_GOC) : '';
}
function veLaiTai(){

  document.querySelectorAll('.khoi').forEach(capNhatThanh);
  capNhatThanh($('#manMotKhach'));
}

/* Tải TỪNG tấm, không gói ZIP (CR-156): gói trên máy chủ là thêm một tiến trình
   phải canh bộ nhớ và thời gian chạy; gói trên trình duyệt là kéo hết bytes vào RAM
   điện thoại. Người phụ trách cần vài tấm gửi Zalo, không cần một cái kho.
   Cách nhau 400ms: một chuỗi lượt tải liền nhau bị trình duyệt coi là cửa sổ bật lên
   và chặn từ tấm thứ hai — chặn IM LẶNG, người dùng chỉ thấy thiếu file chứ không
   thấy lời từ chối nào. */
async function chayTai(ids, bac, oBao){
  if (bac !== 'mobile'){ if (oBao) oBao.textContent = tt('goc_chua'); return; }
  if (!ids.length) return;
  if (oBao) oBao.textContent = fmt('tai_dang', { n: ids.length });
  for (var i = 0; i < ids.length; i++){
    var a = document.createElement('a');
    a.href = '/crm/event-photos/' + ids[i] + '/preview?dl=1';
    /* Thuộc tính `download` là lớp thứ hai: máy chủ đã gửi `Content-Disposition`
       (tên chính xác hơn — nó biết tấm này có bản 1024 thật hay không), nhưng nếu
       một proxy nào đó cắt mất header thì trình duyệt vẫn lưu file chứ không mở ảnh
       ra tab. Tên dự phòng ở đây cố ý KHÔNG ghi «-mobile»: phía này không đủ cơ sở
       để khẳng định bậc, chỉ máy chủ mới biết. */
    a.download = 'photo-' + ids[i] + '.jpg';
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    if (i < ids.length - 1) await new Promise(function(ok){ setTimeout(ok, 400); });
  }
  if (oBao) oBao.textContent = fmt('tai_xong', { n: ids.length });
}

/* ── Nhãn trạng thái trên tấm: MỘT DẤU TICK vs HAI DẤU TICK ──────────────────
   Chờ duyệt = một tick (máy đã đoán, còn chờ người). Đã trong album = hai tick
   (người đã duyệt). Cùng một hình vẽ nhân đôi, nên nghĩa "thêm một bước nữa"
   đọc được mà không cần chú giải.

   SVG chứ không phải ký tự ✓✓: hai ký tự ✓ cạnh nhau thì khoảng cách giữa chúng
   do FONT quyết định, mà font ở đây là chuỗi fallback năm bậc — trên máy không
   có Be Vietnam Pro, hai dấu tick dính hoặc rời tuỳ máy, và ở 10px thì "dính"
   với "một dấu" nhìn như nhau. SVG thì toạ độ là của ta.
   `stroke-width` 1.6 chứ không tô đặc: nét mảnh mới cùng họ với chữ 450 của
   D122 — vẽ đặc là mang lại đúng cái sức nặng vé ấy vừa gỡ đi.

   CẢNH BÁO cho người sửa sau: từ vé này nhãn KHÔNG còn kênh CHỮ. FR-2 dựng lên
   ba lối phân biệt (chữ · viền · độ đậm) vì nhầm chiều nghĩa là khách B nhận
   ảnh khách A; D122 bỏ độ đậm, vé này bỏ chữ, nên chỉ còn HÌNH + VIỀN. Bù lại
   bằng `aria-label` mang đúng câu vi/jp cũ — đó là lý do hai khoá `nhan_cho`
   `nhan_alb` vẫn phải sống trong cả hai bảng dịch, đừng dọn. Người đọc màn hình
   và người rê chuột vẫn nghe/thấy nguyên câu; chỉ mắt nhìn nhanh là mất chữ. */
function veIconNhan(la){
  /* Hai viewBox RỘNG KHÁC NHAU, cùng chiều cao. Nếu dùng chung một khung thì dấu
     tick đơn phải co lại hoặc lệch về một bên để lấp chỗ trống của dấu thứ hai —
     hai dấu tick to bằng nhau mới đọc ra "một" với "hai"; hai dấu tick KHÁC CỠ
     đọc ra "gần" với "xa". Khung ôm sát nét nên huy hiệu hai tick tự rộng hơn,
     cộng thêm một lối phân biệt nữa mà không tốn gì. */
  /* Hai dấu tick RỜI HẲN, không chồng nhau kiểu ứng dụng nhắn tin. Bản đầu vẽ
     chồng — dấu thứ hai mượn nét xuống của dấu thứ nhất — và ở 9px nó đọc ra
     «//», mất hẳn hình dấu tick. Kiểu chồng ấy chỉ sống được ở cỡ to hoặc ở nơi
     người dùng đã thuộc lòng ký hiệu; đây là thumb 147px và người chấm nhìn
     lướt, nên mỗi dấu phải tự đứng thành một dấu tick trọn vẹn. */
  var net = 'l3 3.1 5.2-6.3';
  var d = la
    ? '<path d="M1.4 7.4' + net + '"/><path d="M10 7.4' + net + '"/>'
    : '<path d="M1.4 7.4' + net + '"/>';
  var w = la ? 19.6 : 11;
  return '<svg class="ic" viewBox="0 0 ' + w + ' 14" aria-hidden="true"'
    + ' fill="none" stroke="currentColor" stroke-width="1.6"'
    + ' stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
}
function veNhan(la){
  var cau = tt(la ? 'nhan_alb' : 'nhan_cho');
  return '<span class="nhan" role="img" aria-label="' + esc(cau) + '" title="' + esc(cau) + '">'
    + veIconNhan(la) + '</span>';
}

/* Một tấm trong khối. `cho` mới có ô tick; cả hai đều có viền RIÊNG và nhãn HÌNH. */
function veTam(x){
  var la = x.trang_thai === 'xac-nhan';
  /* E08-D105 → D118 · mức tự tin của máy hiện ngay trên tấm CHỜ DUYỆT, nay là số
     phần trăm thay cho ba chữ.
     Người chấm trong khối đang nhìn thumb nhỏ và tick nhanh; không có mức ấy thì
     cú tick là một đại lượng khác với thứ AC-5 D077 muốn đo. Tấm ĐÃ VÀO ALBUM
     không hiện gì (AC-4): quyết định của nó xong rồi, treo một con số lên đó là
     mời người ta xét lại thứ đã chốt (FR-2).
     Gọi ĐÚNG `phanTram()` của trang xem ảnh, không chép lại phép làm tròn: hai bản
     sao của cùng một phép tính là hai thứ sẽ lệch nhau vào lúc không ai để ý (AC-3). */
  var pt = la ? '' : phanTram(x.score);
  /* E08-D110 · cùng cái móc forward như trang xem ảnh: có mã Drive thì đánh dấu,
     và mục «Ảnh gốc» của bộ chọn tự sáng. Hôm nay không tấm nào có. */
  return '<div class="anh-o ' + (la ? 'alb' : 'cho') + '" data-cid="' + x.candidate_id
    + '" data-anh="' + x.event_photo_id + '"' + (x.drive_file_id ? ' data-goc="1"' : '') + '>'
    + '<img loading="lazy" src="' + x.thumb_url + '" alt="' + esc(tt('anh_alt')) + '">'
    + (pt ? '<span class="pt' + (x.score >= 0.55 ? ' chac' : '') + '">'
        + esc(pt) + '</span>' : '')
    + veNhan(la)
    + (la ? '' : '<label class="tick"><input type="checkbox"></label>')
    + '</div>';
}

/* Thanh nút duyệt. Nhãn LUÔN in số thật đang tick — không có nút nào nói "tất cả",
   vì "tất cả" là con số người dùng chưa đếm bằng mắt. */
function veThanh(n){
  return '<button class="btn sm ok" data-lo="xac-nhan"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_xac_nhan', { n: n })) + '</button>'
    + '<button class="btn sm bad" data-lo="tu-choi"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_tu_choi', { n: n })) + '</button>'
    + '<button class="btn sm" data-lo="bo-qua"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_bo_qua', { n: n })) + '</button>';
}
function capNhatThanh(the){
  var pham = the.id ? '#' + the.id : '.khoi[data-gid="' + the.getAttribute('data-gid') + '"]';
  var n = demTick(pham);
  var thanh = the.querySelector('.thanhChon');
  /* E08-D110 · nút Tải đứng ngay trong thanh này, sau ba nút duyệt: trần của nó là
     ĐÚNG số tick trên phạm vi đang thấy, cùng con số ba nút kia đang in. Dựng lại
     cùng lúc với chúng nên hai con số không thể lệch nhau một nhịp. */
  if (thanh) thanh.innerHTML = veThanh(n) + veBangTai(pham, idsAnh(pham), gocDuoc(pham))
    + (the.getAttribute('data-gid')
    ? '<div class="spacer"></div><button class="btn sm" data-mo="'
      + the.getAttribute('data-gid') + '">' + esc(tt('xem_het')) + '</button>' : '');
  the.querySelectorAll('.anh-o[data-cid]').forEach(function(o){
    o.classList.toggle('daChon', !!o.querySelector('input:checked')); });
  /* E08-D109 FR-4 · ô «chọn hết» của ĐÚNG phạm vi này — mỗi khối một ô, màn một
     khách giữ `#chonHetTrang` cũ. Trần của nó là số ô tick ĐANG có trong phạm vi
     (`cho` mới có ô tick; ảnh trong album không có), nên nó không thể với tới tấm
     của khách khác hay tấm chưa tải. Nhãn in N thật, cùng luật với nhãn nút duyệt.
     Đồng bộ ở đây chứ không phải chỉ lúc bấm: tick tay từng tấm cho đủ cả khối thì
     ô này phải tự đầy, và bỏ một tấm thì nó phải tự nhả — nếu không, ô nói "đã
     chọn hết" trong khi có tấm không được chọn. */
  var oHet = the.querySelector('.chonHetKhoi') || (the.id === 'manMotKhach' ? $('#chonHetTrang') : null);
  if (oHet){
    var tong = the.querySelectorAll('.anh-o[data-cid] input').length;
    oHet.checked = tong > 0 && n === tong;
    oHet.indeterminate = n > 0 && n < tong;
    oHet.disabled = tong === 0;
    var nhan = the.querySelector('.nhanChonKhoi');
    if (nhan){
      nhan.textContent = fmt('chon_het_khoi', { n: tong });
      oHet.closest('.chonHet').classList.toggle('an', tong === 0);
    }
  }
}

async function veKhoi(noiTiep){
  var offset = noiTiep ? KHOI.length : 0;
  var q = ($('#timKhach').value || '').trim();
  var j;
  try {
    j = await jget('/crm/face-match/khoi?loc=' + encodeURIComponent(LOC_KHOI)
      + '&limit=20&offset=' + offset + (q ? '&q=' + encodeURIComponent(q) : ''));
  } catch (_) { $('#khoiTom').textContent = tt('loi_nap'); return; }
  KHOI = noiTiep ? KHOI.concat(j.items || []) : (j.items || []);
  KHOI_TONG = j.tong || 0;
  $('#khoiTom').textContent = KHOI.length
    ? fmt('khoi_tom', { n: KHOI_TONG, c: KHOI.length }) : tt('khoi_rong');
  $('#khoiChu').textContent = tt('khoi_chu');
  $('#dsKhoi').innerHTML = KHOI.map(function(k){
    var dv = LANG === 'jp' && k.org_jp ? k.org_jp : (k.org || '');
    var anh = (k.anh || []).map(veTam).join('');
    if (k.con_lai > 0) anh += '<button class="mo-them" data-mo="' + k.guest_id + '">'
      + esc(fmt('con_lai', { n: k.con_lai })) + '</button>';
    return '<div class="card khoi" data-gid="' + k.guest_id + '">'
      + '<div class="top" style="margin-bottom:7px">'
      +   '<h3>' + esc(tenKh(k)) + '</h3>'
      +   (dv ? '<span class="hint">' + esc(dv) + '</span>' : '')
      + '</div>'
      + '<div class="khoi-so">'
      +   '<span class="cap"><span class="dem' + (k.so_album ? ' co' : '') + '" data-so="album">' + k.so_album
      +     '</span><span class="hint">' + esc(tt('n_album')) + '</span></span>'
      +   '<span class="cap"><span class="dem' + (k.so_cho ? ' cho' : '') + '" data-so="cho">' + k.so_cho
      +     '</span><span class="hint">' + esc(tt('n_cho')) + '</span></span>'
      + '</div>'
      /* Khách không có mẫu thì máy KHÔNG đoán được — nói thẳng, vì đó là lý do khối
         của họ rỗng, không phải vì chưa ai duyệt (giữ bài học AC-6 của D077). */
      + (k.so_mau ? '' : '<p class="canh" style="margin:0 0 8px">' + esc(tt('khong_mau')) + '</p>')
      /* E08-D109 FR-4 · ô chọn hết nằm TRONG card, ngay trên lưới của card — không
         phải một ô chung trên đầu list. Một ô chung sẽ phủ mọi khách đã tải, tức
         duyệt hộ những tấm người dùng chưa cuộn tới: đúng cái cửa hậu D103 sinh ra
         để đóng. Đặt ngoài `.thanhChon` vì `capNhatThanh` dựng lại phần đó sau MỖI
         cú tick — nhốt ô chọn hết vào đó là nó tự bỏ dấu ngay khi vừa bấm. */
      + '<label class="chonHet"><input type="checkbox" class="chonHetKhoi">'
      +   '<span class="nhanChonKhoi"></span></label>'
      + (anh ? '<div class="luoi" style="margin-top:9px">' + anh + '</div>'
             : '<p class="hint">' + esc(tt('khoi_khong_anh')) + '</p>')
      + '<div class="thanhChon"></div></div>';
  }).join('');
  document.querySelectorAll('.khoi').forEach(capNhatThanh);
  var het = KHOI.length >= KHOI_TONG;
  $('#khoiThem').disabled = het;
  $('#khoiThem').textContent = het ? tt('het_khach') : tt('khoi_them');
  DA_NAP = true;
  /* Vừa dựng lại từ dữ liệu mới, đúng ngôn ngữ hiện tại ⇒ hết cũ. Gỡ dấu ở ĐÂY chứ
     không phải lúc gọi: nhánh `catch` phía trên thoát sớm mà không đụng `#dsKhoi`,
     nên DOM cũ vẫn còn cũ — gỡ dấu trước khi biết có vẽ được hay không là tự nhận
     một list lỗi thời là list mới. */
  KHOI_CU = false;
}

/* ── Màn MỘT khách (FR-4) — chỗ đóng lỗ hổng «124 tấm không có lối vào» ── */
async function moMotKhach(gid, offset){
  if (!gid) return;
  /* Chỉ ghi chỗ cuộn khi ta đang thật sự RỜI list khối (nó đang hiện). Hàm này
     còn được gọi để đổi trang, để vẽ lại sau một lượt duyệt, và từ `#veLuoi` lúc
     quay về — mọi lần đó `scrollY` là của màn một khách, ghi vào đây là làm hỏng
     đúng con số mà `#veKhoi` sắp dùng. */
  if (!$('#manKhach').classList.contains('an')) SCROLL_KHOI = window.scrollY;
  KHACH_DANG = gid;
  KHACH_OFFSET = Math.max(0, offset || 0);
  /* Gỡ dấu TRƯỚC khi nạp: nếu lượt nạp này hỏng, `#anhMotKhach` còn nội dung của
     trang cũ — không có dấu thì lượt «về» sau đó sẽ tưởng DOM ấy là của trang này
     và hiện lại nguyên một trang sai. Không dấu = phải nạp lại, đó là phía an toàn. */
  $('#manMotKhach').removeAttribute('data-gid');
  $('#manMotKhach').removeAttribute('data-offset');
  hienMan('manMotKhach');
  var j;
  try {
    j = await jget('/crm/face-match/khoi/' + gid + '?limit=' + TRANG_KHACH + '&offset=' + KHACH_OFFSET);
  } catch (_) { $('#tomMotKhach').textContent = tt('loi_nap'); return; }
  KHACH_DL = j;
  $('#tenMotKhach').textContent = tenKh(j.khach || {});
  $('#tomMotKhach').textContent = fmt('khach_tom', { a: j.so_album, c: j.so_cho });
  $('#chuMotKhach').textContent = tt('khoi_chu');
  $('#anhMotKhach').innerHTML = (j.items || []).map(veTam).join('')
    || '<p class="hint">' + esc(tt('khoi_khong_anh')) + '</p>';

  var soTrang = Math.max(1, Math.ceil((j.tong || 0) / TRANG_KHACH));
  var trang = Math.floor(KHACH_OFFSET / TRANG_KHACH) + 1;
  $('#soTrang').textContent = fmt('trang_may', { t: trang, n: soTrang, s: (j.items || []).length });
  $('#trangTruoc').disabled = KHACH_OFFSET <= 0;
  $('#trangSau').disabled = KHACH_OFFSET + TRANG_KHACH >= (j.tong || 0);
  /* Nhãn nói RÕ trần: "trên trang này (tối đa 24)". Người dùng phải đọc được giới
     hạn của cú bấm ngay trên cú bấm, không phải suy ra từ hành vi. */
  var soCho = (j.items || []).filter(function(x){ return x.trang_thai === 'cho'; }).length;
  $('#nhanChonHet').textContent = fmt('chon_het', { n: soCho, m: TRANG_KHACH });
  $('#chonHetTrang').checked = false;
  $('#chonHetTrang').disabled = soCho === 0;
  capNhatThanh($('#manMotKhach'));
  /* Đóng dấu «DOM đang hiện là đúng khách này, đúng trang này». Lượt «về» từ màn
     xem đọc hai dấu này để biết được phép hiện lại DOM cũ hay phải nạp mới —
     khác khách hoặc khác offset thì bắt buộc nạp, vì giữ lại là giữ nhầm trang. */
  $('#manMotKhach').setAttribute('data-gid', String(gid));
  $('#manMotKhach').setAttribute('data-offset', String(KHACH_OFFSET));
}

/* ══════════ E08-D109 · quay về đúng chỗ, giữ nguyên việc đang làm ══════════ */
function khoiPhucCuon(y, sel){
  window.scrollTo(0, y);
  if (!sel) return;
  var el = document.querySelector(sel);
  if (!el) return;
  /* Lưới đầy ảnh `loading="lazy"`, nhưng `.anh-o img` có `aspect-ratio` nên chiều
     cao đã biết trước khi tệp về — khôi phục `scrollY` là đủ và khớp tới từng pixel.
     Cú `scrollIntoView` bên dưới CHỈ chạy khi phép khôi phục kia trượt (DOM đã đổi
     chiều cao, hoặc trang ngắn hơn lúc rời đi nên trình duyệt kẹp giá trị); để nó
     chạy vô điều kiện là tự phá con số vừa khôi phục. */
  var r = el.getBoundingClientRect();
  if (r.bottom <= 0 || r.top >= (window.innerHeight || 0)) el.scrollIntoView({ block: 'nearest' });
}

/* Về list khối. `veKhoi()` chỉ chạy khi list TRỐNG THẬT hoặc đã bị đánh dấu cũ —
   còn khối trên màn thì hiện lại chính DOM ấy: đó là chỗ giữ cả tick lẫn chỗ cuộn. */
function veManKhoi(gidNhin){
  var conKhoi = !KHOI_CU && !!$('#dsKhoi').querySelector('.khoi');
  hienMan('manKhach');
  if (!conKhoi){ veKhoi(); return; }
  khoiPhucCuon(SCROLL_KHOI, gidNhin ? '.khoi[data-gid="' + gidNhin + '"]' : null);
}

/* Về màn một khách. Cùng khách + cùng trang + DOM còn tấm ⇒ hiện lại, không nạp:
   một lượt `innerHTML` mới là mọi checkbox mới, tức mất sạch tick dù dữ liệu y hệt. */
function veManMotKhach(){
  var mk = $('#manMotKhach');
  var conTrang = mk.getAttribute('data-gid') === String(KHACH_DANG)
    && mk.getAttribute('data-offset') === String(KHACH_OFFSET)
    && !!$('#anhMotKhach').querySelector('.anh-o');
  if (!conTrang){ moMotKhach(KHACH_DANG, KHACH_OFFSET); return; }
  hienMan('manMotKhach');
  khoiPhucCuon(SCROLL_KHACH, null);
}

/* FR-3 · sau một cú quyết trên màn xem, sửa ĐÚNG ô của tấm ấy trên DOM đang giấu.
   Không `veKhoi()` cả list: cái giá của nó là mọi tick của mọi tấm khác. `data-cid`
   trên hàng gợi ý (`.goi`) và trên ô khối (`.anh-o`) là CÙNG một `crm_face_candidates.id`
   (face-match.js:200 và :371) — nên đây là phép sửa đúng một dòng, không phải đoán.
   Sửa cả con số của khối luôn: khối tự nói «9 chờ duyệt» mà đếm được 8 tấm chờ thì
   con số và thứ nhìn thấy nói hai điều khác nhau — đúng thứ khối này sinh ra để bỏ. */
function capNhatSauQuyet(cid, trangThai, kq){
  /* E08-D115 · `da_trong_album` = tấm ấy đã nằm trong album của khách TRƯỚC cú
     bấm này, nên album không dày thêm và con số không được +1.
     Nhưng bỏ +1 thôi thì chưa đủ: con số đang hiện có thể đã cũ từ trước (đường
     gắn tên tay cố ý không sửa số, nó đánh dấu list cũ rồi nạp lại). Cộng thêm
     một cú "không +1" nữa là để lại một con số THIẾU mà không có ai sửa. Nên ở
     đây đánh dấu list cũ: lượt về khối sẽ hỏi lại máy chủ. Đoán số bằng số học
     tại chỗ chỉ đúng khi ta biết chắc mình vừa làm album dày thêm đúng một tấm —
     ngoài trường hợp ấy thì đi hỏi, đừng đoán. */
  var daCo = !!(kq && kq.da_trong_album);
  if (daCo) KHOI_CU = true;
  document.querySelectorAll('.anh-o[data-cid="' + cid + '"]').forEach(function(o){
    if (!o.classList.contains('cho')) return;      // đã quyết rồi thì không đếm lần hai
    var the = o.closest('.khoi') || o.closest('#manMotKhach');
    if (trangThai === 'xac-nhan'){
      o.classList.remove('cho', 'daChon'); o.classList.add('alb');
      var tick = o.querySelector('.tick'); if (tick) tick.remove();
      var g = o.querySelector('.pt'); if (g) g.remove();      // % chỉ có nghĩa lúc còn chờ (AC-4)
      /* Một tick → hai tick. Phải thay cả `aria-label`/`title` chứ không mỗi hình:
         bỏ sót chúng là để lại tấm vẽ hai tick mà người đọc màn hình vẫn nghe
         «Máy đoán, chờ duyệt» — mà từ vé icon-only thì `aria-label` LÀ kênh chữ
         duy nhất còn lại, sai nó là sai hẳn chứ không phải lệch một chút. */
      var nh = o.querySelector('.nhan');
      if (nh){
        nh.innerHTML = veIconNhan(true);
        nh.setAttribute('aria-label', tt('nhan_alb'));
        nh.setAttribute('title', tt('nhan_alb'));
      }
      if (!daCo) doiSo(the, 'album', 1);
    } else {
      /* tu-choi / bo-qua: máy chủ loại nó khỏi cả hai truy vấn khối, nên lượt nạp
         tới sẽ không có tấm này. Giữ nó lại là hiện một thứ vừa bị bỏ — và còn
         tick được, tức gửi lại được trong lô sau. Gỡ khỏi DOM. */
      o.remove();
    }
    doiSo(the, 'cho', -1);
    if (the) capNhatThanh(the);
  });
}
/* Cộng trừ đúng một đơn vị trên con số của phạm vi — không hỏi lại máy chủ, vì
   phép đổi ở đây là số học chắc chắn: một dòng rời `cho` sang `xac-nhan`. */
function doiSo(the, loai, d){
  if (!the) return;
  if (the.id === 'manMotKhach'){
    if (!KHACH_DL) return;
    var k = loai === 'album' ? 'so_album' : 'so_cho';
    KHACH_DL[k] = Math.max(0, (Number(KHACH_DL[k]) || 0) + d);
    $('#tomMotKhach').textContent = fmt('khach_tom', { a: KHACH_DL.so_album, c: KHACH_DL.so_cho });
    return;
  }
  var em = the.querySelector('.dem[data-so="' + loai + '"]');
  if (!em) return;
  var v = Math.max(0, (Number(em.textContent) || 0) + d);
  em.textContent = v;
  em.classList.toggle(loai === 'album' ? 'co' : 'cho', v > 0);
}

/* Một lượt duyệt nhiều. Gửi ĐÚNG các id đang tick trong phạm vi đó — không suy ra
   từ bộ lọc, không "tất cả khách này". */
async function duyetLo(pham, trangThai, sauDo){
  var ids = idsTick(pham);
  if (!ids.length) return;
  var kq = await jpost('/crm/face-match/quyet-nhieu', { ids: ids, trang_thai: trangThai });
  if (sauDo) await sauDo(kq);
}

/* ══════════ FR-10 · khoanh mặt trên ảnh sự kiện → ảnh mẫu ══════════
   Toạ độ đổi về ẢNH GỐC ngay lúc thả chuột: CSDL lưu theo ảnh gốc, còn trình
   duyệt đang hiện bản đã co. Đổi ở đây một lần, thay vì để mỗi chỗ đọc lại tự
   quy đổi — mỗi lần quy đổi là một lần có thể quên. */
var KHUNG_MOI = null;
function toaDoGoc(el, ev, the){
  var r = el.getBoundingClientRect();
  var t = (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;
  return { x: (t.clientX - r.left) / r.width  * Number(the.getAttribute('data-w')),
           y: (t.clientY - r.top)  / r.height * Number(the.getAttribute('data-h')) };
}
function batDauKhoanh(el, ev, the){
  if (!el.classList.contains('khoanh')) return;
  ev.preventDefault();
  var d = toaDoGoc(el, ev, the);
  KHUNG_MOI = { el: el, the: the, x0: d.x, y0: d.y, x1: d.x, y1: d.y };
  var cu = el.querySelector('.khung.moi'); if (cu) cu.remove();
  var i = document.createElement('i'); i.className = 'khung moi'; el.appendChild(i);
}
function keoKhoanh(ev){
  if (!KHUNG_MOI) return;
  ev.preventDefault();
  var d = toaDoGoc(KHUNG_MOI.el, ev, KHUNG_MOI.the);
  KHUNG_MOI.x1 = d.x; KHUNG_MOI.y1 = d.y;
  var W = Number(KHUNG_MOI.the.getAttribute('data-w')), H = Number(KHUNG_MOI.the.getAttribute('data-h'));
  var k = KHUNG_MOI.el.querySelector('.khung.moi'); if (!k) return;
  k.style.left   = (Math.min(KHUNG_MOI.x0, KHUNG_MOI.x1) / W * 100) + '%';
  k.style.top    = (Math.min(KHUNG_MOI.y0, KHUNG_MOI.y1) / H * 100) + '%';
  k.style.width  = (Math.abs(KHUNG_MOI.x1 - KHUNG_MOI.x0) / W * 100) + '%';
  k.style.height = (Math.abs(KHUNG_MOI.y1 - KHUNG_MOI.y0) / H * 100) + '%';
}
function thaKhoanh(){
  if (!KHUNG_MOI) return;
  var k = KHUNG_MOI, the = k.the;
  var w = Math.abs(k.x1 - k.x0), h = Math.abs(k.y1 - k.y0);
  var huong = the.querySelector('.khoanhHuong');
  /* Khung bé quá thì mặt cắt ra không đủ để nhúng — chặn ngay, đừng để tới lượt
     batch mới im lặng bỏ qua. */
  if (w < 24 || h < 24){
    the.querySelector('.khung.moi') && the.querySelector('.khung.moi').remove();
    huong.textContent = tt('khoanh_nho'); KHUNG_MOI = null; return;
  }
  the.dataset.box = JSON.stringify({ x: Math.min(k.x0,k.x1), y: Math.min(k.y0,k.y1), w: w, h: h });
  huong.textContent = tt('khoanh_chon');
  the.querySelector('.ganO').focus();
  KHUNG_MOI = null;
}
document.addEventListener('mousedown', function(e){
  var el = e.target.closest && e.target.closest('.anhto.khoanh');
  if (el) batDauKhoanh(el, e, el.closest('.card')); });
document.addEventListener('mousemove', keoKhoanh);
document.addEventListener('mouseup', thaKhoanh);
document.addEventListener('touchstart', function(e){
  var el = e.target.closest && e.target.closest('.anhto.khoanh');
  if (el) batDauKhoanh(el, e, el.closest('.card')); }, { passive: false });
document.addEventListener('touchmove', keoKhoanh, { passive: false });
document.addEventListener('touchend', thaKhoanh);

/* ══════════ Typeahead FR-4b — dùng ĐÚNG /crm/guests?q= sẵn có ══════════ */
var henTim = null;
document.addEventListener('input', function(e){
  if (!e.target.classList.contains('ganO')) return;
  var o = e.target, ds = o.parentElement.querySelector('.ta-ds');
  var q = o.value.trim();
  clearTimeout(henTim);
  if (q.length < 2){ ds.classList.add('an'); return; }
  henTim = setTimeout(async function(){

/* Mỗi lần tick đổi → vẽ lại nhãn nút của ĐÚNG phạm vi đó. Nhãn phải in số thật,

document.addEventListener('change', function(e){
  var o = e.target;
  /* E08-D110 · đổi bậc thì chỉ NHỚ, không vẽ lại: vẽ lại bảng ngay lúc này là cướp
     con trỏ khỏi cái radio người dùng vừa bấm, và bàn phím mất chỗ đứng. Trình
     duyệt tự lo phần hiển thị của một nhóm radio. */
  if (o.type === 'radio' && o.name.indexOf('bac_') === 0){ TAI_BAC = o.value; return; }
  if (o.id === 'chonHetTrang'){
    /* «Chọn tất cả trên trang» — phạm vi là ĐÚNG các ô đang có trong DOM của trang
       này, mà DOM của trang này do máy chủ cắt ≤24. Không chạm tới trang khác,

    document.querySelectorAll('#anhMotKhach .anh-o[data-cid] input').forEach(function(i){

    capNhatThanh($('#manMotKhach'));

  /* E08-D109 FR-4 · «chọn hết» của MỘT khối. Phạm vi là `.khoi` chứa chính ô này,
     không phải `document` — nên nó không thể với sang khách bên cạnh. Và chỉ tấm
     `cho` mới có `input`, nên «hết» ở đây đúng nghĩa «hết tấm chờ đang hiện». */
  if (o.classList.contains('chonHetKhoi')){
    var theK = o.closest('.khoi');

    theK.querySelectorAll('.anh-o[data-cid] input').forEach(function(i){ i.checked = o.checked; });
    capNhatThanh(theK);
    return;
  }
  if (o.type !== 'checkbox' || !o.closest('.anh-o')) return;
  var khoiCha = o.closest('.khoi');
  if (khoiCha) capNhatThanh(khoiCha);
  else if (o.closest('#manMotKhach')) capNhatThanh($('#manMotKhach'));
});
