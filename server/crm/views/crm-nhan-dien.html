  /* D127 · FR-5 — TÊN MÁY. API trả `may` từ D126 và UI bỏ qua nó; với người vận
     hành đang mở ba cửa sổ trên hai máy tính, đó là câu trả lời cho «luồng này
     chạy ở đâu» — thứ phải biết trước khi đi tắt đúng cái cần tắt.
     Chỉ hiện khi ĐÃ CÓ máy nhận: một luồng còn nằm `cho` mà đã mang tên máy là
     bịa, và người ta sẽ đi tìm một tiến trình không tồn tại. Chuỗi giữ NGUYÊN
     (CR-183) — cắt là việc của CSS, `title` giữ bản đầy đủ. */
  if (l.may){
    var mm = document.createElement('span'); mm.className = 'qmuc qmay';
    mm.textContent = l.may;
    mm.title = l.may;
    d.appendChild(mm);
  }

  /* Có NHÃN, không phải con số trần. Trên một dòng đã có «104» và «203 tấm/phút»
     cạnh nhau, một con số không tên buộc người đọc phải đoán nó là cái gì — và
     đoán sai thì họ tăng giảm luồng theo một con số khác thứ họ tưởng. */
  var soi = document.createElement('span'); soi.className = 'qmuc';
  soi.appendChild(document.createTextNode(tt('q_da_soi') + ' '));
  var bs = document.createElement('b'); bs.textContent = dbSo(l.da_soi);
  soi.appendChild(bs);
  d.appendChild(soi);

  /* Tấm lỗi tô đỏ khi vượt 5% — con số ấy là thứ người vận hành nhìn để tăng hay
     bớt luồng (FR-9). Ẩn hẳn khi bằng 0: một số 0 màu đỏ vẫn đọc thành «có lỗi». */
  if (l.loi > 0){
    var xau = document.createElement('span');
    var mau = l.da_soi + l.loi;
    xau.className = 'qmuc' + (mau && l.loi / mau > 0.05 ? ' qxau' : '');
    xau.textContent = fmt('q_loi_tam', { n: dbSo(l.loi) });
    d.appendChild(xau);
  }

  /* Tốc độ chỉ hiện khi ĐANG chạy: một luồng đã dừng mà vẫn khoe «47 tấm/phút»
     là nói về quá khứ bằng thì hiện tại. */
  var moc = DB_MOC[l.id], nay = Date.now();
  if (l.trang_thai === 'chay' && moc && nay > moc.t && l.da_soi >= moc.n){
    var tren = Math.round((l.da_soi - moc.n) / ((nay - moc.t) / 60000));
    if (isFinite(tren)){
      var tdo = document.createElement('span'); tdo.className = 'qmuc';
      tdo.textContent = fmt('q_toc_do_dv', { n: dbSo(tren) });
      d.appendChild(tdo);
    }
  }
  if (l.trang_thai === 'chay' || l.trang_thai === 'tam-dung') DB_MOC[l.id] = { t: nay, n: l.da_soi };
  else delete DB_MOC[l.id];

  /* Nhịp chỉ có nghĩa cho luồng CÒN PHẢI THỞ. Một luồng đã xong mà vẫn khoe
     «nhịp 940s trước» là bày ra một con số tăng mãi, và người đọc phải tự hiểu
     rằng nó không nói gì cả. Luồng mất liên lạc thì giữ lại — ở đó chính con số
     ấy là bằng chứng. */
  /* D127 · FR-10 — và chỉ khi con số ấy NÓI ĐIỀU GÌ. Dưới 30 giây thì mọi luồng
     đang sống đều nằm trong khoảng ấy: con số nhảy 3 giây một lần mà nội dung
     luôn là «vẫn ổn». Từ 30 giây trở lên thì nó bắt đầu là một dấu hiệu. */
  var canNhip = l.trang_thai === 'chay' || l.trang_thai === 'tam-dung'
             || l.trang_thai === 'mat-lien-lac';
  if (canNhip && l.nhip_cuoi_giay != null && l.nhip_cuoi_giay >= 30){
    var nh = document.createElement('span'); nh.className = 'qmuc';
    nh.textContent = fmt('q_nhip', { n: dbSo(l.nhip_cuoi_giay) });
    d.appendChild(nh);
  }

  var anh = document.createElement('span'); anh.className = 'qanh';
  anh.textContent = (l.trang_thai === 'chay' && l.anh_hien_tai) ? l.anh_hien_tai : '';
  d.appendChild(anh);

  /* Nút chỉ tồn tại khi có cái để bấm (bài học D095: «Dừng chỉ tồn tại khi có cái
     để dừng»). Luồng đã xong / lỗi / mất liên lạc thì không có nút nào — hiện một
     nút Tạm dừng cho thứ đã dừng là mời người ta bấm vào chỗ trống. */
  if (l.trang_thai === 'cho' || l.trang_thai === 'chay'){
    d.appendChild(nutLuong('q_tam_dung', 'tam-dung', l.id));
  } else if (l.trang_thai === 'tam-dung'){
    d.appendChild(nutLuong('q_tiep', 'tiep-tuc', l.id));
  }

  /* Câu lỗi xuống DÒNG RIÊNG: nó là câu tiếng người («tự tạm dừng vì 24/100 tấm
     lỗi»), dài hơn hẳn mọi thứ khác trên dòng, và nhét nó vào hàng ngang thì cả
     hàng vỡ ra thành ba dòng lệch nhau. */
  if (l.cau_loi){
    var c = document.createElement('div'); c.className = 'qcanh';
    c.textContent = l.cau_loi;
    d.appendChild(c);
  }
  return d;
}
function nutLuong(nhan, viec, id){
  var b = document.createElement('button');
  b.className = 'btn sm' + (viec === 'tiep-tuc' ? ' ok' : '');
  b.textContent = tt(nhan);
  b.onclick = function(){ doiCo(viec, { luong_id: Number(id) }, b); };
  return b;
}

async function doiCo(viec, than, nut){
  if (nut) nut.disabled = true;
  try {
    var r = await fetch('/crm/face-match/dong-bo/' + viec, { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(than) });
    if (!r.ok) $('#dbChu').textContent = tt('q_hong');
  } catch (e){ $('#dbChu').textContent = tt('q_hong'); }
  /* Hỏi lại NGAY, đừng đợi hết nhịp 3 giây: cú bấm phải thấy kết quả của chính
     nó, và máy chủ mới là nơi biết sự thật. */
  hoiDongBo();
}

function veBangQuet(j){
  var luong = j.luong || [], mo = !!j.dot_mo;
  var khoi = $('#qKhoi');
  /* D127 · FR-2 — hàng toàn kho hiện LUÔN, kể cả khi chưa có đợt nào từng chạy.
     D126 ẩn cả khối khi sổ luồng rỗng, với lý do «đừng hiện một bảng rỗng toàn số
     0». Lý do ấy đúng cho DÒNG LUỒNG (không có luồng thì không có gì để nói), và
     sai cho DÒNG KHO: «còn 4.405 tấm chưa soi» là con số thật, đọc được từ kho
     ảnh, và nó là thứ duy nhất người mở trang lúc chưa bấm gì cần biết. Ẩn nó đi
     nghĩa là bắt người ta bấm Bắt đầu rồi mới biết có đáng bấm hay không.
     Thứ ẩn theo đợt nay là những thứ chỉ có nghĩa KHI ĐANG CHẠY: tốc độ, còn bao
     lâu, sổ luồng, ba cái nút. */
  khoi.classList.remove('an');
  $('#qDs').classList.toggle('an', !luong.length);

  var pt = j.kho ? Math.round(j.da_soi / j.kho * 100) : 0;
  $('#qThanh').style.width = pt + '%';

  var so = $('#qSo'); so.textContent = '';
  var muc = [
    ['q_kho', dbSo(j.kho)],
    ['q_da_soi', dbSo(j.da_soi) + ' · ' + pt + '%'],
    ['q_con_lai', dbSo(j.con_lai)],
    ['q_mat', dbSo(j.so_mat)],
    ['q_goi_y', dbSo(j.goi_y_cho)],
  ];
  if (mo) muc.push(['q_toc_do', fmt('q_toc_do_dv', { n: dbSo(j.toc_do_phut) })]);
  if (mo && j.du_kien_giay != null) muc.push(['q_con_bao_lau', dbLau(j.du_kien_giay)]);

  /* FR-9 · TỈ LỆ LỖI CỦA CẢ ĐỢT, không chỉ của từng luồng. Đây là con số người
     vận hành nhìn để quyết định thêm hay bớt luồng — và cũng là con số AC-9 dùng
     để nói một lượt chạy có được tính là «nhanh hơn» hay không (lỗi ≤ 1%). */
  var dLoi = 0, dSoi = 0;
  luong.forEach(function(l){ dLoi += l.loi || 0; dSoi += l.da_soi || 0; });
  var tiLe = (dSoi + dLoi) ? dLoi / (dSoi + dLoi) : 0;

  muc.forEach(function(m){
    var s = document.createElement('span');
    s.appendChild(document.createTextNode(tt(m[0]) + ' '));
    var b = document.createElement('b'); b.textContent = m[1]; s.appendChild(b);
    so.appendChild(s);
  });
  if (dLoi > 0){
    var sl = document.createElement('span');
    sl.className = tiLe > 0.05 ? 'qxau' : '';
    sl.appendChild(document.createTextNode(tt('q_ti_le_loi') + ' '));
    var bl = document.createElement('b');
    /* toFixed cho ra dấu chấm thập phân — cả trang này viết số theo lối Việt
       (3.014 là ba nghìn, 31,8 là ba mươi mốt phẩy tám). Một dấu chấm ở đây đọc
       thành «ba trăm mười tám phần trăm». */
    bl.textContent = (tiLe * 100).toLocaleString(LANG === 'jp' ? 'ja-JP' : 'vi-VN',
      { maximumFractionDigits: 1 }) + '% · ' + fmt('q_loi_tam', { n: dbSo(dLoi) });
    sl.appendChild(bl);
    so.appendChild(sl);
  }

  /* Câu tiếng người chỉ nói lúc CHƯA chạy. Trong lúc chạy, thứ thay chỗ nó là tốc
     độ và «còn khoảng» — số đo thật, không phải lời mời bấm một cái nút đang khoá. */
  var cau = $('#qCauKho');
  /* Ba tình huống, ba câu — và cái thứ ba mới là cái vòng rà thứ hai tìm ra: kho
     RỖNG (sự kiện mới, chưa nạp tấm nào) rơi vào cùng nhánh với kho đã soi hết,
     nên trang nói «cả kho đã soi xong» cho một cái kho không có gì. Câu đúng ở đó
     phải chỉ sang chỗ nạp ảnh, vì đó là việc tiếp theo thật sự. */
  cau.textContent = mo ? ''
    : (!j.kho ? tt('q_cau_rong')
      : (j.con_lai > 0 ? fmt('q_cau_kho', { n: dbSo(j.con_lai) }) : tt('q_cau_het')));
  cau.classList.toggle('an', mo);

  var ds = $('#qDs'); ds.textContent = '';
  luong.forEach(function(l){ ds.appendChild(veMotLuong(l)); });

  /* Nút chung theo đúng luật của nút riêng: chỉ hiện khi có cái để làm. */
  var coChay = luong.some(function(l){ return l.trang_thai === 'cho' || l.trang_thai === 'chay'; });
  var coNgu  = luong.some(function(l){ return l.trang_thai === 'tam-dung'; });
  $('#qNut').classList.toggle('an', !mo);
  $('#qTamDungHet').classList.toggle('an', !coChay);
  $('#qTiepHet').classList.toggle('an', !coNgu);
  $('#qDungHan').classList.toggle('an', !mo);
}

function veDongBo(j){
  if (!j || DB_TAT) return;
  DB_CUOI = j;
  var v = j.viec, tt2 = '', chu = '';
  var mo = !!j.dot_mo;
  var dangChay = !!(v && v.trang_thai === 'chay');
  if (!v){ chu = tt('db_chua') + ' ' + tt('db_giai'); }
  else if (dangChay || v.trang_thai === 'tam-dung'){
    tt2 = tt(v.trang_thai === 'tam-dung' ? 'q_tt_tam_dung' : 'db_dang');
    chu = fmt('db_dang_ct', { t: dbGio(v.bat_dau), b: v.boi || '' });
  } else if (v.trang_thai === 'xong'){
    tt2 = tt('db_xong');
    chu = fmt('db_xong_ct', { t: dbGio(v.xong), m: v.so_mau == null ? 0 : v.so_mau,
      a: v.so_tam == null ? 0 : v.so_tam, g: v.so_goi_y == null ? 0 : v.so_goi_y });
  } else if (v.trang_thai === 'huy'){
    tt2 = tt('q_tt_huy');
    chu = fmt('db_xong_ct', { t: dbGio(v.xong), m: v.so_mau == null ? 0 : v.so_mau,
      a: v.so_tam == null ? 0 : v.so_tam, g: v.so_goi_y == null ? 0 : v.so_goi_y });
  } else {
    tt2 = tt('db_loi');
    chu = fmt('db_loi_ct', { t: dbGio(v.xong || v.bat_dau), e: v.loi || '' });
  }
  /* FR-10 · KHÔNG có máy quét nào trực thì phải nói, và nói TRƯỚC câu khác. Một
     đợt đang mở mà không ai nhận là thứ trông giống «đang chạy» nhất, và im lặng
     ở đây là để người ta ngồi đợi một cái không bao giờ nhúc nhích. Chưa mở đợt
     mà cũng không có máy trực thì vẫn nói — đó là thứ cần biết TRƯỚC khi bấm.

     Cố ý KHÔNG dùng câu `db_thieu` của D124 («máy chủ chưa có bộ nhận diện nên
     nút này chưa chạy được») ở đây nữa: từ D126 nó SAI. Máy chủ prod không bao
     giờ có engine — đó là chủ ý của D077 — và cái nút vẫn chạy được, nó xếp việc
     cho máy quét trực. Câu đúng là câu chỉ đường bật máy quét. */
  /* D127 (vòng rà 2) · cảnh báo đứng RIÊNG một dòng, không dán vào `#dbChu` bằng
     một dấu «·». Nó là thứ quyết định có nên bấm hay không; đoạn dưới chỉ kể lại
     lượt chạy vừa rồi. Nối hai thứ ấy làm một đoạn dài là cách chắc nhất để câu
     quan trọng bị đọc lướt qua. */
  var canh = $('#dbCanh');
  canh.textContent = j.co_may_truc === false ? tt('q_khong_truc') : '';
  canh.classList.toggle('an', j.co_may_truc !== false);

  $('#dbTom').textContent = tt2;
  $('#dbChu').textContent = chu;
  /* D127 · FR-3 — nhãn nút nói VIỆC ĐANG LÀM, và ba trạng thái ấy chỉ hàm này
     biết. `data-i` vẫn ở trên nút và vẫn mang nhãn nghỉ («Bắt đầu quét»): nó là
     thứ setLang() đặt lúc đổi ngôn ngữ, và setLang() gọi lại chính hàm này ngay
     sau đó — nên thứ tự luôn là mặc định trước, trạng thái sau. */
  var nut = $('#nutDongBo');
  nut.textContent = mo
    ? tt(v && v.trang_thai === 'tam-dung' ? 'q_nut_ngu' : 'q_nut_chay')
    : tt('db_nut');
  nut.disabled = mo;
  $('#qChonO').classList.toggle('an', mo);   // đang chạy thì không đổi số luồng
  /* FR-6 · con số máy quét NGAY CẠNH ô chọn. Người ta chọn 4 luồng vì tưởng luồng
     nào cũng có máy chạy; con số này là thứ duy nhất nói trước rằng không phải. */
  var soMay = j.so_may_truc || 0;
  $('#qMayCanh').textContent = soMay > 0 ? fmt('q_may_dang', { n: dbSo(soMay) }) : tt('q_may_khong');
  /* D127 (vòng rà 3) · và ô chọn TỰ ĐỨNG ĐÚNG chỗ ấy khi người dùng chưa đụng vào.
     Bản vòng 2 để mặc định cứng 3 (từ D126). Hệ quả đo được: máy nào chỉ bật MỘT
     máy quét thì cú bấm nào cũng đâm vào hộp thoại «chỉ có 1 máy quét, luồng thứ 2
     sẽ ngồi chờ» — một lời cảnh báo đúng, hiện ra mỗi lần, cho một lựa chọn mà
     người dùng không hề chọn. Cảnh báo bật mãi là cảnh báo bị bấm qua mà không
     đọc, và thế là nó hỏng đúng lúc nó cần đúng.
     Ba hàng rào để việc tự đặt này không cướp quyền của người dùng:
       · chỉ khi CHƯA có đợt mở (đang chạy thì ô này ẩn, đặt gì cũng vô nghĩa);
       · chỉ khi người dùng CHƯA tự chọn lần nào trong phiên xem này;
       · và không đụng vào lúc con trỏ đang đứng trong chính ô ấy. */
  var oLuong = $('#qSoLuong');
  if (!mo && !Q_LUONG_TAY && soMay > 0 && document.activeElement !== oLuong){
    var g = String(Math.min(Math.max(soMay, 1), Number(j.toi_da) || 6));
    if (oLuong.value !== g) oLuong.value = g;
  }
  /* Câu nhắc đi CÙNG ô chọn, và biến mất khi ô chọn biến mất: nó nói về cú bấm
     sắp tới, không phải về đợt đang chạy. Trong lúc chạy thì thứ thay chỗ nó là
     tỉ lệ lỗi thật ở dòng toàn kho — số đo, không phải lời khuyên. */
  $('#qNhac').textContent = mo ? '' : tt('q_nhac_luong');
  veBangQuet(j);
  apDungThu();

  if (DB_HEN){ clearTimeout(DB_HEN); DB_HEN = null; }
  DB_HEN = setTimeout(hoiDongBo, mo ? DB_NHIP : DB_NHIP_NGHI);
  /* Vừa CHUYỂN từ đang-mở sang đóng ⇒ lưới đang hiện những con số đã cũ: gợi ý
     mới vừa được đẻ ra mà ô nào cũng còn ghi số của mấy phút trước. Chỉ vẽ lại khi
     đúng cú chuyển ấy và đúng màn lưới đang mở — vẽ lại theo mỗi nhịp hỏi thì cứ
     3 giây một lần trang lại giật dưới tay người đang duyệt. */
  var nay = mo ? 'mo' : 'dong';
  /* Cùng lý do `giuTrang` của FR-8: lượt vẽ lại này cũng là lượt TỰ ĐỘNG, và nó
     rơi đúng lúc đợt vừa đóng — tức lúc người ta đang ngồi duyệt chỗ sâu nhất. */
  if (DB_TRUOC === 'mo' && nay === 'dong' && !$('#manAnh').classList.contains('an')) veLuoi(false, true);
  DB_TRUOC = nay;

  /* ── D127 · FR-8 · LƯỚI THEO KỊP TRONG LÚC MÁY ĐANG CHẠY ──────────────────
     D126 chỉ vẽ lại lưới ở đúng cú ĐỢT ĐÓNG. Một đợt 4.400 tấm chạy hai tiếng,
     nên trong hai tiếng ấy người ngồi duyệt nhìn một lưới đứng im trong khi máy
     đẻ ra hàng trăm gợi ý mới — họ F5 để xem có gì mới không, và mất chỗ đang
     duyệt mỗi lần.

     Ba điều kiện, mỗi điều kiện chặn một kiểu phá:
       · MỐC là số gợi ý lúc VẼ LƯỚI LẦN TRƯỚC, không phải nhịp trước. Vẽ lại
         theo mỗi nhịp là 3 giây một lần trang giật dưới tay người đang bấm.
       · +20, không phải +1: dưới ngưỡng ấy thì cái giá (mất chỗ cuộn) lớn hơn
         cái được (một ô đổi số).
       · CHỈ khi lưới đang mở. Đứng trên một tấm mà lưới tự nạp lại là kéo người
         ta ra khỏi tấm họ đang soi — mà lúc quay về lưới thì `veLuoi()` chạy sẵn
         rồi. Ba màn còn lại (theo khách / một khách / một tấm) cũng là ba màn duy
         nhất có chọn hàng loạt, nên điều kiện này che luôn cả vế ấy.
     Ghi mốc TRƯỚC khi gọi: `veLuoi()` là bất đồng bộ, và nhịp 3 giây kế tiếp
     đến trước khi nó xong thì sẽ bắn lượt vẽ thứ hai cho cùng một cửa sổ +20. */
  var gy = j.goi_y_cho || 0;
  if (mo && GY_MOC != null && gy - GY_MOC >= 20 && !$('#manAnh').classList.contains('an')){
    GY_MOC = gy;
    veLuoi(false, true);   // giữ nguyên số ô đang có — xem chú thích veLuoi()
  }
}

/* ══════════ E08-D127 · FR-7 — BẢNG THU GỌN KHI KHÔNG ĐỨNG Ở LƯỚI ══════════
   Cái thẻ này nằm NGOÀI bốn màn con (D124), đó là điều đúng: trạng thái máy quét
   nói về MÁY chứ không về màn đang mở, nên nó phải thấy được ở mọi màn. Nhưng
   «thấy được» ở màn xem một tấm chỉ cần một dòng: ở 390px, bản đầy đủ đẩy tấm ảnh
   xuống dưới nếp gấp, và người mở màn ấy đang làm đúng một việc — nhìn mặt người
   trong ảnh.

   `Q_THU`: null = chưa ai bấm, đi theo mặc định của màn (lưới thì đủ, còn lại thì
   thu). true/false = người dùng đã bấm, và lựa chọn ấy thắng mặc định.
   sessionStorage chứ không localStorage, và cố ý: đây là thói quen của MỘT LƯỢT
   NGỒI, không phải một thiết lập. Mở tab mới hôm sau thì trở về mặc định.
   Nó cũng KHÔNG phải nguồn sự thật của đợt — đợt vẫn nằm ở máy chủ; thứ ở đây chỉ
   là cái nếp gấp giấy. */
var Q_THU = null;
try {
  var _qt = sessionStorage.getItem('nd_bang_thu');
  if (_qt === '1') Q_THU = true; else if (_qt === '0') Q_THU = false;
} catch (e){ /* riêng tư chặn storage — vẫn chạy, chỉ không nhớ qua F5 */ }

function coTheThu(){ return $('#manAnh').classList.contains('an'); }
function dangThu(){ return coTheThu() && (Q_THU == null ? true : Q_THU); }

function apDungThu(){
  var co = coTheThu(), thu = co && (Q_THU == null ? true : Q_THU);
  $('#theDongBo').classList.toggle('thu', thu);
  /* Ở lưới thì dòng thu biến mất hẳn, không chỉ vô hiệu: một dòng bấm được mà bấm
     vào không đổi gì là một nút hỏng dưới mắt người dùng. */
  $('#qThuDong').classList.toggle('an', !co);
  $('#qThuDong').setAttribute('aria-expanded', String(!thu));
  $('#qThuNut').textContent = tt(thu ? 'q_thu_mo' : 'q_thu_thu');
  veThuDong(DB_CUOI);
}

/* Ba con số trên dòng thu, đúng ba con số của câu hỏi «máy đang làm gì rồi»:
   trạng thái · phần trăm · còn lại. Không tốc độ, không tên máy, không luồng —
   những thứ ấy là lý do người ta bấm mở rộng. */
function veThuDong(j){
  /* Chưa có lượt hỏi nào trả lời (F5 thẳng vào màn một tấm) thì dòng thu vẫn phải
     có chữ: một dòng TRỐNG cao 20px đọc thành một khối hỏng, và nó nằm đúng chỗ
     dễ thấy nhất. Dấu ba chấm là câu trả lời trung thực cho «chưa biết» — đừng
     ghi «Chưa quét» khi chưa hỏi xong, vì có thể máy đang quét thật. */
  if (!j){
    $('#qThuDen').className = 'qden';
    $('#qThuTt').textContent = '…';
    $('#qThuPt').textContent = '';
    $('#qThuCon').textContent = '';
    return;
  }
  var mo = !!j.dot_mo, v = j.viec;
  var ngu = mo && v && v.trang_thai === 'tam-dung';
  $('#qThuDen').className = 'qden' + (mo ? (ngu ? ' tam-dung' : ' chay') : '');
  $('#qThuTt').textContent = mo ? tt(ngu ? 'q_nut_ngu' : 'q_nut_chay') : tt('q_thu_nghi');
  $('#qThuPt').textContent = (j.kho ? Math.round(j.da_soi / j.kho * 100) : 0) + '%';
  $('#qThuCon').textContent = fmt('q_thu_con', { n: dbSo(j.con_lai) });
}

$('#qThuDong').onclick = function(){
  Q_THU = !dangThu();
  try { sessionStorage.setItem('nd_bang_thu', Q_THU ? '1' : '0'); } catch (e){}
  apDungThu();
};
async function hoiDongBo(){
  if (DB_TAT) return;
  if (DB_HEN){ clearTimeout(DB_HEN); DB_HEN = null; }
  try { veDongBo(await jget('/crm/face-match/dong-bo')); }
  catch (e){ /* mạng chớp một nhịp không phải lý do để xoá trạng thái đang hiện */
    DB_HEN = setTimeout(hoiDongBo, DB_NHIP_NGHI); }
}
$('#nutDongBo').onclick = async function(){
  var n = Number($('#qSoLuong').value) || 1;
  /* FR-10 (D126) · cảnh báo TRƯỚC khi tạo, không sau. Vẫn cho tạo: việc được xếp
     sẵn và máy quét bật lên là nhận — nhưng người bấm phải biết mình đang xếp
     hàng chứ không phải đang khởi động cái gì.
     D127 · FR-6 thêm nấc THỨ HAI, và hai nấc loại trừ nhau: không máy nào thì nói
     chuyện «chưa có gì chạy»; có máy nhưng ít hơn số luồng vừa chọn thì nói chuyện
     «luồng thừa sẽ ngồi chờ». Gộp một câu cho cả hai thì câu ấy sai một nửa ở mỗi
     tình huống. Huỷ ở nấc nào cũng là KHÔNG tạo đợt — cú bấm chưa xảy ra. */
  var soMay = DB_CUOI ? (DB_CUOI.so_may_truc || 0) : 0;
  if (DB_CUOI && soMay === 0){
    if (!confirm(fmt('q_hoi_khong_truc', { n: n }))) return;
  } else if (DB_CUOI && n > soMay){
    if (!confirm(fmt('q_hoi_it_may', { m: dbSo(soMay), k: dbSo(soMay + 1), n: n }))) return;
  }
  $('#nutDongBo').disabled = true;
  $('#dbTom').textContent = '';
  try {
    /* Không dùng `jpost`: nó ném ở mọi mã ≠ 2xx nên nuốt mất THÂN của 409 và 400,
       mà thân ấy chính là câu cần hiện («đang có đợt mở»). Ở đây mã trạng thái là
       dữ liệu, không phải ngoại lệ. */
    var r = await fetch('/crm/face-match/dong-bo', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ nguon: 'tay', so_luong: n }) });
    /* D127 · nhánh 503 «thiếu bộ nhận diện» gỡ hẳn. Tuyến POST thôi trả 503 từ
       D126 — máy chủ prod không có engine theo đúng chủ ý D077, và đợt vẫn được
       xếp cho máy quét trực nhận. Một nhánh không bao giờ chạy, mang một câu nói
       sai, là thứ vòng sau sẽ tin. Mọi mã lạ nay rơi về `db_hong`, câu trung
       thực: không mở được việc, thử lại hoặc báo kỹ thuật. */
    if (r.status === 202) $('#dbChu').textContent = tt('db_mo') + ' ' + tt('q_nhac_luong');
    else if (r.status === 409) $('#dbChu').textContent = tt('db_dang_roi');
    else $('#dbChu').textContent = tt('db_hong');
  } catch (e){ $('#dbChu').textContent = tt('db_hong'); }
  /* Dù nhánh nào cũng hỏi lại trạng thái: máy chủ mới là nơi biết sự thật, và
     chính lượt hỏi này bật/tắt lại cái nút cho đúng. */
  hoiDongBo();
};
$('#qSoLuong').addEventListener('change', function(){ Q_LUONG_TAY = true; });
$('#qTamDungHet').onclick = function(){ doiCo('tam-dung', { tat_ca: true }, this); };
$('#qTiepHet').onclick = function(){ doiCo('tiep-tuc', { tat_ca: true }, this); };
$('#qDungHan').onclick = async function(){
  if (!DB_CUOI || !DB_CUOI.dot_mo) return;
  if (!confirm(tt('q_hoi_dung'))) return;
  this.disabled = true;
  try {
    var r = await fetch('/crm/face-match/dong-bo/dung', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ run_id: Number(DB_CUOI.dot_mo) }) });
    var j = await r.json().catch(function(){ return null; });
    $('#dbChu').textContent = (r.ok && j) ? fmt('q_da_dung', { n: j.da_nha }) : tt('q_hong');
  } catch (e){ $('#dbChu').textContent = tt('q_hong'); }
  hoiDongBo();
};
hoiDongBo();

/* Tab mở đầu do URL quyết định (D106). `?anh=` mở thẳng tấm (D107) — sau khi
   lưới đã nạp, vì nút «Về lưới ảnh» cần chỗ quay về. */
history.replaceState({ tab: tabTuUrl() }, '', location.pathname + location.search);
if (tabTuUrl() === 'khach' && !qAnh){ TU_DAU = 'khoi'; hienMan('manKhach'); veKhoi(); }
else veLuoi()
  .catch(function(){ $('#anhTom').textContent = tt('loi_nap'); })
  .then(function(){ if (qAnh) return moAnh(qAnh, 'luoi'); })
  .catch(function(){ hienMan('manAnh'); $('#anhTom').textContent = tt('loi_nap'); });
</script>
