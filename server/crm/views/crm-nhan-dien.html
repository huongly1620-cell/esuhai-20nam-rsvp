<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ảnh sự kiện · ESUHAI 20 năm</title>
<style>
  :root{
    --bg1:#050b14;--bg2:#071019;--panel:rgba(255,255,255,.05);--panel2:rgba(7,16,27,.66);
    --text:#f4eede;--muted:#aca592;--line:rgba(224,189,119,.16);--line2:rgba(224,189,119,.32);
    --gold:#e0bd77;--ok:#43e08d;--bad:#e05a5a;--fs-small:.72rem;--fs-micro:.66rem;
  }
  :root[data-theme=light]{
    --bg1:#f7f3e8;--bg2:#efe8d6;--panel:rgba(255,255,255,.75);--panel2:rgba(255,255,255,.92);
    --text:#2a2418;--muted:#6d6552;--line:rgba(120,92,36,.18);--line2:rgba(120,92,36,.34);--gold:#a97f2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",system-ui,Arial,sans-serif;
    color:var(--text);background:linear-gradient(166deg,var(--bg1),var(--bg2));min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:1.05rem;margin:0;font-weight:700}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;
    padding:8px 13px;font:inherit;font-size:.82rem;cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--gold)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{padding:5px 10px;font-size:var(--fs-small)}
  .btn.ok{border-color:rgba(67,224,141,.5);color:var(--ok)}
  .btn.bad{border-color:rgba(224,90,90,.5);color:#ffb3b3}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:var(--fs-small)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:13px}
  input[type=search],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:9px 12px;font:inherit;font-size:.85rem;width:100%}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:.85rem}
  th{color:var(--muted);font-size:var(--fs-small);font-weight:600}
  tr.kh{cursor:pointer}
  tr.kh:hover{background:var(--panel2)}
  .dem{display:inline-block;min-width:26px;text-align:center;border-radius:999px;padding:2px 8px;
    font-size:var(--fs-micro);border:1px solid var(--line2)}
  .dem.co{background:rgba(67,224,141,.14);border-color:rgba(67,224,141,.4);color:var(--ok)}
  .dem.cho{background:rgba(224,189,119,.14);border-color:var(--line2);color:var(--gold)}
  .canh{color:var(--bad);font-size:var(--fs-micro)}
  /* E08-D102 · lưới ảnh là màn chính. minmax nhỏ hơn bản D077 (150→120) vì ở 360px
     một cột 150 cộng khe cộng padding vẫn vừa, nhưng hai cột thì tràn — mà lưới một
     cột thì không còn là lưới. 120 cho đúng hai cột ở 360px. */
  .luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .o{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel2)}
  .o img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
  button.o{padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
  button.o:hover{border-color:var(--gold)}
  /* Hai dấu trên ô lưới. Chữ nghĩa của chúng nằm ở dòng chú giải phía trên lưới,
     không nhét vào `title`: chuỗi trong title không đổi theo ngôn ngữ nếu quên
     dịch, và AC-7 quét đúng chỗ đó.

     Tên `.hieu` chứ KHÔNG phải `.co` (Gate 2 D103 · N1). Bản D102 đặt tên nó là
     `.co`, trùng với `.co` vốn đã là bổ nghĩa MÀU của `.dem` ở trên. Hệ quả: mọi
     `<span class="dem co">` — số «trong album» của khối, và dấu ✓ trong trang xem
     ảnh — nuốt luôn `position:absolute; top:6px`. Không có tổ tiên nào được định
     vị nên chúng neo theo TRANG: chồng lên nhau ở góc trên, đè nút «← Về CRM», và
     biến mất khỏi hàng số của khối. Một tên class dùng cho hai nghĩa thì lỗi không
     nằm ở chỗ ta sửa mà ở chỗ khác — nên đổi tên, không vá bằng position:relative. */
  .hieu{position:absolute;top:6px;border-radius:999px;font-size:var(--fs-micro);
    padding:2px 7px;border:1px solid;backdrop-filter:blur(3px)}
  .hieu.cho{right:6px;background:rgba(224,189,119,.82);border-color:var(--gold);color:#231a06}
  .hieu.alb{left:6px;background:rgba(67,224,141,.82);border-color:var(--ok);color:#04240f}
  .chip{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:999px;
    padding:6px 13px;font:inherit;font-size:var(--fs-small);cursor:pointer}
  /* E08-D106 · chip tab Kho là <a>, không phải <button>: nó rời tài liệu này. Mặc
     định của trình duyệt cho <a> khác <button> ở ba chỗ (gạch chân, màu link,
     line-height) nên phải nói lại cả ba, không thì ba chip cùng hàng cao thấp
     khác nhau. `aria-current` chứ không `aria-pressed`: link không có trạng thái
     nhấn, nó có trạng thái "đang ở đây". */
  a.chip{text-decoration:none;display:inline-flex;align-items:center;line-height:1.45}
  .chip[aria-pressed=true],.chip[aria-current=page]{background:rgba(224,189,119,.18);
    border-color:var(--gold);color:var(--gold)}
  /* `.tab` = THANH BA TAB của trang, đúng một chỗ trên trang này. Hàng chip lọc bên
     trong mỗi tab mang tên riêng `.hang-loc` (E08-D106). Bản D102 cho cả hai đeo
     chung tên `.tab`: đọc thì thấy ba hàng chip giống nhau, mà chỉ một hàng đổi
     TAB còn hai hàng kia đổi BỘ LỌC trong tab. Đúng bài N1 của Gate 2 D103 — một
     tên mang hai nghĩa thì phép quét DOM (AC-2b) không phân biệt được «tab» với
     «bộ lọc», và người sửa sau cũng vậy. */
  .tab{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
  .hang-loc{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  /* ── E08-D103 · khối theo khách ──────────────────────────────────────────
     Hai trạng thái phải phân biệt được BẰNG MẮT và BẰNG CHỮ (FR-2). Chỉ đổi màu
     là chưa đủ: người mù màu đọc viền vàng thành viền xanh, mà nhầm chiều này
     nghĩa là khách B nhận ảnh khách A. Nên mỗi tấm mang cả viền, cả nhãn chữ. */
  .khoi{border-color:var(--line2)}
  .khoi h3{margin:0;font-size:.95rem;font-weight:700;word-break:break-word}
  /* Con số và nhãn của nó là MỘT khối không tách. Bản đầu để chúng là bốn phần tử
     rời trong một hàng flex-wrap: ở 360px hàng gãy giữa chừng, "6" ở lại dòng trên
     còn "trong album" rơi xuống cạnh "9" — hai con số đổi nhãn cho nhau trước mắt
     người đọc. Không tràn ngang nên phép đo scrollWidth vẫn xanh; chỉ nhìn mới thấy. */
  .khoi-so{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 9px}
  .cap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .anh-o{position:relative;border-radius:11px;overflow:hidden;background:var(--panel2);
    border:2px solid transparent}
  .anh-o img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
  .anh-o.alb{border-color:var(--ok)}
  .anh-o.cho{border-color:var(--gold)}
  .nhan{position:absolute;left:0;right:0;bottom:0;font-size:var(--fs-micro);
    padding:3px 6px;text-align:center;font-weight:600}
  .anh-o.alb .nhan{background:rgba(67,224,141,.86);color:#04240f}
  .anh-o.cho .nhan{background:rgba(224,189,119,.86);color:#231a06}
  /* Ô tick phải to và dễ chạm: đây là cử chỉ bắt buộc trước mọi lượt duyệt, làm
     nó bé là dồn người dùng đi tìm nút tắt — mà nút tắt là thứ vé này cấm. */
  .tick{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:7px;
    background:rgba(7,16,27,.72);border:1px solid var(--line2);display:flex;
    align-items:center;justify-content:center;cursor:pointer}
  .tick input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;margin:0}
  .anh-o.daChon{box-shadow:0 0 0 3px rgba(224,189,119,.5)}
  /* E08-D105 · mức giống, góc phải trên. Tên riêng `.giong`, KHÔNG mượn `.dem` hay
     `.hieu` — bài học N1: một class mang hai nghĩa thì lỗi hiện ra ở chỗ khác.
     `.anh-o` đã là position:relative nên chip neo trong đúng tấm của nó. */
  .giong{position:absolute;top:5px;right:5px;max-width:calc(100% - 42px);
    border-radius:999px;font-size:var(--fs-micro);padding:2px 7px;
    background:rgba(7,16,27,.78);border:1px solid var(--line2);color:var(--muted);
    backdrop-filter:blur(3px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Chỉ dải chắc nhất mới đổi màu. Tô ba màu khác nhau là dựng lại một thang điểm
     bằng màu, mà thang ấy chính là thứ người chấm không nên bị neo vào. */
  .giong.chac{color:var(--gold);border-color:var(--gold)}
  .mo-them{display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed var(--line2);border-radius:11px;background:transparent;
    color:var(--gold);font:inherit;font-size:var(--fs-small);cursor:pointer;padding:8px;
    aspect-ratio:4/3}
  .mo-them:hover{background:var(--panel2)}
  .thanhChon{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px;
    padding-top:10px;border-top:1px solid var(--line)}
  .chonHet{display:flex;gap:8px;align-items:center;font-size:var(--fs-small);
    color:var(--muted);cursor:pointer}
  .chonHet input{width:16px;height:16px;accent-color:var(--gold)}
  /* Khung mặt vẽ CHỒNG lên ảnh gốc. Cố ý không cắt-và-lưu ảnh mặt: mỗi tấm mặt
     lưu ra là một bản sao dữ liệu sinh trắc phải nhớ mà xoá (AC-13). Không tạo
     thì không phải xoá. */
  .khung{position:absolute;border:2px solid var(--gold);border-radius:3px;pointer-events:none}
  .khung.chon{border-color:var(--ok);box-shadow:0 0 0 2px rgba(67,224,141,.35)}
  .khung.tron{border-color:rgba(255,255,255,.34);border-style:dashed}
  .anhto{position:relative;display:inline-block;max-width:100%}
  .anhto img{max-width:100%;display:block;border-radius:11px}
  .goi{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .goi b{word-break:break-word}
  /* E08-D106 · AC-11 (G6, QC D103 v2 ghi sổ) — hàng «Đã gắn tên trong ảnh này».
     Dấu ✓ thuộc về CÁI TÊN, không phải về hàng. Bản trước để tên, đơn vị và ✓ là
     ba con rời của một hàng `flex-wrap:wrap`: ở 360px một tên dài + đơn vị dài đẩy
     ✓ rơi xuống dòng riêng, nơi nó nằm ngay trên tên của người KẾ TIẾP — người đọc
     thấy một dấu xác nhận không rõ đang xác nhận ai.
     Không dùng `white-space:nowrap` cho cả hàng: tên vẫn PHẢI được ngắt dòng trong
     cột của nó, chỉ có ✓ là không được rời khỏi hàng. Nên: hàng nowrap, cột tên co
     được (`min-width:0` — thiếu nó thì cột flex không co dưới nội dung và hàng
     tràn ngang, hỏng AC-8), ✓ cố định bên phải. */
  .goi.da{flex-wrap:nowrap;align-items:flex-start}
  .goi.da .ten{flex:1 1 auto;min-width:0}
  .goi.da .dem{flex:0 0 auto;margin-left:auto}
  .diem{font-size:var(--fs-small);color:var(--gold)}
  .diem.vua{color:var(--muted)}
  .ta{position:relative}
  .ta-ds{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel2);
    border:1px solid var(--line2);border-radius:10px;max-height:220px;overflow:auto}
  .ta-ds div{padding:8px 11px;cursor:pointer;font-size:.85rem}
  .ta-ds div:hover{background:var(--panel)}
  .an{display:none}
  /* Chế độ khoanh: con trỏ đổi để người dùng biết cú kéo tới sẽ vẽ khung chứ
     không phải cuộn trang — không có dấu hiệu này thì cú kéo đầu tiên luôn hỏng. */
  .anhto.khoanh{cursor:crosshair;touch-action:none}
  .anhto.khoanh img{user-select:none;-webkit-user-drag:none}
  .khung.moi{border-color:var(--ok);border-style:dashed}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="btn sm" id="veCrm">← <span data-i="ve_crm">Về CRM</span></button>
    <h1 data-i="tieu_de">📸 Ảnh sự kiện</h1>
    <span class="hint" id="meRole"></span>
    <div class="spacer"></div>
    <button class="btn sm" id="langBtn">日本語</button>
    <button class="btn sm" id="themeBtn">☽</button>
  </div>

  <!-- E08-D102 (CR-159) · Ảnh đứng trước: người làm việc ở đây nhìn một khung hình
       rồi nói "đây là ai", chứ không mở sổ tên rồi đi tìm ảnh. Lối theo khách vẫn
       còn nguyên cho việc ngược lại — soát album của một người.

       E08-D106 · thêm tab KHO vào cùng thanh này. Kho là một tài liệu khác nên chip
       của nó là <a> — điều hướng thật, có địa chỉ thật, mở tab mới được bằng chuột
       giữa. Hai chip còn lại là <button> vì chúng đổi màn TRONG tài liệu này.
       Nhãn của chip Phân loại KHÔNG còn là «Ảnh sự kiện»: chữ đó giờ là tên của cả
       trang (h1). Một chữ mang hai nghĩa thì người đọc phải đoán nghĩa nào — cùng
       bài học N1 của D103, lần đó là tên class, lần này là nhãn UI. -->
  <div class="tab" id="thanhTab">
    <a class="chip" id="tabKho" href="/crm/anh-su-kien/kho" data-i="tab_kho">Kho</a>
    <button class="chip" id="tabAnh" aria-pressed="true" data-i="tab_anh">Phân loại</button>
    <button class="chip" id="tabKhach" aria-pressed="false" data-i="tab_khach">Theo khách</button>
  </div>

  <!-- ══ HOME: LƯỚI ẢNH ══ -->
  <div id="manAnh">
    <div class="card">
      <div class="hang-loc">
        <button class="chip loc" data-loc="tat-ca" aria-pressed="true" data-i="loc_tat">Tất cả</button>
        <button class="chip loc" data-loc="co-goi-y" aria-pressed="false" data-i="loc_goi">Máy có gợi ý chờ duyệt</button>
        <button class="chip loc" data-loc="chua-album" aria-pressed="false" data-i="loc_chua">Chưa gắn tên ai</button>
      </div>
      <p class="hint" id="anhTom" style="margin:0"></p>
      <p class="hint" id="chuGiai" style="margin:6px 0 0"></p>
    </div>
    <div class="luoi" id="luoiAnh"></div>
    <div class="top" style="justify-content:center;margin-top:13px">
      <button class="btn" id="taiThem" data-i="tai_them">Xem thêm ảnh</button>
    </div>
  </div>

  <!-- ══ XEM MỘT ẢNH: gắn tên, duyệt gợi ý, khoanh mặt ══ -->
  <div id="manXem" class="an">
    <div class="card top" style="margin-bottom:13px">
      <button class="btn sm" id="veLuoi">← <span data-i="ve_luoi">Lưới ảnh</span></button>
      <div class="spacer"></div>
      <span class="hint" id="xemTom"></span>
    </div>
    <div class="card" id="theAnh">
      <div class="anhto" id="anhTo"></div>
      <p class="hint khoanhHuong an" style="margin:8px 0 0"></p>
      <!-- Chỗ báo kết quả của trang xem. Tách khỏi `#xemTom` (dòng đếm) vì mỗi lần
           vẽ lại đều ghi đè `#xemTom`, mà lời báo phải sống qua đúng lượt vẽ ấy. -->
      <p class="hint" id="baoXem" style="margin:6px 0 0"></p>

      <div id="dsGoi"></div>

      <div class="goi" style="border-bottom:0;padding-top:11px">
        <span class="hint" data-i="gan_tay">Gắn tên khách vào ảnh này</span>
        <div class="ta" style="flex:1;min-width:200px">
          <input type="text" class="ganO" id="ganO"><div class="ta-ds an"></div>
        </div>
        <button class="btn sm" id="nutKhoanh" data-i="khoanh">✏️ Khoanh mặt làm ảnh mẫu</button>
      </div>
    </div>
  </div>

  <!-- ══ TAB THEO KHÁCH = KHỐI ẢNH MỖI KHÁCH (E08-D103 · CR-160) ══
       Thay cho bảng tên của D102. Bảng ấy ghi đúng "124" cho Ông Lê Văn Ngỡi rồi
       bấm vào lại ra màn trắng, vì album chỉ đếm ảnh ĐÃ xác nhận còn 124 kia là
       ảnh máy đang đoán — không còn lối nào xem chúng theo khách. Khối hiện cả
       hai trạng thái cạnh nhau nên con số và thứ nhìn thấy luôn nói cùng một điều. -->
  <div id="manKhach" class="an">
    <div class="card">
      <div class="hang-loc">
        <button class="chip lock" data-lock="co-goi-y" aria-pressed="true" data-i="lk_cho">Khách đang có ảnh chờ duyệt</button>
        <button class="chip lock" data-lock="co-album" aria-pressed="false" data-i="lk_album">Khách đã có ảnh trong album</button>
        <button class="chip lock" data-lock="tat-ca" aria-pressed="false" data-i="lk_tat">Tất cả khách</button>
      </div>
      <input type="search" id="timKhach">
      <p class="hint" id="khoiTom" style="margin:9px 0 0"></p>
      <p class="hint" id="khoiChu" style="margin:6px 0 0"></p>
    </div>
    <div id="dsKhoi"></div>
    <div class="top" style="justify-content:center;margin-top:13px">
      <button class="btn" id="khoiThem" data-i="khoi_them">Xem thêm khách</button>
    </div>
  </div>

  <!-- ══ MÀN MỘT KHÁCH — TOÀN BỘ ảnh của người đó, phân trang (FR-4) ══ -->
  <div id="manMotKhach" class="an">
    <div class="card top" style="margin-bottom:13px">
      <button class="btn sm" id="veKhoi">← <span data-i="ve_khoi">Khối theo khách</span></button>
      <strong id="tenMotKhach"></strong>
      <div class="spacer"></div>
      <span class="hint" id="tomMotKhach"></span>
    </div>
    <div class="card">
      <p class="hint" id="chuMotKhach" style="margin:0 0 9px"></p>
      <label class="chonHet"><input type="checkbox" id="chonHetTrang">
        <span id="nhanChonHet"></span></label>
      <div class="luoi" id="anhMotKhach" style="margin-top:10px"></div>
      <div class="top" style="justify-content:center;margin-top:12px">

/* E08-D106 · ngôn ngữ và theme là của NGƯỜI, không của trang. Ba tab giờ là MỘT
   trang trước mắt người dùng, nhưng vẫn là hai tài liệu HTML: mỗi tài liệu giữ một
   khoá riêng thì bật 日本語 ở tab Phân loại, sang tab Kho lại thấy tiếng Việt —
   người dùng đọc đó là "nút ngôn ngữ hỏng", không phải "hai trang".
   Đây KHÔNG phải luật mới: Sponsor đã chốt 09/08 «trang trước là ngôn ngữ gì thì
   qua trang khác cũng phải vậy» và /crm + hai cửa đã gom về `esuhai_lang`
   (crm-app-v2.html:699). Trang này với kho-anh là hai chỗ chưa di trú theo.
   Khoá cũ `nd_*` chỉ còn được ĐỌC, cho ai đã chọn trước D106; không ghi vào nữa. */
function nhoCu(chung, cu){ var v = localStorage.getItem(chung); return v == null ? localStorage.getItem(cu) : v; }
var LANG = nhoCu('esuhai_lang', 'nd_lang') === 'jp' ? 'jp' : 'vn';
function tt(k){ return (T[LANG] && T[LANG][k]) || T.vn[k] || k; }
function fmt(k,o){ var s = tt(k); for (var i in o) s = s.split('{'+i+'}').join(o[i]); return s; }
function setLang(l){
  LANG = l; localStorage.setItem('esuhai_lang', l);
  document.documentElement.lang = l === 'jp' ? 'ja' : 'vi';
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = tt(el.getAttribute('data-i')); if (v) el.textContent = v; });
  $('#langBtn').textContent = l === 'jp' ? 'Tiếng Việt' : '日本語';
  $('#timKhach').placeholder = tt('tim_ph');
  $('#ganO').placeholder = tt('gan_ph');
  $('#chuGiai').textContent = tt('chu_giai');
  /* Vẽ lại đúng màn đang mở. Không gọi hết mọi hàm vẽ: màn đang ẩn mà vẫn nạp lại
     là mỗi lần đổi ngôn ngữ lại bắn ba yêu cầu mạng không ai nhìn. */
  if (!DA_NAP) return;
  /* E08-D109 · đổi ngôn ngữ làm HỎNG mọi DOM đang được giữ lại. Bốn dòng dưới chỉ
     vẽ lại màn ĐANG HIỆN; từ vé này, `#dsKhoi` và `#manMotKhach` còn sống cả khi bị
     giấu, nên chữ vẽ bằng ngôn ngữ cũ nằm lại trong đó — bấm 日本語 ở màn một khách
     rồi «Khối theo khách» là thấy cả list tiếng Việt. Cùng đúng lý do `hienMan` xoá
     ruột màn xem (:449): người dùng không thấy chữ cũ, nhưng nó vẫn ở đó và mọi
     phép quét ngôn ngữ đều vấp phải. Đánh dấu cũ = lượt «về» tới sẽ nạp lại đúng
     ngôn ngữ, đổi lấy việc mất chỗ cuộn — đúng thứ tự ưu tiên: đọc được trước, tiện
     sau. Không tự gọi vẽ lại ở đây: màn đang giấu mà nạp lại là bắn yêu cầu mạng
     không ai nhìn, đúng điều chú thích ngay dưới đã cấm. */
  KHOI_CU = true;
  $('#manMotKhach').removeAttribute('data-gid');
  $('#manMotKhach').removeAttribute('data-offset');
  if (!$('#manAnh').classList.contains('an')) veLuoi();
  else if (!$('#manXem').classList.contains('an')) moAnh(ANH_DANG);
  else if (!$('#manKhach').classList.contains('an')) veKhoi();
  else if (!$('#manMotKhach').classList.contains('an')) moMotKhach(KHACH_DANG, KHACH_OFFSET);
}
function apDungTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('crm_theme', t || ''); $('#themeBtn').innerHTML = t ? '☀' : '☽'; }

async function jget(u){ var r = await fetch(u); if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function jpost(u,b,m){ var r = await fetch(u,{ method: m||'POST',
  headers:{'content-type':'application/json'}, body: b?JSON.stringify(b):undefined });
  if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

/* N1 (Gate 2 vòng 1) · ĐÓNG chế độ khoanh — trạng thái DOM lẫn trạng thái JS.
   Vì sao phải gom vào một hàm và gọi ở HAI chỗ: khung đang vẽ nằm bên trong
   `#anhTo`, mà `#anhTo` bị dựng lại nguyên khối mỗi lần moAnh() chạy. Khung biến
   mất khỏi màn hình, nhưng `dataset.box` thì không — và ô typeahead phân nhánh
   dựa trên đúng `dataset.box` ấy. Còn sót nó thì cú chọn tên kế tiếp không GẮN
   TÊN mà lại GHI MỘT ẢNH MẪU, với khung của tấm trước, dưới tên người đang đăng
   nhập. Album không tăng, người dùng tưởng đã gắn, còn khớp khách thì bị đầu độc
   bằng một khuôn mặt không phải của ai cả.
   Rộng hơn phiếu một nhịp: phiếu đòi reset khi RỜI trang xem, nhưng cùng một tấm
   cũng rò — vẽ khung xong bấm "Đúng người này" là `#anhTo` dựng lại ngay. Nên
   trạng thái khoanh đi theo vòng đời của `#anhTo`, không theo vòng đời màn hình. */
function dongKhoanh(){
  KHUNG_MOI = null;
  var the = $('#theAnh'), anh = $('#anhTo');
  delete the.dataset.box;
  anh.classList.remove('khoanh');
  var k = anh.querySelector('.khung.moi'); if (k) k.remove();
  $('#nutKhoanh').textContent = tt('khoanh');
  var hg = the.querySelector('.khoanhHuong');
  hg.classList.add('an'); hg.textContent = '';
}

function hienMan(id){
  ['manAnh','manXem','manKhach','manMotKhach'].forEach(function(m){
    document.getElementById(m).classList.toggle('an', m !== id); });
  /* Rời trang xem thì XOÁ nội dung của nó, không chỉ giấu đi. Hai lý do:
     ảnh preview cỡ lớn thôi nằm trong bộ nhớ; và chữ đã vẽ bằng ngôn ngữ cũ thôi
     nằm lại trong DOM — người dùng không thấy, nhưng mọi phép quét chuỗi (AC-7)
     đều vấp phải nó và không có cách nào phân biệt với lỗi dịch thật. */
  if (id !== 'manXem'){
    $('#anhTo').innerHTML = ''; $('#dsGoi').innerHTML = '';
    $('#xemTom').textContent = ''; $('#ganO').value = '';
    $('#baoXem').textContent = '';
    dongKhoanh();
  }
  /* Trang xem một ảnh không phải một tab — nó là màn con của tab mà người dùng ĐI
     TỪ ĐÓ vào. D103 gán cứng nó cho tab Phân loại; từ D106 URL cũng nói tab đang
     mở, nên gán cứng như thế là chip và thanh địa chỉ nói hai điều khác nhau khi
     người ta mở một tấm từ tab Theo khách. `TU_DAU` đã ghi sẵn lối vào ấy (nó
     được đặt TRƯỚC hienMan trong moAnh) — đọc nó, đừng đoán. */
  var xemTuLuoi = (id === 'manXem') && TU_DAU === 'luoi';
  $('#tabAnh').setAttribute('aria-pressed', String(id === 'manAnh' || xemTuLuoi));
  $('#tabKhach').setAttribute('aria-pressed',
    String(id === 'manKhach' || id === 'manMotKhach' || (id === 'manXem' && !xemTuLuoi)));
}

/* ══════════ E08-D106 · FR-5 — URL nói đúng tab đang mở ══════════
   Chỉ TAB vào lịch sử, không phải từng màn con. Mở một tấm ảnh hay một khách là đi
   sâu TRONG một tab; nếu đẩy cả màn con vào lịch sử thì nút Back của điện thoại
   thành nút "lùi một cú bấm", và người ta bấm Back để đóng ảnh lại rơi ra khỏi
   trang. Tab Kho nằm ở tài liệu khác nên nó là <a> — lịch sử của nó do trình duyệt
   lo, ta không đụng. */
var URL_TAB = { anh: '/crm/anh-su-kien', khach: '/crm/anh-su-kien/theo-khach' };
function tabTuUrl(){ return location.pathname.indexOf('/theo-khach') > -1 ? 'khach' : 'anh'; }
function moTab(tab, day){
  if (tab === 'khach'){ TU_DAU = 'khoi'; hienMan('manKhach'); veKhoi(); }
  else { TU_DAU = 'luoi'; hienMan('manAnh'); veLuoi(); }
  if (day && location.pathname !== URL_TAB[tab]) history.pushState({ tab: tab }, '', URL_TAB[tab]);
}
window.addEventListener('popstate', function(){ moTab(tabTuUrl(), false); });

var LOC = 'tat-ca', ANH = [], TONG = 0, ANH_DANG = null;
/* Nhớ lối vào để nút quay lại trả người dùng về đúng chỗ họ vừa rời: mở ảnh từ
   album của một khách rồi bị đẩy ra lưới 3 479 tấm là mất chỗ đang soát. */
var TU_DAU = 'luoi';
/* ══ E08-D109 · «về đúng chỗ vừa rời» cần ba mẩu, không chỉ một cái nhãn nút ══
   Nhãn nút đã đúng từ D103, nhưng cú bấm thì gọi `veKhoi()` — hỏi lại máy chủ và
   thay sạch `#dsKhoi`. Người dùng mất HAI thứ trong một cú: chỗ đang cuộn (về 0)
   và mọi ô đã tick (checkbox mới dựng thì không có cái nào `checked`). Người đang
   soát khối thứ chín, tick sáu tấm, mở một tấm ra xem cho chắc — quay về là mất
   cả sáu cú tick lẫn chỗ đứng. `hienMan` vốn chỉ GIẤU `#manKhach` chứ không xoá,
   nên DOM cũ còn nguyên: thứ phá nó là chính lời gọi vẽ lại, không phải việc đổi
   màn. Nhớ chỗ cuộn + khối vừa mở, rồi hiện lại đúng DOM ấy.
   `KHOI_CU` là lối thoát trung thực cho trường hợp KHÔNG vá được bằng một ô: gắn
   tên tay trên màn xem tạo một dòng album cho khách có thể đang nằm trong list —
   không có `data-cid` nào trên màn khối để sửa. Đánh dấu cũ rồi nạp lại lúc về
   còn hơn hiện một con số biết chắc là sai. */
var SCROLL_KHOI = 0, SCROLL_KHACH = 0, GID_TU_TAM = null, KHOI_CU = false;
/* Chưa nạp lần nào thì setLang không được vẽ lại — nếu không, mỗi lần khởi động
   trang bắn hai lượt yêu cầu y hệt nhau, một từ setLang một từ dòng gọi cuối file. */
var DA_NAP = false;

async function veLuoi(noiTiep){
  var offset = noiTiep ? ANH.length : 0;
  var j = await jget('/crm/face-match/photos?filter=' + encodeURIComponent(LOC)
    + '&limit=60&offset=' + offset);
  ANH = noiTiep ? ANH.concat(j.items || []) : (j.items || []);
  TONG = j.tong || 0;
  $('#anhTom').textContent = ANH.length ? fmt('anh_tom', { n: TONG, c: ANH.length }) : tt('anh_rong');
  $('#luoiAnh').innerHTML = ANH.map(function(a){
    return '<button class="o" data-anh="' + a.id + '">'
      + '<img loading="lazy" src="' + a.thumb_url + '" alt="' + esc(tt('anh_alt')) + '">'
      + (a.so_cho ? '<span class="hieu cho">' + a.so_cho + '</span>' : '')
      + (a.so_album ? '<span class="hieu alb">✓</span>' : '')
      + '</button>';
  }).join('');
  var het = ANH.length >= TONG;
  $('#taiThem').disabled = het;
  $('#taiThem').textContent = het ? tt('het_anh') : tt('tai_them');
  DA_NAP = true;
}

/* ══════════ XEM MỘT ẢNH (FR-H2 / H3 / H6) ══════════ */
/* Điểm giống nhau hiện bằng CHỮ chứ không phải số thập phân. Người ngồi duyệt cần
   biết "có nên tin không", không cần biết 0.512; và FR-H5 cấm chữ kỹ thuật trên
   giao diện. Ba mốc lấy đúng từ phân bố thật của kho: ≥0,55 là vùng chắc (473/853
   gợi ý), 0,50–0,55 vùng giữa, dưới đó là sát ngưỡng 0,45. */
function chuGiong(s){
  if (s == null) return '';
  return s >= 0.55 ? tt('rat_giong') : (s >= 0.5 ? tt('kha_giong') : tt('hoi_giong'));
}
function tenKh(x){ return (LANG==='jp' && x.name_jp ? x.name_jp : x.full_name) || ''; }

async function moAnh(id, tuDau){
  if (!id) return;
  ANH_DANG = id;
  /* Ghi chỗ cuộn TRƯỚC khi đổi màn, và chỉ khi đây là một lượt MỞ thật (có
     `tuDau`). `moAnh(ANH_DANG)` không tham số còn được gọi để vẽ lại chính tấm
     đang mở — lúc ấy `scrollY` là của màn xem, ghi đè vào đây là ghi nhầm chỗ
     đứng của màn kia. */
  if (tuDau === 'khoi') SCROLL_KHOI = window.scrollY;
  else if (tuDau === 'khach') SCROLL_KHACH = window.scrollY;
  if (tuDau) TU_DAU = tuDau;
  hienMan('manXem');
  /* Đổi ảnh (hoặc vẽ lại chính tấm này) = `#anhTo` bị dựng lại → khung đang vẽ
     mất theo. Trạng thái khoanh phải chết cùng nó, xem dongKhoanh(). */
  dongKhoanh();
  $('#baoXem').textContent = '';
  $('#veLuoi').querySelector('span').textContent = tt(
    TU_DAU === 'khach' ? 've_khach_lai' : (TU_DAU === 'khoi' ? 've_khoi_lai' : 've_luoi'));
  var j = await jget('/crm/face-match/photo/' + id + '/faces');
  var mat = j.items || [], goi = j.goi_y || [], alb = j.album || [];
  /* Kích thước lấy từ chính phản hồi, không nhặt lại từ mảng lưới: mở ảnh từ album
     thì mảng đó không có tấm này. */
  var W = Number(j.anh && j.anh.width) || 0, H = Number(j.anh && j.anh.height) || 0;
  $('#xemTom').textContent = fmt('xem_tom', { m: mat.length, g: goi.length, a: alb.length });

  /* Khung vẽ theo TỈ LỆ so với ảnh gốc, không theo pixel: ảnh hiển thị đã co lại,
     mà toạ độ trong CSDL là của ảnh gốc. */
  function oKhung(f, lop){
    if (!f.box_w || !W || !H) return '';
    return '<i class="khung ' + lop + '" style="left:' + (f.box_x/W*100).toFixed(2) + '%;top:'
      + (f.box_y/H*100).toFixed(2) + '%;width:' + (f.box_w/W*100).toFixed(2) + '%;height:'
      + (f.box_h/H*100).toFixed(2) + '%"></i>';
  }
  var coGoi = {}; goi.forEach(function(c){ if (c.face_id) coGoi[c.face_id] = 1; });
  var daXn = {}; alb.forEach(function(c){ if (c.face_id) daXn[c.face_id] = 1; });
  var khung = mat.map(function(f){
    return oKhung(f, daXn[f.id] ? 'chon' : (coGoi[f.id] ? '' : 'tron')); }).join('');

  $('#anhTo').innerHTML = '<img src="/crm/event-photos/' + id + '/preview" alt="'
    + esc(tt('anh_alt')) + '">' + khung;
  $('#theAnh').setAttribute('data-anh', id);
  $('#theAnh').setAttribute('data-w', W);
  $('#theAnh').setAttribute('data-h', H);

  var html = '';
  if (alb.length){
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('da_gan')) + '</p>';
    /* AC-11 · tên + đơn vị nằm trong MỘT cột co được, ✓ là con thứ hai của hàng.
       Bản trước dùng `<div class="spacer">` đẩy ✓ sang phải — spacer là phần tử
       thứ ba, và ở 360px chính nó là chỗ hàng gãy. */
    html += alb.map(function(c){
      return '<div class="goi da"><span class="ten"><b>' + esc(tenKh(c)) + '</b>'
        + (c.org ? ' <span class="hint">' + esc(c.org) + '</span>' : '')
        + '</span><span class="dem co">✓</span></div>'; }).join('');
  }
  if (goi.length){
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('may_goi')) + '</p>';
    html += goi.map(function(c){
      var m = c.score != null && c.score >= 0.55;
      return '<div class="goi" data-cid="' + c.id + '">'
        + '<b>' + esc(tenKh(c)) + '</b>'
        + (c.org ? ' <span class="hint">' + esc(c.org) + '</span>' : '')
        + '<span class="diem' + (m ? '' : ' vua') + '">' + esc(chuGiong(c.score)) + '</span>'
        + '<div class="spacer"></div>'
        + '<button class="btn sm ok" data-do="confirm">' + esc(tt('xac_nhan')) + '</button>'
        + '<button class="btn sm bad" data-do="reject">' + esc(tt('tu_choi')) + '</button>'
        + '<button class="btn sm" data-do="skip">' + esc(tt('bo_qua')) + '</button></div>';
    }).join('');
  } else {
    html += '<p class="hint" style="margin:11px 0 0">' + esc(tt('chua_goi')) + '</p>';
  }
  $('#dsGoi').innerHTML = html;
}

/* Sau mỗi cú bấm: vẽ lại chính tấm đang mở. Con số trên ô lưới không phải sửa tay
   ở đây — nút quay lại luôn gọi veLuoi(), tức hỏi lại máy chủ, nên dấu trên lưới
   không thể lệch với thứ vừa quyết. */
async function lamMoiAnhDang(){ await moAnh(ANH_DANG); }

/* ══════════ TAB THEO KHÁCH = KHỐI ẢNH (E08-D103) ══════════ */
var LOC_KHOI = 'co-goi-y', KHOI = [], KHOI_TONG = 0, KHACH_DANG = null;
/* Màn một khách: cỡ trang do MÁY CHỦ cắt, không phải trình duyệt. «Đang hiện» của
   ràng buộc precision được khoá ở Gate 1 nghĩa là ĐÚNG trang này — nếu ta tự cắt
   từ một mảng lớn hơn đã tải sẵn thì «chọn tất cả trên trang» lại phủ cả thứ người
   dùng chưa từng nhìn, tức đúng thứ vé này sinh ra để cấm. */
var TRANG_KHACH = 24, KHACH_OFFSET = 0, KHACH_DL = null;

/* Trạng thái tick đọc THẲNG từ DOM của phạm vi đang xét, không giữ trong một tập
   riêng. Cố ý: một tập nhớ ngoài DOM sẽ sống sót qua lượt vẽ lại và qua chuyển
   trang, tức đúng cái cửa hậu cho phép duyệt tấm không còn trên màn. Đọc từ DOM
   thì «đang tick» không thể rộng hơn «đang hiện».
   Chỉ dòng `cho` có ô tick — ảnh đã vào album coi như đã quyết xong; «gỡ khỏi
   album» là việc khác, không thuộc vé này. */
function demTick(pham){
  var n = 0;
  document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked').forEach(function(){ n++; });
  return n;
}
function idsTick(pham){
  var ra = [];
  document.querySelectorAll(pham + ' .anh-o[data-cid] input:checked').forEach(function(o){
    ra.push(Number(o.closest('.anh-o').getAttribute('data-cid'))); });
  return ra;
}

/* Một tấm trong khối. `cho` mới có ô tick; cả hai đều có viền RIÊNG và nhãn CHỮ. */
function veTam(x){
  var la = x.trang_thai === 'xac-nhan';
  /* E08-D105 · mức giống hiện ngay trên tấm CHỜ DUYỆT.
     Người chấm trong khối đang nhìn thumb nhỏ và tick nhanh; không có mức giống
     thì cú tick ấy là một đại lượng khác với thứ AC-5 D077 muốn đo. Tấm đã xác
     nhận không cần — quyết định của nó xong rồi (FR-2).
     Gọi ĐÚNG `chuGiong()` của trang xem ảnh, không chép lại ba mốc: hai bản sao
     của cùng một ngưỡng là hai thứ sẽ lệch nhau vào lúc không ai để ý (AC-2). */
  var giong = la ? '' : chuGiong(x.score);
  return '<div class="anh-o ' + (la ? 'alb' : 'cho') + '" data-cid="' + x.candidate_id
    + '" data-anh="' + x.event_photo_id + '">'
    + '<img loading="lazy" src="' + x.thumb_url + '" alt="' + esc(tt('anh_alt')) + '">'
    + (giong ? '<span class="giong' + (x.score >= 0.55 ? ' chac' : '') + '">'
        + esc(giong) + '</span>' : '')
    + '<span class="nhan">' + esc(tt(la ? 'nhan_alb' : 'nhan_cho')) + '</span>'
    + (la ? '' : '<label class="tick"><input type="checkbox"></label>')
    + '</div>';
}

/* Thanh nút duyệt. Nhãn LUÔN in số thật đang tick — không có nút nào nói "tất cả",
   vì "tất cả" là con số người dùng chưa đếm bằng mắt. */
function veThanh(n){
  return '<button class="btn sm ok" data-lo="xac-nhan"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_xac_nhan', { n: n })) + '</button>'
    + '<button class="btn sm bad" data-lo="tu-choi"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_tu_choi', { n: n })) + '</button>'
    + '<button class="btn sm" data-lo="bo-qua"' + (n ? '' : ' disabled') + '>'
    +   esc(fmt('lo_bo_qua', { n: n })) + '</button>';
}
function capNhatThanh(the){
  var pham = the.id ? '#' + the.id : '.khoi[data-gid="' + the.getAttribute('data-gid') + '"]';
  var n = demTick(pham);
  var thanh = the.querySelector('.thanhChon');
  if (thanh) thanh.innerHTML = veThanh(n) + (the.getAttribute('data-gid')
    ? '<div class="spacer"></div><button class="btn sm" data-mo="'
      + the.getAttribute('data-gid') + '">' + esc(tt('xem_het')) + '</button>' : '');
  the.querySelectorAll('.anh-o[data-cid]').forEach(function(o){
    o.classList.toggle('daChon', !!o.querySelector('input:checked')); });
  /* E08-D109 FR-4 · ô «chọn hết» của ĐÚNG phạm vi này — mỗi khối một ô, màn một
     khách giữ `#chonHetTrang` cũ. Trần của nó là số ô tick ĐANG có trong phạm vi
     (`cho` mới có ô tick; ảnh trong album không có), nên nó không thể với tới tấm
     của khách khác hay tấm chưa tải. Nhãn in N thật, cùng luật với nhãn nút duyệt.
     Đồng bộ ở đây chứ không phải chỉ lúc bấm: tick tay từng tấm cho đủ cả khối thì
     ô này phải tự đầy, và bỏ một tấm thì nó phải tự nhả — nếu không, ô nói "đã
     chọn hết" trong khi có tấm không được chọn. */
  var oHet = the.querySelector('.chonHetKhoi') || (the.id === 'manMotKhach' ? $('#chonHetTrang') : null);
  if (oHet){
    var tong = the.querySelectorAll('.anh-o[data-cid] input').length;
    oHet.checked = tong > 0 && n === tong;
    oHet.indeterminate = n > 0 && n < tong;
    oHet.disabled = tong === 0;
    var nhan = the.querySelector('.nhanChonKhoi');
    if (nhan){
      nhan.textContent = fmt('chon_het_khoi', { n: tong });
      oHet.closest('.chonHet').classList.toggle('an', tong === 0);
    }
  }
}

async function veKhoi(noiTiep){
  var offset = noiTiep ? KHOI.length : 0;
  var q = ($('#timKhach').value || '').trim();
  var j;
  try {
    j = await jget('/crm/face-match/khoi?loc=' + encodeURIComponent(LOC_KHOI)
      + '&limit=20&offset=' + offset + (q ? '&q=' + encodeURIComponent(q) : ''));
  } catch (_) { $('#khoiTom').textContent = tt('loi_nap'); return; }
  KHOI = noiTiep ? KHOI.concat(j.items || []) : (j.items || []);
  KHOI_TONG = j.tong || 0;
  $('#khoiTom').textContent = KHOI.length
    ? fmt('khoi_tom', { n: KHOI_TONG, c: KHOI.length }) : tt('khoi_rong');
  $('#khoiChu').textContent = tt('khoi_chu');
  $('#dsKhoi').innerHTML = KHOI.map(function(k){
    var dv = LANG === 'jp' && k.org_jp ? k.org_jp : (k.org || '');
    var anh = (k.anh || []).map(veTam).join('');
    if (k.con_lai > 0) anh += '<button class="mo-them" data-mo="' + k.guest_id + '">'
      + esc(fmt('con_lai', { n: k.con_lai })) + '</button>';
    return '<div class="card khoi" data-gid="' + k.guest_id + '">'
      + '<div class="top" style="margin-bottom:7px">'
      +   '<h3>' + esc(tenKh(k)) + '</h3>'
      +   (dv ? '<span class="hint">' + esc(dv) + '</span>' : '')
      + '</div>'
      + '<div class="khoi-so">'
      +   '<span class="cap"><span class="dem' + (k.so_album ? ' co' : '') + '" data-so="album">' + k.so_album
      +     '</span><span class="hint">' + esc(tt('n_album')) + '</span></span>'
      +   '<span class="cap"><span class="dem' + (k.so_cho ? ' cho' : '') + '" data-so="cho">' + k.so_cho
      +     '</span><span class="hint">' + esc(tt('n_cho')) + '</span></span>'
      + '</div>'
      /* Khách không có mẫu thì máy KHÔNG đoán được — nói thẳng, vì đó là lý do khối
         của họ rỗng, không phải vì chưa ai duyệt (giữ bài học AC-6 của D077). */
      + (k.so_mau ? '' : '<p class="canh" style="margin:0 0 8px">' + esc(tt('khong_mau')) + '</p>')
      /* E08-D109 FR-4 · ô chọn hết nằm TRONG card, ngay trên lưới của card — không
         phải một ô chung trên đầu list. Một ô chung sẽ phủ mọi khách đã tải, tức
         duyệt hộ những tấm người dùng chưa cuộn tới: đúng cái cửa hậu D103 sinh ra
         để đóng. Đặt ngoài `.thanhChon` vì `capNhatThanh` dựng lại phần đó sau MỖI
         cú tick — nhốt ô chọn hết vào đó là nó tự bỏ dấu ngay khi vừa bấm. */
      + '<label class="chonHet"><input type="checkbox" class="chonHetKhoi">'
      +   '<span class="nhanChonKhoi"></span></label>'
      + (anh ? '<div class="luoi" style="margin-top:9px">' + anh + '</div>'
             : '<p class="hint">' + esc(tt('khoi_khong_anh')) + '</p>')
      + '<div class="thanhChon"></div></div>';
  }).join('');
  document.querySelectorAll('.khoi').forEach(capNhatThanh);
  var het = KHOI.length >= KHOI_TONG;
  $('#khoiThem').disabled = het;
  $('#khoiThem').textContent = het ? tt('het_khach') : tt('khoi_them');
  DA_NAP = true;
  /* Vừa dựng lại từ dữ liệu mới, đúng ngôn ngữ hiện tại ⇒ hết cũ. Gỡ dấu ở ĐÂY chứ
     không phải lúc gọi: nhánh `catch` phía trên thoát sớm mà không đụng `#dsKhoi`,
     nên DOM cũ vẫn còn cũ — gỡ dấu trước khi biết có vẽ được hay không là tự nhận
     một list lỗi thời là list mới. */
  KHOI_CU = false;
}

/* ── Màn MỘT khách (FR-4) — chỗ đóng lỗ hổng «124 tấm không có lối vào» ── */
async function moMotKhach(gid, offset){
  if (!gid) return;
  /* Chỉ ghi chỗ cuộn khi ta đang thật sự RỜI list khối (nó đang hiện). Hàm này
     còn được gọi để đổi trang, để vẽ lại sau một lượt duyệt, và từ `#veLuoi` lúc
     quay về — mọi lần đó `scrollY` là của màn một khách, ghi vào đây là làm hỏng
     đúng con số mà `#veKhoi` sắp dùng. */
  if (!$('#manKhach').classList.contains('an')) SCROLL_KHOI = window.scrollY;
  KHACH_DANG = gid;
  KHACH_OFFSET = Math.max(0, offset || 0);
  /* Gỡ dấu TRƯỚC khi nạp: nếu lượt nạp này hỏng, `#anhMotKhach` còn nội dung của
     trang cũ — không có dấu thì lượt «về» sau đó sẽ tưởng DOM ấy là của trang này
     và hiện lại nguyên một trang sai. Không dấu = phải nạp lại, đó là phía an toàn. */
  $('#manMotKhach').removeAttribute('data-gid');
  $('#manMotKhach').removeAttribute('data-offset');
  hienMan('manMotKhach');
  var j;
  try {
    j = await jget('/crm/face-match/khoi/' + gid + '?limit=' + TRANG_KHACH + '&offset=' + KHACH_OFFSET);
  } catch (_) { $('#tomMotKhach').textContent = tt('loi_nap'); return; }
  KHACH_DL = j;
  $('#tenMotKhach').textContent = tenKh(j.khach || {});
  $('#tomMotKhach').textContent = fmt('khach_tom', { a: j.so_album, c: j.so_cho });
  $('#chuMotKhach').textContent = tt('khoi_chu');
  $('#anhMotKhach').innerHTML = (j.items || []).map(veTam).join('')
    || '<p class="hint">' + esc(tt('khoi_khong_anh')) + '</p>';

  var soTrang = Math.max(1, Math.ceil((j.tong || 0) / TRANG_KHACH));
  var trang = Math.floor(KHACH_OFFSET / TRANG_KHACH) + 1;
  $('#soTrang').textContent = fmt('trang_may', { t: trang, n: soTrang, s: (j.items || []).length });
  $('#trangTruoc').disabled = KHACH_OFFSET <= 0;
  $('#trangSau').disabled = KHACH_OFFSET + TRANG_KHACH >= (j.tong || 0);
  /* Nhãn nói RÕ trần: "trên trang này (tối đa 24)". Người dùng phải đọc được giới
     hạn của cú bấm ngay trên cú bấm, không phải suy ra từ hành vi. */
  var soCho = (j.items || []).filter(function(x){ return x.trang_thai === 'cho'; }).length;
  $('#nhanChonHet').textContent = fmt('chon_het', { n: soCho, m: TRANG_KHACH });
  $('#chonHetTrang').checked = false;
  $('#chonHetTrang').disabled = soCho === 0;
  capNhatThanh($('#manMotKhach'));
  /* Đóng dấu «DOM đang hiện là đúng khách này, đúng trang này». Lượt «về» từ màn
     xem đọc hai dấu này để biết được phép hiện lại DOM cũ hay phải nạp mới —
     khác khách hoặc khác offset thì bắt buộc nạp, vì giữ lại là giữ nhầm trang. */
  $('#manMotKhach').setAttribute('data-gid', String(gid));
  $('#manMotKhach').setAttribute('data-offset', String(KHACH_OFFSET));
}

/* ══════════ E08-D109 · quay về đúng chỗ, giữ nguyên việc đang làm ══════════ */
function khoiPhucCuon(y, sel){
  window.scrollTo(0, y);
  if (!sel) return;
  var el = document.querySelector(sel);
  if (!el) return;
  /* Lưới đầy ảnh `loading="lazy"`, nhưng `.anh-o img` có `aspect-ratio` nên chiều
     cao đã biết trước khi tệp về — khôi phục `scrollY` là đủ và khớp tới từng pixel.
     Cú `scrollIntoView` bên dưới CHỈ chạy khi phép khôi phục kia trượt (DOM đã đổi
     chiều cao, hoặc trang ngắn hơn lúc rời đi nên trình duyệt kẹp giá trị); để nó
     chạy vô điều kiện là tự phá con số vừa khôi phục. */
  var r = el.getBoundingClientRect();
  if (r.bottom <= 0 || r.top >= (window.innerHeight || 0)) el.scrollIntoView({ block: 'nearest' });
}

/* Về list khối. `veKhoi()` chỉ chạy khi list TRỐNG THẬT hoặc đã bị đánh dấu cũ —
   còn khối trên màn thì hiện lại chính DOM ấy: đó là chỗ giữ cả tick lẫn chỗ cuộn. */
function veManKhoi(gidNhin){
  var conKhoi = !KHOI_CU && !!$('#dsKhoi').querySelector('.khoi');
  hienMan('manKhach');
  if (!conKhoi){ veKhoi(); return; }
  khoiPhucCuon(SCROLL_KHOI, gidNhin ? '.khoi[data-gid="' + gidNhin + '"]' : null);
}

/* Về màn một khách. Cùng khách + cùng trang + DOM còn tấm ⇒ hiện lại, không nạp:
   một lượt `innerHTML` mới là mọi checkbox mới, tức mất sạch tick dù dữ liệu y hệt. */
function veManMotKhach(){
  var mk = $('#manMotKhach');
  var conTrang = mk.getAttribute('data-gid') === String(KHACH_DANG)
    && mk.getAttribute('data-offset') === String(KHACH_OFFSET)
    && !!$('#anhMotKhach').querySelector('.anh-o');
  if (!conTrang){ moMotKhach(KHACH_DANG, KHACH_OFFSET); return; }
  hienMan('manMotKhach');
  khoiPhucCuon(SCROLL_KHACH, null);
}

/* FR-3 · sau một cú quyết trên màn xem, sửa ĐÚNG ô của tấm ấy trên DOM đang giấu.
   Không `veKhoi()` cả list: cái giá của nó là mọi tick của mọi tấm khác. `data-cid`
   trên hàng gợi ý (`.goi`) và trên ô khối (`.anh-o`) là CÙNG một `crm_face_candidates.id`
   (face-match.js:200 và :371) — nên đây là phép sửa đúng một dòng, không phải đoán.
   Sửa cả con số của khối luôn: khối tự nói «9 chờ duyệt» mà đếm được 8 tấm chờ thì
   con số và thứ nhìn thấy nói hai điều khác nhau — đúng thứ khối này sinh ra để bỏ. */
function capNhatSauQuyet(cid, trangThai){
  document.querySelectorAll('.anh-o[data-cid="' + cid + '"]').forEach(function(o){
    if (!o.classList.contains('cho')) return;      // đã quyết rồi thì không đếm lần hai
    var the = o.closest('.khoi') || o.closest('#manMotKhach');
    if (trangThai === 'xac-nhan'){
      o.classList.remove('cho', 'daChon'); o.classList.add('alb');
      var tick = o.querySelector('.tick'); if (tick) tick.remove();
      var g = o.querySelector('.giong'); if (g) g.remove();   // mức giống chỉ có nghĩa lúc còn chờ
      var nh = o.querySelector('.nhan'); if (nh) nh.textContent = tt('nhan_alb');
      doiSo(the, 'album', 1);
    } else {
      /* tu-choi / bo-qua: máy chủ loại nó khỏi cả hai truy vấn khối, nên lượt nạp
         tới sẽ không có tấm này. Giữ nó lại là hiện một thứ vừa bị bỏ — và còn
         tick được, tức gửi lại được trong lô sau. Gỡ khỏi DOM. */
      o.remove();
    }
    doiSo(the, 'cho', -1);
    if (the) capNhatThanh(the);
  });
}
/* Cộng trừ đúng một đơn vị trên con số của phạm vi — không hỏi lại máy chủ, vì
   phép đổi ở đây là số học chắc chắn: một dòng rời `cho` sang `xac-nhan`. */
function doiSo(the, loai, d){
  if (!the) return;
  if (the.id === 'manMotKhach'){
    if (!KHACH_DL) return;
    var k = loai === 'album' ? 'so_album' : 'so_cho';
    KHACH_DL[k] = Math.max(0, (Number(KHACH_DL[k]) || 0) + d);
    $('#tomMotKhach').textContent = fmt('khach_tom', { a: KHACH_DL.so_album, c: KHACH_DL.so_cho });
    return;
  }
  var em = the.querySelector('.dem[data-so="' + loai + '"]');
  if (!em) return;
  var v = Math.max(0, (Number(em.textContent) || 0) + d);
  em.textContent = v;
  em.classList.toggle(loai === 'album' ? 'co' : 'cho', v > 0);
}

/* Một lượt duyệt nhiều. Gửi ĐÚNG các id đang tick trong phạm vi đó — không suy ra
   từ bộ lọc, không "tất cả khách này". */
async function duyetLo(pham, trangThai, sauDo){
  var ids = idsTick(pham);
  if (!ids.length) return;
  var kq = await jpost('/crm/face-match/quyet-nhieu', { ids: ids, trang_thai: trangThai });
  if (sauDo) await sauDo(kq);
}

/* ══════════ FR-10 · khoanh mặt trên ảnh sự kiện → ảnh mẫu ══════════
   Toạ độ đổi về ẢNH GỐC ngay lúc thả chuột: CSDL lưu theo ảnh gốc, còn trình
   duyệt đang hiện bản đã co. Đổi ở đây một lần, thay vì để mỗi chỗ đọc lại tự
   quy đổi — mỗi lần quy đổi là một lần có thể quên. */
var KHUNG_MOI = null;
function toaDoGoc(el, ev, the){
  var r = el.getBoundingClientRect();
  var t = (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;
  return { x: (t.clientX - r.left) / r.width  * Number(the.getAttribute('data-w')),
           y: (t.clientY - r.top)  / r.height * Number(the.getAttribute('data-h')) };
}
function batDauKhoanh(el, ev, the){
  if (!el.classList.contains('khoanh')) return;
  ev.preventDefault();
  var d = toaDoGoc(el, ev, the);
  KHUNG_MOI = { el: el, the: the, x0: d.x, y0: d.y, x1: d.x, y1: d.y };
  var cu = el.querySelector('.khung.moi'); if (cu) cu.remove();
  var i = document.createElement('i'); i.className = 'khung moi'; el.appendChild(i);
}
function keoKhoanh(ev){
  if (!KHUNG_MOI) return;
  ev.preventDefault();
  var d = toaDoGoc(KHUNG_MOI.el, ev, KHUNG_MOI.the);
  KHUNG_MOI.x1 = d.x; KHUNG_MOI.y1 = d.y;
  var W = Number(KHUNG_MOI.the.getAttribute('data-w')), H = Number(KHUNG_MOI.the.getAttribute('data-h'));
  var k = KHUNG_MOI.el.querySelector('.khung.moi'); if (!k) return;
  k.style.left   = (Math.min(KHUNG_MOI.x0, KHUNG_MOI.x1) / W * 100) + '%';
  k.style.top    = (Math.min(KHUNG_MOI.y0, KHUNG_MOI.y1) / H * 100) + '%';
  k.style.width  = (Math.abs(KHUNG_MOI.x1 - KHUNG_MOI.x0) / W * 100) + '%';
  k.style.height = (Math.abs(KHUNG_MOI.y1 - KHUNG_MOI.y0) / H * 100) + '%';
}
function thaKhoanh(){
  if (!KHUNG_MOI) return;
  var k = KHUNG_MOI, the = k.the;
  var w = Math.abs(k.x1 - k.x0), h = Math.abs(k.y1 - k.y0);
  var huong = the.querySelector('.khoanhHuong');
  /* Khung bé quá thì mặt cắt ra không đủ để nhúng — chặn ngay, đừng để tới lượt
     batch mới im lặng bỏ qua. */
  if (w < 24 || h < 24){
    the.querySelector('.khung.moi') && the.querySelector('.khung.moi').remove();
    huong.textContent = tt('khoanh_nho'); KHUNG_MOI = null; return;
  }
  the.dataset.box = JSON.stringify({ x: Math.min(k.x0,k.x1), y: Math.min(k.y0,k.y1), w: w, h: h });
  huong.textContent = tt('khoanh_chon');
  the.querySelector('.ganO').focus();
  KHUNG_MOI = null;
}
document.addEventListener('mousedown', function(e){
  var el = e.target.closest && e.target.closest('.anhto.khoanh');
  if (el) batDauKhoanh(el, e, el.closest('.card')); });
document.addEventListener('mousemove', keoKhoanh);
document.addEventListener('mouseup', thaKhoanh);
document.addEventListener('touchstart', function(e){
  var el = e.target.closest && e.target.closest('.anhto.khoanh');
  if (el) batDauKhoanh(el, e, el.closest('.card')); }, { passive: false });
document.addEventListener('touchmove', keoKhoanh, { passive: false });
document.addEventListener('touchend', thaKhoanh);

/* ══════════ Typeahead FR-4b — dùng ĐÚNG /crm/guests?q= sẵn có ══════════ */
var henTim = null;
document.addEventListener('input', function(e){
  if (!e.target.classList.contains('ganO')) return;
  var o = e.target, ds = o.parentElement.querySelector('.ta-ds');

document.addEventListener('click', async function(e){
  var oAnh = e.target.closest && e.target.closest('button.o[data-anh]');
  if (oAnh){ await moAnh(oAnh.getAttribute('data-anh'), 'luoi'); return; }

  /* ── E08-D103 · thao tác trong khối ── */
  /* Chạm ô tick thì CHỈ tick. Không có dòng này thì mỗi lần chọn một tấm lại nhảy
     sang trang xem ảnh, và chọn nhiều tấm thành bất khả thi. */
  if (e.target.closest && e.target.closest('.tick')) return;

  var oTam = e.target.closest && e.target.closest('.anh-o[data-anh]');
  if (oTam){
    /* FR-6 · mở đúng trang xem ảnh của D102, không dựng lối thứ hai. Nhớ mình đến
       từ khối hay từ màn một khách để nút quay lại trả về đúng chỗ vừa rời (AC-6). */
    /* E08-D109 · nhớ luôn KHỐI chứa tấm này. `scrollY` là phép khôi phục chính,
       cái này là lưới an toàn: nếu chiều cao list đổi giữa chừng thì con số cũ trỏ
       vào chỗ khác, mà thứ người dùng cần thấy lại là khối họ đang soát dở. */
    var tuKhoi = oTam.closest('.khoi');
    if (tuKhoi) GID_TU_TAM = tuKhoi.getAttribute('data-gid');
    await moAnh(oTam.getAttribute('data-anh'),
      oTam.closest('#manMotKhach') ? 'khach' : 'khoi');
    return;
  }

  var moK = e.target.closest && e.target.closest('[data-mo]');
  if (moK){ await moMotKhach(moK.getAttribute('data-mo'), 0); return; }

  var lock = e.target.closest && e.target.closest('.chip.lock');
  if (lock){
    LOC_KHOI = lock.getAttribute('data-lock');
    document.querySelectorAll('.chip.lock').forEach(function(c){
      c.setAttribute('aria-pressed', String(c === lock)); });
    await veKhoi(); return;
  }

  var nutLo = e.target.closest && e.target.closest('button[data-lo]');
  if (nutLo){
    var khoiCha = nutLo.closest('.khoi');
    var pham = khoiCha ? '.khoi[data-gid="' + khoiCha.getAttribute('data-gid') + '"]' : '#manMotKhach';
    await duyetLo(pham, nutLo.getAttribute('data-lo'), async function(){
      if (khoiCha) await veKhoi();
      /* Duyệt cả lô trên màn một khách đổi số của chính khách ấy trong list khối
         đang giấu — nhiều dòng một lượt, không vá bằng một ô được. Đánh dấu cũ để
         lượt «Khối theo khách» sau đó nạp lại thay vì hiện số đã lỗi thời. */
      else { KHOI_CU = true; await moMotKhach(KHACH_DANG, KHACH_OFFSET); }
    });
    return;
  }

  var chip = e.target.closest && e.target.closest('.chip.loc');
  if (chip){
    LOC = chip.getAttribute('data-loc');
    document.querySelectorAll('.chip.loc').forEach(function(c){
      c.setAttribute('aria-pressed', String(c === chip)); });
    await veLuoi(); return;
  }

  var nk = e.target.closest && e.target.closest('#nutKhoanh');
  if (nk){
    var theK = $('#theAnh'), anh = theK.querySelector('.anhto');
    var bat = !anh.classList.contains('khoanh');
    anh.classList.toggle('khoanh', bat);
    nk.textContent = bat ? tt('khoanh_thoi') : tt('khoanh');
    var hg = theK.querySelector('.khoanhHuong');
    hg.classList.toggle('an', !bat);
    if (bat) hg.textContent = tt('khoanh_huong'); else { delete theK.dataset.box;
      var kk = anh.querySelector('.khung.moi'); if (kk) kk.remove(); }
    return;
  }

  var g = e.target.closest && e.target.closest('.ta-ds div[data-gid]');
  if (g){
    var the = $('#theAnh');
    /* Cùng một ô typeahead phục vụ hai việc: đang khoanh thì lưu ẢNH MẪU (FR-10),
       không khoanh thì GẮN TÊN vào ảnh (FR-H2). Spec đòi dùng chung ô này. */
    if (the.dataset.box){
      await jpost('/crm/face-match/sample', {
        event_photo_id: Number(the.getAttribute('data-anh')),
        guest_id: Number(g.getAttribute('data-gid')), box: JSON.parse(the.dataset.box) });
      g.closest('.ta-ds').classList.add('an');
      $('#ganO').value = '';
      /* Đóng khoanh qua ĐÚNG một đường (dongKhoanh) rồi mới báo, thay vì tự dọn
         bốn thứ tại chỗ như bản trước: chính chỗ dọn-tay-thiếu-một-món ấy là lỗi

      dongKhoanh();
      var hg = the.querySelector('.khoanhHuong');
      hg.textContent = tt('mau_xong'); hg.classList.remove('an');
      return;
    }
    var kq = await jpost('/crm/face-match/assign', {
      event_photo_id: Number(the.getAttribute('data-anh')),

    $('#ganO').value = '';
    /* Gắn tên tay tạo một dòng album MỚI cho một khách bất kỳ — có thể là khách
       đang nằm trong list khối, mà không có `data-cid` nào trên list để sửa. Đây
       là chỗ duy nhất phải nhượng bộ: đánh dấu list cũ, nạp lại lúc quay về. */
    KHOI_CU = true;

    /* Báo SAU khi vẽ lại, không phải trước. Bản trước ghi câu này vào `#xemTom`
       rồi mới gọi vẽ lại — mà vẽ lại đặt đúng `#xemTom` thành dòng đếm, nên lời
       báo sống được đúng một nhịp rồi biến mất trước khi ai kịp đọc. */
    $('#baoXem').textContent = (kq && kq.da_trong_album) ? tt('da_trong') : tt('da_gan_xong');
    return;
  }

  var b = e.target.closest && e.target.closest('button[data-do]');
  if (b){
    var dong = b.closest('.goi');
    var cid = Number(dong.getAttribute('data-cid'));
    var viec = b.getAttribute('data-do');
    await jpost('/crm/face-match/' + viec, { id: cid });
    /* FR-3 · vá đúng một ô trên DOM đang giấu thay vì nạp lại cả list. Tên đường
       (`confirm`/`reject`/`skip`) và tên trạng thái trong CSDL (`xac-nhan`/…) là
       hai bảng chữ khác nhau — đổi ở đúng một chỗ, không rải `if` khắp nơi. */
    capNhatSauQuyet(cid, { confirm: 'xac-nhan', reject: 'tu-choi', skip: 'bo-qua' }[viec]);
    await lamMoiAnhDang();
    return;
  }
});

/* Mỗi lần tick đổi → vẽ lại nhãn nút của ĐÚNG phạm vi đó. Nhãn phải in số thật,
   nên nó phải đổi ngay theo cú tick, không đợi tới lúc bấm. */
document.addEventListener('change', function(e){
  var o = e.target;
  if (o.id === 'chonHetTrang'){
    /* «Chọn tất cả trên trang» — phạm vi là ĐÚNG các ô đang có trong DOM của trang
       này, mà DOM của trang này do máy chủ cắt ≤24. Không chạm tới trang khác,
       không chạm tới tấm chưa tải. */
    document.querySelectorAll('#anhMotKhach .anh-o[data-cid] input').forEach(function(i){
      i.checked = o.checked; });
    capNhatThanh($('#manMotKhach'));
    return;
  }
  /* E08-D109 FR-4 · «chọn hết» của MỘT khối. Phạm vi là `.khoi` chứa chính ô này,
     không phải `document` — nên nó không thể với sang khách bên cạnh. Và chỉ tấm
     `cho` mới có `input`, nên «hết» ở đây đúng nghĩa «hết tấm chờ đang hiện». */
  if (o.classList.contains('chonHetKhoi')){
    var theK = o.closest('.khoi');
    if (!theK) return;
    theK.querySelectorAll('.anh-o[data-cid] input').forEach(function(i){ i.checked = o.checked; });
    capNhatThanh(theK);
    return;
  }
  if (o.type !== 'checkbox' || !o.closest('.anh-o')) return;
  var khoiCha = o.closest('.khoi');
  if (khoiCha) capNhatThanh(khoiCha);
  else if (o.closest('#manMotKhach')) capNhatThanh($('#manMotKhach'));
});

/* G1 (Gate 2 D102) giữ nguyên tinh thần: dữ liệu tab Theo khách chỉ nạp khi người

$('#khoiThem').onclick = function(){ veKhoi(true); };
$('#trangTruoc').onclick = function(){ moMotKhach(KHACH_DANG, KHACH_OFFSET - TRANG_KHACH); };
$('#trangSau').onclick  = function(){ moMotKhach(KHACH_DANG, KHACH_OFFSET + TRANG_KHACH); };
var henKhoi = null;
$('#timKhach').addEventListener('input', function(){
  clearTimeout(henKhoi); henKhoi = setTimeout(function(){ veKhoi(); }, 250); });
$('#langBtn').onclick = function(){ setLang(LANG === 'jp' ? 'vn' : 'jp'); };
$('#themeBtn').onclick = function(){
  apDungTheme(document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light'); };

apDungTheme(nhoCu('crm_theme', 'nd_theme') === 'light' ? 'light' : '');
setLang(LANG);
jget('/crm/me').then(function(j){ $('#meRole').textContent = (j.role||'') + ' · ' + (j.email||''); }).catch(function(){});

/* Tab mở đầu do URL quyết định, không phải một mặc định cứng: `/crm/anh-su-kien`
   là Phân loại (thứ tự D102 — ảnh trước, tên gắn sau), `…/theo-khach` là khối theo
   khách. replaceState để mục lịch sử đầu tiên cũng mang `state.tab`, nếu không thì
   cú Back đầu tiên trả về một mục không có state và popstate không biết vẽ gì. */
history.replaceState({ tab: tabTuUrl() }, '', location.pathname + location.search);
if (tabTuUrl() === 'khach'){ TU_DAU = 'khoi'; hienMan('manKhach'); veKhoi(); }
else veLuoi().catch(function(){ $('#anhTom').textContent = tt('loi_nap'); });
</script>
