<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Đăng nhập · RSVP ESUHAI 20 năm</title>
<style>
  :root{--bg:#050d18;--panel:#0c1726;--gold:#d8b876;--cream:#f5efe1;--muted:#8a9bb0;--line:#1d2c40}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
    color:var(--cream);font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:24px}
  .card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:28px}
  h1{font-size:1.15rem;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:.85rem;margin:0 0 20px}
  label{display:block;font-size:.8rem;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0a1420;color:var(--cream);font-size:1rem}
  button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:10px;
    background:var(--gold);color:#1a1204;font-weight:700;font-size:1rem;cursor:pointer}
  .err{color:#ff9a8f;font-size:.85rem;margin-top:12px;min-height:1.1em}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Bảng điều khiển RSVP</h1>
    <p class="sub">ESUHAI Group · 20 năm · Trợ lý BTC</p>
    <label for="u">Tài khoản</label>
    <input id="u" name="user" autocomplete="username" value="admin">
    <label for="p">Mật khẩu</label>
    <input id="p" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Đăng nhập</button>
    <div class="err" id="err"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var err = document.getElementById('err'); err.textContent = '';
    try{
      var r = await fetch('/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      if(r.ok){ location.href = '/admin'; }
      else { var j = await r.json().catch(function(){return {};}); err.textContent = j.error || 'Đăng nhập thất bại.'; }
    }catch(_){ err.textContent = 'Lỗi kết nối.'; }
  });
</script>
</body>
</html>
